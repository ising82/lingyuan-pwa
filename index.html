<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><meta name="theme-color" content="#0f5e6e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="淩淵">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>淩淵 App 試用版</title></head><body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&family=IBM+Plex+Mono:wght@500&display=swap">
<style id="css">
/* Layout: phone-first single column; five views behind a thumb-reach bottom tab bar (今天 / 紀錄 / 待辦 / 知識 / 醫療). 今天 opens on the last feed and one-tap logging; everything else is reference. Deep-water palette kept from the checkpoint. */
:root{
  --bg:#f3f6f7; --surface:#ffffff; --ink:#14232b; --muted:#5b6b73; --line:#d8e1e4;
  --accent:#0f5e6e; --accent-soft:#e1eef0; --med:#6b3f8f; --med-soft:#f0e8f6;
  --red:#b3261e; --red-soft:#fbe9e7; --amber:#8a5a00; --amber-soft:#fdf1d8; --green:#2e6b3a; --green-soft:#e5f2e7; --grey-soft:#eceff1;
  --band1:#dcebee; --band2:#bcd8de; --dot:#0f5e6e; --scrim:rgba(10,20,25,.45);
  --feed-f:#2a78d6; --feed-m:#eb6834;
  --f-display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --nav-h:62px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1519; --surface:#132127; --ink:#e3ecef; --muted:#93a6ae; --line:#24363d;
  --accent:#6cc3d2; --accent-soft:#16343b; --med:#c9a4e8; --med-soft:#2a2036;
  --red:#ff8a80; --red-soft:#3a1d1b; --amber:#f2c063; --amber-soft:#3a2e12; --green:#8fd19c; --green-soft:#183020; --grey-soft:#1b2a30;
  --band1:#1b343b; --band2:#285661; --dot:#7fd6e4; --scrim:rgba(0,0,0,.6);
  --feed-f:#3987e5; --feed-m:#d95926;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1519; --surface:#132127; --ink:#e3ecef; --muted:#93a6ae; --line:#24363d;
  --accent:#6cc3d2; --accent-soft:#16343b; --med:#c9a4e8; --med-soft:#2a2036;
  --red:#ff8a80; --red-soft:#3a1d1b; --amber:#f2c063; --amber-soft:#3a2e12; --green:#8fd19c; --green-soft:#183020; --grey-soft:#1b2a30;
  --band1:#1b343b; --band2:#285661; --dot:#7fd6e4; --scrim:rgba(0,0,0,.6);
  --feed-f:#3987e5; --feed-m:#d95926;
  color-scheme:dark}
:root.night{--bg:#05090b; --surface:#0b1418; --ink:#c9b9a6; --muted:#857a6c; --line:#1a2328; --accent:#d29a5c; --accent-soft:#2a1f14; --dot:#d29a5c}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.65;-webkit-text-size-adjust:100%}
a{color:var(--accent)}
.wrap{max-width:680px;margin:0 auto;padding-inline:16px;padding-block:14px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px) + var(--clip-b,0px));display:flex;flex-direction:column;gap:18px}
.top{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted)}
h1{font-family:var(--f-display);font-weight:900;font-size:30px;line-height:1.15;margin:0}
.topbtns{grid-row:1 / span 2;grid-column:2;display:flex;gap:6px;align-items:center}
.sos{font-size:13.5px;font-weight:700;color:var(--red);background:var(--red-soft);border:1px solid var(--red);border-radius:999px;padding:7px 13px;text-decoration:none;white-space:nowrap}
.nightbtn{font-size:13px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 11px;cursor:pointer;white-space:nowrap}
.nightbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.agebar{grid-column:1 / -1;font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px}
.agebar b{color:var(--ink);font-weight:500;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.view{display:flex;flex-direction:column;gap:18px}
h2{font-family:var(--f-display);font-weight:900;font-size:21px;margin:6px 0 0;line-height:1.3;text-wrap:balance}
h3{font-size:15px;margin:0;font-weight:700}
.note{font-size:13px;color:var(--muted);margin:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
ul.plain{margin:0;padding-left:1.15em}
ul.plain li+li{margin-top:4px}
.warn{color:var(--red);font-weight:500}
.src{font-size:12.5px;color:var(--muted)}
.src summary{cursor:pointer;width:max-content}
.src ul{margin:4px 0 0;padding-left:1.2em}
.src a{word-break:break-all}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.rorow{font-size:13.5px;background:var(--grey-soft);border-radius:10px;padding:10px 12px;color:var(--ink);line-height:1.6}
.rorow #roDiag{color:var(--muted)}
.rorow #roDiag ol{margin:4px 0 0;padding-left:20px}
.rorow .btn{text-decoration:none;display:inline-block}
.sel{user-select:all;-webkit-user-select:all;word-break:break-all;font-size:12.5px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;margin-top:6px;color:var(--ink)}
html[data-mirror] .rorow{background:var(--accent-soft)}
.backbtn{position:fixed;left:16px;bottom:calc(var(--nav-h) + 12px + env(safe-area-inset-bottom,0px) + var(--clip-b,0px));z-index:7;background:var(--accent);color:var(--surface);border:0;border-radius:999px;padding:10px 16px;font-size:14.5px;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.25);cursor:pointer}
.savebar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 12px + env(safe-area-inset-bottom,0px) + var(--clip-b,0px));z-index:7;background:var(--ink);color:var(--bg);border-radius:999px;padding:8px 16px;font-size:13.5px;max-width:calc(100% - 32px);text-align:center}

/* today */
.feedcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.feedcard .lbl{font-size:12px;letter-spacing:.08em;color:var(--muted)}
.feedcard .since{font-family:var(--f-mono);font-size:40px;line-height:1.05;font-variant-numeric:tabular-nums;color:var(--accent)}
.feedcard .since small{font-family:var(--f-body);font-size:15px;color:var(--muted);margin-left:2px}
.feedcard .what{font-size:14px;color:var(--muted)}
.chips{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.stat{display:flex;flex-direction:column;align-items:flex-start;background:var(--bg);border-radius:10px;padding:6px 9px;min-width:0}
.stat b{font-family:var(--f-mono);font-size:18px;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:11.5px;color:var(--muted)}
.stat.low b{color:var(--amber)}
.stat.ok b{color:var(--green)}
.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.qb{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;font-size:13px;min-height:66px;justify-content:center}
.qb svg{width:24px;height:24px;stroke:var(--accent);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.qb.on{background:var(--accent);color:var(--surface);border-color:var(--accent)}
.qb.on svg{stroke:var(--surface)}
.seg.segc{grid-template-columns:repeat(4,1fr)}
.tag.edu{background:var(--green-soft);color:var(--green)}
.msec{display:flex;flex-direction:column;gap:18px}
html:not([data-mode="rw"]) [data-sheetgo],html:not([data-mode="rw"]) #qForm2{display:none!important}
.rtabs.mtabs{grid-template-columns:repeat(3,minmax(0,1fr))}
.rtabs.mtabs button{font-size:13px;letter-spacing:-.02em}
@media (max-width:359px){.rtabs button{font-size:12.5px}.rtabs.mtabs button{font-size:12px;white-space:normal;line-height:1.25;padding:4px 2px}}
.lastt .tacts{margin-top:6px}
#docCard,#repCard,#qPanel,#triage,#card,#aid{scroll-margin-top:12px}

/* v70 醫療頁：標題旁醫療卡按鈕、就醫三分頁、急救情境 */
.mhead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mcardbtn{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700;border:1.5px solid var(--red);color:var(--red);background:var(--red-soft);border-radius:999px;padding:7px 14px;cursor:pointer}
.mcardbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.mcard{position:fixed;inset:0 0 var(--clip-b,0px) 0;z-index:30;background:var(--bg);overflow:auto;-webkit-overflow-scrolling:touch}
.mcard-in{max-width:680px;margin:0 auto;padding:12px 16px calc(28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.mcard-hd{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0 8px;border-bottom:1px solid var(--line)}
.mcard-hd h2{margin:0}
.mcard-x{font:inherit;font-size:14.5px;font-weight:700;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 16px;cursor:pointer}
.mcard .grp{font-size:12.5px;letter-spacing:.08em;color:var(--muted);margin:6px 0 -2px;font-weight:700}
.mcard .q{color:var(--amber);font-size:13px}
.vsub{display:flex;flex-direction:column;gap:14px}
.vcard{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.vcard.soon{border-left-color:var(--red)}
.vcard .vd{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.vcard .vd b{font-family:var(--f-mono);font-size:20px;font-variant-numeric:tabular-nums;color:var(--accent)}
.vcard.soon .vd b{color:var(--red)}
.vcard .vd span{font-size:13px;color:var(--muted)}
.vcard h3{font-size:16.5px}
.vcard .vm{font-size:14px;line-height:1.6}
.vcard .vm a{white-space:nowrap}
.vcard ul{margin:0;padding-left:1.15em;font-size:14px}
.vcard .warnline{font-size:13.5px;color:var(--amber);background:var(--amber-soft);border-radius:8px;padding:6px 10px}
.trow{display:grid;grid-template-columns:3.4em minmax(0,1fr);gap:2px 10px;padding:9px 0;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink);font-size:14.5px}
.trow:last-child{border-bottom:0}
.trow .d{font-family:var(--f-mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:2px}
.trow .d.over{color:var(--red);font-weight:700}
.trow .why{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.vhist{display:flex;flex-direction:column}
.vhist .he{display:grid;grid-template-columns:3.6em minmax(0,1fr);gap:2px 10px;padding:10px 0;border-bottom:1px solid var(--line)}
.vhist .he:last-child{border-bottom:0}
.vhist .he .d{font-family:var(--f-mono);font-size:13px;color:var(--muted);padding-top:2px}
.vhist .he ul{margin:2px 0 0;padding-left:1.1em;font-size:14px}
.sosbar{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sosbar a{display:flex;flex-direction:column;align-items:center;justify-content:center;text-decoration:none;border-radius:12px;padding:10px 6px;font-weight:700;font-size:15px;line-height:1.3;text-align:center}
.sosbar a small{font-weight:400;font-size:12px}
.sosbar .r{background:var(--red);color:var(--surface)}
.sosbar .p{background:var(--surface);color:var(--accent);border:1px solid var(--accent)}
.aidgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.aidgrid button{font:inherit;font-size:13.5px;line-height:1.3;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:9px 4px;cursor:pointer;min-height:52px}
.aidgrid button.crit{border-color:var(--red);color:var(--red)}
.aidgrid button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
.aidgrid button.crit[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:var(--surface)}
.aidc{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.aidc.crit{border-color:var(--red)}
.aidc h2{margin:0}
.aidc .when{font-size:14px;background:var(--grey-soft);border-radius:8px;padding:8px 10px}
.aidc h4{margin:6px 0 0;font-size:14px;letter-spacing:.04em}
.aidc h4.do{color:var(--accent)} .aidc h4.no{color:var(--amber)} .aidc h4.go{color:var(--red)}
.aidc ol,.aidc ul{margin:0;padding-left:1.25em;font-size:14.5px}
.aidc li+li{margin-top:4px}
@media (min-width:520px){.aidgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}

.aid h3{font-size:16px;margin-top:4px}
.aid h3.cpr{color:var(--red)}
.aid .lnks{display:flex;flex-wrap:wrap;gap:8px}
.aid .lnks a,.aid .lnks button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--bg);color:var(--accent);border-radius:10px;padding:8px 12px;text-decoration:none;cursor:pointer}
.doc .dsec{border-top:1px solid var(--line);padding-top:6px}
.doc .dsec>summary{cursor:pointer;font-size:14px;font-weight:700;color:var(--accent);list-style:none}
.doc .dsec>summary::-webkit-details-marker{display:none}
.doc .dsec>summary::before{content:"▸ "}
.doc .dsec[open]>summary::before{content:"▾ "}
.doc .dsin{margin-top:6px;display:flex;flex-direction:column;gap:6px}
.rep{display:grid;grid-template-columns:3.6em minmax(0,1fr);gap:2px 10px;padding:10px 0;border-bottom:1px solid var(--line)}
.rep:last-child{border-bottom:0}
.rgrp{margin:2px 0 0;font-size:13.5px;color:var(--muted);letter-spacing:.04em}
details.rshut{border-top:1px solid var(--line);padding-top:8px}
details.rshut>summary{cursor:pointer;font-size:14px;color:var(--accent);line-height:1.6}
.rep .rd{font-family:var(--f-mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:2px}
.rep .rb{min-width:0;display:flex;flex-direction:column;gap:3px}
.rep .rh{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px}
.rep ul{margin:0;padding-left:1.1em;font-size:14px}
.rep .nx{font-size:13px;color:var(--muted)}
a.nx{color:var(--accent)}
.qb.arm{background:var(--amber-soft);border-color:var(--amber);color:var(--amber);box-shadow:0 0 0 2px var(--amber) inset}
.qb.arm svg{stroke:var(--amber)}
.qb.arm small{font-family:inherit;font-weight:700;opacity:1}
.games{display:flex;flex-direction:column;gap:8px}
.game{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;font-size:14.5px;background:var(--bg)}
.game.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.game .gt{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.game .gt b{font-size:15.5px}
.gtag{font-size:11.5px;font-weight:700;color:var(--surface);background:var(--accent);border-radius:999px;padding:2px 8px}
.gfor{font-size:12.5px;color:var(--muted)}
.segn{margin-bottom:2px}
.src.nev .plain{margin-top:6px;font-size:13.5px;color:var(--ink)}
.qb small{font-size:11px;color:inherit;opacity:.8;font-family:var(--f-mono)}
.timerbar{display:flex;align-items:center;gap:10px;background:var(--accent-soft);border-radius:12px;padding:10px 12px}
.alerts{display:flex;flex-direction:column;gap:8px}
.alertbox{border-radius:12px;padding:10px 14px;border:1px solid var(--red);background:var(--red-soft);display:flex;flex-direction:column;gap:2px}
.alertbox b{color:var(--red)}
.alertbox.soft{border-color:var(--amber);background:var(--amber-soft)}
.alertbox.soft b{color:var(--amber)}
.timerbar .tm{font-family:var(--f-mono);font-size:22px;font-variant-numeric:tabular-nums;color:var(--accent)}
.hero{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;align-items:end;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.hero .big{font-family:var(--f-mono);font-size:44px;line-height:1;font-variant-numeric:tabular-nums;color:var(--accent)}
.hero .big small{font-family:var(--f-body);font-size:15px;color:var(--muted);margin-left:4px}
.hero .stage{font-family:var(--f-display);font-weight:900;font-size:17px;line-height:1.35}
.hero .next{grid-column:1 / -1;font-size:13px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px;margin-top:6px}
.rule{border-radius:12px;padding:12px 14px;background:var(--red-soft);color:var(--ink);border:1px solid var(--red);display:flex;flex-direction:column;gap:2px}
.rule b{color:var(--red)}
.focus{display:flex;flex-direction:column;gap:10px}
.fc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.fc .t{font-weight:700}
.fc.ck{display:grid;grid-template-columns:auto 1fr;gap:4px 12px}
.fc.ck input{width:22px;height:22px;margin:2px 0 0;accent-color:var(--accent);cursor:pointer}
.fc.ck .bd{min-width:0;display:flex;flex-direction:column;gap:4px}
.fc.done{opacity:.6}
.fc.done .t{text-decoration:line-through}
.okline{border-radius:12px;padding:10px 14px;border:1px solid var(--green);background:var(--green-soft);font-size:14px}
.okline b{color:var(--green)}
.flagx{border-radius:12px;padding:10px 14px;border:1px solid var(--amber);background:var(--amber-soft);display:flex;flex-direction:column;gap:2px}
.flagx b{color:var(--amber)}
.flagx.warn{border-color:var(--red);background:var(--red-soft)}
.flagx.warn b{color:var(--red)}
.formhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.doc{border:2px solid var(--accent)}
.doc .ln{display:grid;grid-template-columns:5.2em 1fr;gap:2px 10px;font-size:14.5px}
.doc .ln .k{color:var(--muted);font-size:13px}
.doc h4{margin:6px 0 0;font-size:13.5px;color:var(--muted);letter-spacing:.04em}
.doc ul.plain{font-size:14px}
#growChart .hit{fill:transparent;cursor:pointer}
.dl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.dl li a{display:grid;grid-template-columns:3.3em 1fr auto;gap:10px;align-items:baseline;text-decoration:none;color:var(--ink)}
.dl .d{font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums;color:var(--muted)}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;text-decoration:underline;font-size:14px;text-align:left}
.noise{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.noise input[type=range]{flex:1;min-width:120px;accent-color:var(--accent)}

/* sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:var(--clip-b,0px);z-index:21;background:var(--surface);border-radius:18px 18px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:calc(88vh - var(--clip-b,0px));overflow:auto;display:flex;flex-direction:column;gap:12px;max-width:680px;margin:0 auto;border-top:1px solid var(--line)}
.sheet h3{font-family:var(--f-display);font-weight:900;font-size:19px}
.seg2{display:flex;flex-wrap:wrap;gap:6px}
.opt{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 14px;cursor:pointer;font-size:15px;min-width:3.2em}
.opt[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:700}
.opt.warnopt[aria-pressed="true"]{background:var(--red);border-color:var(--red)}
.sheet .acts{display:flex;gap:10px}
.sheet .acts .btn{flex:1;padding:12px}

/* records */
.daynav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.daynav button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 14px;cursor:pointer}
.tl{display:flex;flex-direction:column}
.tl .ev{display:grid;grid-template-columns:3.4em 1fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.tl .ev:last-child{border-bottom:0}
.tl .ev .tt{font-family:var(--f-mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.tl .ev .k{font-weight:700;margin-right:6px}
.tl .ev.alert .k{color:var(--red)}
.del{border:0;background:none;color:var(--muted);cursor:pointer;font-size:12.5px;padding:4px}
.del.arm{color:var(--red);font-weight:700}
.tl .ev .evb{display:flex;gap:2px;align-items:center}
.del.ed{color:var(--accent)}
.ivisit{margin:6px 0 2px;padding:8px 10px;border-left:4px solid var(--accent);background:var(--bg);border-radius:8px;display:flex;flex-direction:column;gap:4px;font-size:14px;line-height:1.55}
.ivisit.soon{border-left-color:var(--red)}
.ivisit .vd b{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.ivisit .vd span{color:var(--muted);font-size:13px}
.ivisit a{white-space:nowrap}
.ivisit ul{margin:0;padding-left:1.15em}
.ivisit .warnline{font-size:13.5px;color:var(--amber);background:var(--amber-soft);border-radius:8px;padding:6px 10px}
table.tb{border-collapse:collapse;width:100%;font-size:14px}
table.tb th,table.tb td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.tb th{font-weight:500;color:var(--muted);font-size:12.5px}
table.tb td:first-child{white-space:nowrap}
table.tb td.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
table.tb th.n{text-align:right}
.tbwrap{overflow-x:auto}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--grey-soft);border-radius:10px;padding:4px}
.seg button{border:0;background:none;border-radius:8px;padding:7px 4px;cursor:pointer;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--surface);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--f-mono);font-size:10px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:8px;border-radius:2px;margin-right:4px;vertical-align:middle}
.legend i.dash{height:0;width:16px;border-top:2px dashed var(--ink);border-radius:0;background:none}
:root{--poo:#9a6b2f}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--poo:#d0a066}}
:root[data-theme="dark"]{--poo:#d0a066}

.ichart{position:relative}
.itip{margin-top:8px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;line-height:1.6;display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.itip .full{grid-column:1/-1}
.itip b{font-family:var(--f-mono);font-weight:500}
.itip .sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
#intakeChart .hit,#diaperChart .hit{fill:transparent;cursor:pointer}
#intakeChart .sel,#diaperChart .sel{fill:var(--accent-soft)}
.intakehint{display:block;width:100%;margin-top:10px;text-align:left;background:var(--accent-soft);color:var(--ink);border:0;border-radius:10px;padding:9px 12px;font:inherit;font-size:13.5px;cursor:pointer}
.intakehint b{font-family:var(--f-mono);font-weight:500}
table.tb td.del-cell{text-align:right;padding-left:0}
table.tb-s{font-size:13px}
table.tb-s th,table.tb-s td{padding:6px 5px}
table.tb-s th{white-space:nowrap;font-size:12px}
table.tb-s .del{white-space:nowrap;font-size:12px;padding:3px 7px;min-height:0}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.form .full{grid-column:1 / -1}
.msg{font-size:13px;min-height:1.2em}
.msg.err{color:var(--red)}
.msg.ok{color:var(--green)}
.hist .hr{display:grid;grid-template-columns:4.6em 1fr auto;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.hist .hr:last-child{border-bottom:0}
.hist .vals{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:13px;min-width:0}
.msgrp{display:flex;flex-direction:column;gap:8px}
.ms{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;font-size:14.5px}
.ms .c{font-size:11.5px;color:var(--muted);margin-right:6px}
.ms.done span{color:var(--muted)}

/* todo */
.progress{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--muted)}
.bar{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.controls{display:flex;flex-wrap:wrap;gap:8px}
.controls .grp{display:flex;gap:6px;flex-wrap:wrap}
.pill{font-size:13px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 13px;cursor:pointer}
.pill[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.cat{display:flex;flex-direction:column;gap:14px}
.cat>h2{padding-bottom:4px;border-bottom:2px solid var(--accent)}
.cat.medical>h2{border-color:var(--med)}
.sub{display:flex;flex-direction:column;gap:10px}
.sub>h3{color:var(--muted);letter-spacing:.06em;font-size:13.5px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:12px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:12px 14px;scroll-margin-top:16px}
.item.done{opacity:.6}
.item.done .t{text-decoration:line-through}
.item input[type=checkbox],.ms input[type=checkbox],.qrow input[type=checkbox]{width:22px;height:22px;margin:2px 0 0;accent-color:var(--accent);cursor:pointer}
.body{min-width:0;display:flex;flex-direction:column;gap:4px}
.t{font-weight:700;font-size:15.5px;cursor:pointer}
.when{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--muted)}
.when.zh{font-family:var(--f-body)}
.chip{font-size:11.5px;border-radius:4px;padding:1px 7px;white-space:nowrap}
.s-over{background:var(--red-soft);color:var(--red)}
.s-week{background:var(--amber-soft);color:var(--amber)}
.s-month{background:var(--accent-soft);color:var(--accent)}
.s-later,.s-wait{background:var(--grey-soft);color:var(--muted)}
.s-done{background:var(--green-soft);color:var(--green)}
.kind{font-size:11.5px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 6px}
.desc{font-size:14.5px}
.desc ul{margin:2px 0 0;padding-left:1.2em}
.desc li+li{margin-top:2px}
.desc h4{font-size:13px;margin:8px 0 0;color:var(--med);letter-spacing:.04em}
.arch{font-size:12.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:6px;margin-top:2px}
.drv{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:14px}
.drv .c{font-family:var(--f-mono);text-align:right;color:var(--muted)}
.drv .c.zero{color:var(--amber)}

/* todo v2: summary tiles, category segment + sub-item dropdown, agenda grouped by date */
.tdhead{display:flex;align-items:baseline;justify-content:space-between;gap:4px 12px;flex-wrap:wrap}
.tdhead .progress{flex:1;min-width:160px}
.tsum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tsum button{display:flex;flex-direction:column;align-items:flex-start;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px;cursor:pointer;text-align:left;min-width:0}
.tsum button:disabled{cursor:default}
.tsum b{font-family:var(--f-mono);font-size:24px;line-height:1.15;font-weight:500;font-variant-numeric:tabular-nums}
.tsum span{font-size:12.5px;color:var(--muted)}
.tsum .u-over b{color:var(--red)} .tsum .u-over.has{border-color:var(--red);background:var(--red-soft)}
.tsum .u-week b{color:var(--amber)} .tsum .u-week.has{border-color:var(--amber);background:var(--amber-soft)}
.tsum .u-month b{color:var(--accent)}
.tsum .zero b{color:var(--muted)}
.tdctl{display:flex;flex-direction:column;gap:8px}
.selrow{display:flex;gap:12px;align-items:center}
.selwrap{position:relative;flex:1;min-width:0}
.selwrap select{appearance:none;-webkit-appearance:none;width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 34px 9px 12px;cursor:pointer;text-overflow:ellipsis}
.selwrap::after{content:"▾";position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;font-size:14px}
.donesw{display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--muted);white-space:nowrap;cursor:pointer}
.donesw input{width:20px;height:20px;margin:0;accent-color:var(--accent);cursor:pointer}
.agenda{display:flex;flex-direction:column;gap:24px}
.bk{display:flex;flex-direction:column;gap:12px}
.bk>h3{font-family:var(--f-display);font-weight:900;font-size:18px;display:flex;align-items:baseline;gap:8px;margin:0}
.bk>h3 small{font-family:var(--f-body);font-weight:400;font-size:13px;color:var(--muted)}
.bk.over>h3{color:var(--red)}
.dg{display:flex;flex-direction:column;gap:8px;scroll-margin-top:12px}
.dh{display:flex;flex-wrap:wrap;align-items:center;gap:2px 10px;font-size:13.5px;color:var(--muted)}
.dh .dt{font-family:var(--f-mono);font-size:16px;color:var(--ink);font-variant-numeric:tabular-nums}
.dh .age{color:var(--med);font-weight:500}
.dh .n{margin-left:auto;font-size:12.5px}
.item{gap:6px 12px}
.item.over{border-color:var(--red)}
.item .t{background:none;border:0;padding:0;margin:0;text-align:left;color:inherit;font:inherit;font-weight:700;font-size:15.5px;line-height:1.5;cursor:pointer}
.meta{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center}
.tag{font-size:11.5px;border-radius:4px;padding:1px 7px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.tag.med{background:var(--med-soft);color:var(--med)}
.kind.law{color:var(--red);border-color:var(--red)}
.opts{list-style:none;margin:2px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.opts li{display:grid;grid-template-columns:3.4em minmax(0,1fr);gap:1px 8px;align-items:baseline;font-size:14.5px;line-height:1.5}
.opts small{grid-column:2;font-size:12.5px;color:var(--muted)}
.pay{font-size:11.5px;text-align:center;border-radius:4px;padding:1px 0;white-space:nowrap}
.p-pub{background:var(--green-soft);color:var(--green)}
.p-nhi{background:var(--accent-soft);color:var(--accent)}
.p-self{background:var(--amber-soft);color:var(--amber)}
.p-opt{border:1px dashed var(--amber);color:var(--amber);padding:0}
.p-no{background:var(--grey-soft);color:var(--muted)}
.p-due{border:1px solid var(--red);color:var(--red);padding:0}
.addrow{display:flex;justify-content:flex-start}
.tsum button[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:-2px}
.tsum .hint{font-size:11px;color:var(--muted)}
.selrow .selwrap.k{flex:0 1 38%}
.frow{display:flex;align-items:center;gap:6px 14px;flex-wrap:wrap}
.fsum{font-size:13px;color:var(--muted);margin-left:auto}
.nowline{display:flex;align-items:center;gap:10px;color:var(--accent);font-size:12.5px;font-weight:700;margin:2px 0}
.nowline::before,.nowline::after{content:"";flex:1;border-top:1.5px dashed var(--accent)}
.addrow .btn{padding:8px 14px;font-size:14px}
.sheet .selwrap select{background:var(--bg)}
.more>summary{font-size:13px;color:var(--accent);cursor:pointer;width:max-content;list-style:none;padding:2px 0}
.more>summary::-webkit-details-marker{display:none}
.more>summary::before{content:"▸ "}
.more[open]>summary::before{content:"▾ "}
.more .in2{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.more .src ul{margin:2px 0 0}
.agenda.rail .bk>.dg{position:relative;padding-left:22px}
.agenda.rail .bk>.dg::before{content:"";position:absolute;left:5px;top:10px;bottom:-12px;width:2px;background:var(--line)}
.agenda.rail .bk>.dg:last-child::before{bottom:0}
.agenda.rail .bk>.dg>.dh::before{content:"";position:absolute;left:0;top:4px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--med)}
.agenda.rail .dh .age{font-size:14.5px}
.agenda.rail .bk>.dg.is-done>.dh::before{border-color:var(--green);background:var(--green)}
.agenda.rail .bk>.dg.is-over>.dh::before{border-color:var(--red);background:var(--red-soft)}
.agenda.rail .nowline{padding-left:0}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:16px;font-size:14.5px;color:var(--muted)}
.paylegend{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:12.5px;color:var(--muted)}
.paylegend .pay{display:inline-block;min-width:3.4em}

/* care accordions */
.acc{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.acc>summary{list-style:none;cursor:pointer;padding:13px 16px;display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center}
.acc>summary::-webkit-details-marker{display:none}
.acc>summary .h{font-weight:700;font-size:16px}
.acc>summary .g{grid-column:1;font-size:13px;color:var(--muted)}
.acc>summary .chev{grid-row:1 / span 2;grid-column:2;color:var(--muted);transition:transform .2s;font-size:14px}
.acc[open]>summary .chev{transform:rotate(90deg)}
.acc .in{padding:12px 16px 14px;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line)}
.acc h4{margin:4px 0 0;font-size:13.5px;color:var(--accent);letter-spacing:.04em}
.calc{background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:14px}
.calc b{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.myth{display:grid;grid-template-columns:1fr;gap:2px;padding:8px 0;border-bottom:1px solid var(--line)}
.myth:last-child{border-bottom:0}
.myth .say{font-weight:700}
.myth .say::before{content:"常聽到：";font-weight:500;color:var(--muted);font-size:12.5px}
.myth .fact::before{content:"實際：";color:var(--accent);font-weight:700;font-size:12.5px}
.segk{grid-template-columns:repeat(4,1fr)}
.klinks{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0 0;font-size:13px;color:var(--muted)}
.klinks button{font-size:13px;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:3px 10px;cursor:pointer;color:var(--accent)}
.ctb td{vertical-align:top}
.ctb .cst{white-space:nowrap;font-size:12.5px;font-weight:700}
.ctb .cst.past{color:var(--muted)}
.ctb .cst.now{color:var(--red)}
.ctb .cst.next{color:var(--green)}
.ctb .cw{display:block;font-size:12px;color:var(--muted)}
.segk button{font-size:13.5px;padding:7px 1px;white-space:nowrap}
.ksearch{position:relative}
.ksearch input{width:100%;box-sizing:border-box;-webkit-appearance:none;appearance:none;font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px 9px 36px}
.ksearch input::placeholder{color:var(--muted)}
.ksearch .kico{position:absolute;left:11px;top:50%;transform:translateY(-50%);display:flex;color:var(--muted);pointer-events:none}
.ksearch .kico svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.klist{display:flex;flex-direction:column;gap:10px}
.kgh{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--accent);letter-spacing:.06em;margin-top:6px}
.kgh span{font-weight:500;color:var(--muted);letter-spacing:0}
.kgh::after{content:"";flex:1;border-top:1px solid var(--line)}
.klist .kgh:first-child{margin-top:0}
.kchk{margin:0;font-size:12px;color:var(--muted)}
ol.plain{margin:0;padding-left:1.4em}
ol.plain li+li{margin-top:4px}
.kstd .in{font-size:14px}
.kcat{display:inline-block;font-size:11.5px;line-height:1.5;color:var(--accent);border:1px solid var(--line);border-radius:999px;padding:0 7px;margin-right:6px;vertical-align:1px}

/* sick */
.tier{background:var(--surface);border:1px solid var(--line);border-left-width:5px;border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.tier.t1{border-left-color:var(--red)}
.tier.t2{border-left-color:var(--amber)}
.tier.t3{border-left-color:var(--accent)}
.tier.t4{border-left-color:var(--green)}
.tier.t4 .lab{color:var(--green)}
.kchips{display:flex;flex-wrap:wrap;gap:6px}
.kchips button{font:inherit;font-size:13.5px;border:1px solid var(--line);background:var(--bg);color:var(--accent);border-radius:999px;padding:5px 11px;cursor:pointer}
.tier .lab{font-size:12px;letter-spacing:.08em;font-weight:700}
.tier.t1 .lab{color:var(--red)} .tier.t2 .lab{color:var(--amber)} .tier.t3 .lab{color:var(--accent)}
.tier h3{font-size:17px;font-family:var(--f-display);font-weight:900}
.cardx{background:var(--surface);border:2px solid var(--red);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;scroll-margin-top:16px}
.cardx .ln{display:grid;grid-template-columns:5.6em 1fr;gap:2px 10px;font-size:14.5px}
.cardx .ln .k{color:var(--muted);font-size:13px}
.cardx .tel{font-family:var(--f-mono);font-size:16px;font-variant-numeric:tabular-nums}
.cardx a.tel{display:inline-block;color:var(--accent);text-decoration:underline;text-underline-offset:3px;padding:2px 0}
.navl{margin-left:10px;font-size:13.5px;color:var(--accent);white-space:nowrap}
.tacts{display:flex;flex-wrap:wrap;gap:8px;margin-top:2px}
.tacts a,.tacts button{font:inherit;font-size:14.5px;font-weight:700;text-decoration:none;border-radius:10px;padding:9px 14px;border:1px solid var(--accent);background:var(--surface);color:var(--accent);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.tacts .p{background:var(--accent);color:var(--surface)}
.tacts .r{background:var(--red);border-color:var(--red);color:var(--surface)}
.tnote{font-size:12.5px;color:var(--muted)}
.lastt{font-size:14px;border-top:1px dashed var(--red);padding-top:6px;margin-top:4px}
.lastt b{color:var(--red)}
.qrow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;font-size:14.5px;padding:6px 0;border-bottom:1px solid var(--line)}
.qrow:last-child{border-bottom:0}
.qrow.done .qt{color:var(--muted);text-decoration:line-through}
.qrow .qb2{min-width:0;display:flex;flex-direction:column;gap:4px}
.qrow .qans{font-size:13.5px;background:var(--green-soft);border-radius:8px;padding:5px 9px;color:var(--ink);white-space:pre-wrap}
.qrow .qans b{color:var(--green);font-weight:700;margin-right:4px}
.qrow textarea{font:inherit;font-size:16px;width:100%;min-height:64px;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--bg);color:var(--ink)}
.qrow .qact{display:flex;gap:12px;flex-wrap:wrap}

.seg.vseg{grid-template-columns:repeat(2,1fr)}
.fsbtn{font-weight:700;letter-spacing:-.02em}
.fsbtn.on{border-color:var(--accent);color:var(--accent)}
.fspanel{grid-column:1 / -1;margin-top:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.fshd{display:flex;justify-content:space-between;align-items:center;font-size:14px}

.fsrow input[type=range]{flex:1;min-width:0;height:36px;margin:0;accent-color:var(--accent)}
.fsa{font-size:13px;color:var(--muted)}
.fsA{font-size:22px;font-weight:700;color:var(--muted)}
.fsbtns{display:flex;gap:8px;justify-content:flex-end}
.fsbtns .btn{padding:7px 14px;font-size:14px}
html.fs-big .top{grid-template-columns:minmax(0,1fr)}
html.fs-big .top .eyebrow{grid-row:1}
html.fs-big .top h1{grid-row:2}
html.fs-big .topbtns{grid-row:3;grid-column:1;justify-content:flex-start;flex-wrap:wrap;margin-top:6px}

html.fs-big .fspanel{grid-row:5}
html.fs-big .rtabs,html.fs-big .rtabs.mtabs{grid-template-columns:repeat(3,minmax(0,1fr))}
html.fs-big .rtabs button,html.fs-big .seg button{white-space:normal;line-height:1.25;padding:6px 2px;word-break:break-all}
html.fs-big .tabs button{line-height:1.2}
html.fs-big summary{white-space:normal;max-width:100%}
textarea,input[type=text],input[type=number],input[type=date],input[type=time]{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
textarea{min-height:76px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--muted);min-width:0}

/* bottom nav */
.tabs{position:fixed;left:0;right:0;bottom:var(--clip-b,0px);z-index:5;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .in{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h)}
.tabs button{border:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11.5px;color:var(--muted);position:relative}
.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="page"]{color:var(--accent);font-weight:700}
.tabs button[aria-current="page"]::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.tabs .badge{position:absolute;top:7px;left:calc(50% + 6px);min-width:1.6em;height:1.6em;border-radius:.8em;background:var(--red);color:var(--surface);font-size:10px;line-height:1.6em;padding:0 4px;font-family:var(--f-mono)}
footer{font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:6px}
/* records v48: overview cards + sub-tabs */
.rtabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:4;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;background:var(--grey-soft);border-radius:10px;padding:4px;box-shadow:0 0 0 8px var(--bg)}
.rtabs::-webkit-scrollbar{display:none}
.rtabs button{border:0;background:none;color:var(--ink);border-radius:8px;padding:7px 0;font-size:14px;cursor:pointer;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:clip}
.rtabs button[aria-pressed="true"]{background:var(--surface);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.rsec{display:flex;flex-direction:column;gap:14px}
.rcards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.rcard{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 12px 10px;cursor:pointer;min-width:0;font:inherit;color:inherit}
.rcard.wide{grid-column:1 / -1}
.rcard .rc-n{font-size:13px;color:var(--muted);font-weight:700;letter-spacing:.06em}
.rcard .rc-v{font-family:var(--f-mono);font-size:24px;font-weight:500;line-height:1.25;font-variant-numeric:tabular-nums}
.rcard .rc-v small{font-family:var(--f-body);font-size:13px;color:var(--muted);margin-left:3px;font-weight:400}
.rcard .rc-s{font-size:12px;color:var(--muted);line-height:1.45}
.rcard .spark{display:block;width:100%;height:30px;margin-top:4px}
.rcard .rc-go{font-size:12px;color:var(--accent);margin-top:auto;padding-top:4px}
.rcard.lv-soft{border-color:var(--amber);background:var(--amber-soft)}
.rcard.lv-warn{border-color:var(--red);background:var(--red-soft)}
.seg.segr{grid-template-columns:repeat(4,1fr)}
.seg.segr.segr3{grid-template-columns:repeat(3,1fr)}
.gsum h3{font-size:15px}
.gsum .gh{font-size:14.5px;line-height:1.65;margin:0}
.gsum.lv-soft{border-color:var(--amber)}
.gsum.lv-warn{border-color:var(--red)}
.gms{display:flex;flex-direction:column;border-top:1px solid var(--line);margin-top:2px}
.gm{display:grid;grid-template-columns:2.8em minmax(0,1fr);gap:0 10px;align-items:baseline;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:8px 6px;cursor:pointer;font:inherit;color:inherit;border-radius:0}
.gm:last-child{border-bottom:0}
.gm b{font-size:14px}
.gm .gv{font-family:var(--f-mono);font-size:14px;font-variant-numeric:tabular-nums}
.gm .gl{grid-column:2;font-size:13px;color:var(--muted);line-height:1.55}
.gm[aria-pressed="true"]{background:var(--accent-soft);border-radius:8px}
.gm[aria-pressed="true"] b{color:var(--accent)}
.gpsum{font-size:13px;line-height:1.6;margin:0;color:var(--muted)}
#growSum .okline,#growSum .flagx{font-size:15px;line-height:1.6}
.gsl{display:flex;flex-direction:column;gap:2px;margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.gsl button{background:none;border:0;padding:3px 0;text-align:left;font:inherit;font-size:13.5px;line-height:1.55;color:var(--ink);cursor:pointer;font-weight:400}
.gsl button b{margin-right:6px;color:inherit}
.gsl button[aria-pressed="true"] b{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.gtab small{display:block;color:var(--muted);font-size:11.5px;font-family:var(--f-body);line-height:1.3}
.gtab td{vertical-align:top}
.gtab th,.gtab td.n{white-space:nowrap}
.gtab small{white-space:nowrap}
@media (prefers-reduced-motion: reduce){.bar i,.acc>summary .chev{transition:none}}
.whorow{margin-top:-4px}.whorow .whosel{flex:0 1 128px}.whorow .whosel select{padding:7px 30px 7px 10px;font-size:15px}.whorow #handBtn{margin-left:auto}.feedcard .nextfeed{margin-top:2px}.feedcard .nextfeed b{color:var(--ink)}.hand{white-space:pre-wrap;word-break:break-word;font:inherit;font-size:14.5px;line-height:1.65;margin:0;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;user-select:text;-webkit-user-select:text}.medhd{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14.5px;line-height:1.6}.medhd .note{margin:2px 0 0}.medhd .mi{display:flex;flex-direction:column;gap:8px;margin-top:10px}.medhd .linkbtn{margin-top:4px}</style>
<template id="shell">
<div class="wrap">
  <header class="top">
    <div class="eyebrow">0–5 歲照護指南</div>
    <div class="topbtns"><button type="button" class="nightbtn fsbtn" id="fsBtn" aria-expanded="false" aria-controls="fsPanel" aria-label="調整文字大小">Aa</button><button type="button" class="nightbtn" id="nightBtn" aria-pressed="false">夜間</button><a class="sos" href="#card" id="sosBtn">緊急</a></div>
    <h1>張淩淵</h1>
    <div class="agebar"><span><b id="ageDaysTop">—</b> 天</span><span id="ageWeekTop">—</span><span>出生 <b>2026/10/01</b></span><span><b>2836</b> g</span></div>
    <div class="fspanel" id="fsPanel" hidden=""><div class="fshd"><span>文字大小</span><b id="fsVal">100%</b></div><div class="fsrow"><span class="fsa" aria-hidden="true">A</span><input type="range" id="fsRange" min="85" max="160" step="5" value="100" aria-label="文字大小"><span class="fsA" aria-hidden="true">A</span></div><div class="fsbtns"><button type="button" class="btn ghost" id="fsReset">恢復預設 110%</button><button type="button" class="btn" id="fsDone">完成</button></div></div>
  </header>

  <!-- ============ 今天 ============ -->
  <section class="view" id="v-today" data-view="today">
    <div class="feedcard">
      <div class="row" style="justify-content:space-between;align-items:baseline">
        <span class="lbl">距離上次餵奶</span><span class="note" id="clockNow"></span>
      </div>
      <div class="since" id="sinceFeed">—</div>
      <div class="what" id="lastFeedWhat">還沒有餵奶紀錄</div>
      <div class="what nextfeed" id="nextFeed" hidden=""></div>
      <div class="chips" id="todayStats"></div>
      <button type="button" class="intakehint" id="todayIntake" hidden=""></button>
    </div>
    <div class="alerts" id="alerts"></div>
    <div class="timerbar" id="bfTimer" hidden="">
      <div style="flex:1;min-width:0"><div class="note" id="bfTimerSide">親餵計時中</div></div>
      <button type="button" class="btn ghost" id="bfSwitch">換邊</button>
      <button type="button" class="btn" id="bfStop">結束</button>
    </div>
    <div class="timerbar" id="sleepBar" hidden="">
      <div style="flex:1"><div class="note">睡覺中</div><div class="tm" id="sleepTm">00:00</div></div>
      <button type="button" class="btn" id="wakeBtn">醒了</button>
    </div>
    <div id="quickWrap">
      <div class="quick" id="quick">
        <button type="button" class="qb" data-q="probio" id="qbPbBtn"><svg viewBox="0 0 24 24"><path d="M12 3.5c3.2 3.9 5.5 6.9 5.5 10.2a5.5 5.5 0 0 1-11 0c0-3.3 2.3-6.3 5.5-10.2z"></path><path d="M9.3 14.2a2.800 2.800 0 0 0 2.2 2.6"></path></svg>益生菌<small id="qbPb"></small></button>
        <button type="button" class="qb" data-q="bottle"><svg viewBox="0 0 24 24"><path d="M10 2h4M10.5 2v3l-2 3v12a2 2 0 0 0 2 2h3a2 2 0 0 0 2-2V8l-2-3V2"></path><path d="M8.5 12h7"></path></svg>瓶餵</button>
        <button type="button" class="qb" data-q="diaper"><svg viewBox="0 0 24 24"><path d="M3 7h18v3a9 9 0 0 1-18 0z"></path><path d="M8 7v2M16 7v2"></path></svg>尿布</button>
        <button type="button" class="qb" data-q="sleep"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"></path></svg><span id="qbSleepLbl">睡了</span></button>
        <button type="button" class="qb" data-q="med"><svg viewBox="0 0 24 24"><rect x="3" y="8.5" width="18" height="7" rx="3.5" transform="rotate(-45 12 12)"></rect><path d="M9.5 9.5l5 5"></path></svg>用藥<small id="qbMed"></small></button>
        <button type="button" class="qb" data-q="temp"><svg viewBox="0 0 24 24"><path d="M14 14.8V4a2 2 0 0 0-4 0v10.8a4 4 0 1 0 4 0z"></path></svg>體溫</button>
        <button type="button" class="qb" data-q="note"><svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"></path></svg>狀況</button>
        <button type="button" class="qb" data-q="weight"><svg viewBox="0 0 24 24"><rect x="3.5" y="4" width="17" height="16" rx="3"></rect><path d="M8.5 9.5a5 5 0 0 1 7 0"></path><path d="M12 9.5l1.5-1.8"></path></svg>體重<small id="qbW"></small></button>
      </div>
    </div>
    <div class="row whorow"><label class="note" for="whoSel">記錄者</label><span class="selwrap whosel"><select id="whoSel" aria-label="記錄者"><option value="">未設定</option><option>爸爸</option><option>媽媽</option><option>奶奶</option><option>外婆</option><option>外公</option><option>其他</option></select></span><button type="button" class="btn ghost" id="handBtn">交班摘要</button></div>
    <div class="rorow" id="roNote" hidden=""><b id="roText">目前只能看，不能記錄。</b>
      <div id="roDiag" style="margin-top:4px"></div>
      <div class="row" id="roLinkRow" hidden="" style="margin-top:8px"><a class="btn" id="roLink" href="#" target="_blank" rel="noopener">開啟家人編輯版</a></div>
      <div class="mono sel" id="roUrl" hidden=""></div></div>
    <div class="hero">
      <div class="big"><span id="ageDays">—</span><small>天</small></div>
      <div><div class="note" id="ageSub">—</div><div class="stage" id="stageTitle">—</div></div>
      <div class="next" id="nextMark">—</div>
    </div>
    <div class="panel">
      <h3>接下來的截止與回診</h3>
      <ol class="dl" id="nextDue"></ol>
      <button class="linkbtn" type="button" data-go="todo">看全部待辦</button>
    </div>
    <div><h2>這個階段要注意</h2><p class="note">依日齡自動切換。最上面是依最近紀錄自動檢查的結果；有框框的項目，做完打勾就收起來。</p></div>
    <div class="alerts" id="dailyCheck"></div>
    <div class="focus" id="focusList"></div>
    <button type="button" class="linkbtn" id="focusDoneBtn" hidden=""></button>
    <div class="panel" id="linksPanel" hidden="">
      <h3>分享給家人</h3>
      <p class="note"><b>張淩淵APP家人版</b>（就是這一頁）：只有被邀請為「編輯者」的照顧者能開、能記錄。新照顧者請爸爸用 Email 邀請。</p>
      <div class="mono sel" id="famUrl"></div>
      <div class="row" style="margin-top:10px"><button type="button" class="btn ghost" id="copyPub">複製連結</button></div>
    </div>
  </section>

  <!-- ============ 紀錄 ============ -->
  <section class="view" id="v-log" data-view="log" hidden="">
    <div class="rhead"><h2>紀錄</h2><p class="note">在「今天」頁按按鈕記錄。點卡片看圖表，或用下面的標籤切換。</p></div>
    <nav class="rtabs" id="rtabs" aria-label="紀錄分類"></nav>
    <div class="rsec" data-rsec="home">
      <div class="rcards" id="rcards"></div>
      <p class="note">卡片上的小線是最近幾次的走勢；黃框、紅框表示自動檢查有提醒，點進去看細節。</p>
    </div>
    <div class="rsec" data-rsec="intake" hidden="">
      <div id="intakeSec"><h2 id="intakeH">喝奶量趨勢</h2><p class="note" id="intakeSub">每天瓶餵總量（配方奶＋瓶餵母乳），虛線是依當天體重算的參考量。</p></div>
      <div class="seg" id="imSeg" role="group" aria-label="看哪一項"><button type="button" data-im="feed" aria-pressed="true">喝奶</button><button type="button" data-im="pee">尿尿</button><button type="button" data-im="poop">大便</button></div>
      <div class="seg segr" data-rng="intake" role="group" aria-label="時間範圍"><button type="button" data-days="7">7 天</button><button type="button" data-days="14">14 天</button><button type="button" data-days="30">30 天</button><button type="button" data-days="90">90 天</button></div>
      <div class="panel" id="feedPanel">
        <div class="chips" id="intakeStats"></div>
        <div class="ichart">
          <svg class="chart" id="intakeChart" viewBox="0 0 360 214" role="img" aria-label="最近 14 天每日喝奶量長條圖"></svg>
        </div>
        <div class="legend"><span><i style="background:var(--feed-f)"></i>配方奶</span><span><i style="background:var(--feed-m)"></i>母乳（瓶餵）</span><span><i class="dash"></i>參考量（每公斤 165 ml）</span></div>
        <div class="itip" id="intakeTip" aria-live="polite"></div>
        <p class="note" id="intakeNote"></p>
        <div id="intakeVerdict" style="margin-top:10px"></div>
      </div>
      <div class="panel" id="diaperPanel" hidden="">
        <div class="chips" id="diaperStats"></div>
        <svg class="chart" id="diaperChart" viewBox="0 0 360 200" role="img" aria-label="每日尿布長條圖"></svg>
        <div class="legend" id="diaperLegend"></div>
        <div class="itip" id="diaperTip" aria-live="polite"></div>
        <p class="note" id="diaperNote"></p>
      </div>
      <div class="panel" id="dayFormPanel" hidden="">
        <div class="formhead"><h3 id="dayFormTitle">修改這天總數</h3><button type="button" class="del" id="dayFormClose">收起</button></div>
        <p class="note">月子中心或保母只給每日總數時用這裡（例如紀錄本上的配方奶、母乳量、尿布次數）。同一天再存一次會覆蓋；那天如果已經有逐筆紀錄，以逐筆為準。</p>
        <form class="form" id="dform" novalidate="">
          <label class="f full" for="d-date">日期<input type="date" id="d-date"></label>
          <label class="f" for="d-fm">配方奶（ml）<input type="number" id="d-fm" inputmode="numeric" min="0" max="2000" step="1" placeholder="例 310"></label>
          <label class="f" for="d-bm">母乳瓶餵（ml）<input type="number" id="d-bm" inputmode="numeric" min="0" max="2000" step="1" placeholder="例 110"></label>
          <label class="f" for="d-bf">親餵（分鐘）<input type="number" id="d-bf" inputmode="numeric" min="0" max="600" step="1" placeholder="沒有填 0"></label>
          <label class="f" for="d-wet">濕尿布（片）<input type="number" id="d-wet" inputmode="numeric" min="0" max="40" step="1" placeholder="例 14"></label>
          <label class="f" for="d-poop">便便（次）<input type="number" id="d-poop" inputmode="numeric" min="0" max="40" step="1" placeholder="例 7"></label>
          <label class="f" for="d-note">備註<input type="text" id="d-note" maxlength="120" placeholder="例 黃軟便；黃疸 9.2"></label>
          <div class="full row"><button class="btn" type="submit" id="d-save">儲存</button><span class="msg" id="d-msg"></span></div>
        </form>
      </div>
    </div>
    <div class="rsec" data-rsec="sleep" hidden="">
      <div id="sleepSec"><h2>睡眠與清醒</h2><p class="note">每天哪些時間在睡（色塊）、哪些時間醒著（灰底）。點一天看細節。</p></div>
      <div class="seg segr segr3" data-rng="sleep" role="group" aria-label="時間範圍"><button type="button" data-days="7">7 天</button><button type="button" data-days="14">14 天</button><button type="button" data-days="30">30 天</button></div>
      <div class="panel">
        <div class="chips" id="sleepStats"></div>
        <svg class="chart" id="sleepChart" viewBox="0 0 360 260" role="img" aria-label="近 14 天睡眠與清醒時間"></svg>
        <div class="legend" id="sleepLegend"><span><i style="background:var(--accent)"></i>睡覺</span><span><i style="background:var(--grey-soft);box-shadow:inset 0 0 0 1px var(--line)"></i>醒著</span><span><i style="background:none;box-shadow:inset 0 0 0 1px var(--muted)"></i>這天沒有紀錄</span></div>
        <div class="itip" id="sleepTip" aria-live="polite"></div>
        <p class="note" id="sleepNote"></p>
        <div class="row" id="sleepAddRow" hidden=""><button type="button" class="btn ghost" id="sleepAddBtn">補登一段睡眠</button></div>
      </div>

 d:`<ul><li>出生後每一筆就醫紀錄都可能變成既往症，導致除外、加費或延期承保。順序：出生登記 → 立刻投保。</li>

 <li>你的原則：年繳上限 2–3 萬、不買終身醫療。手上兩份建議書：國泰 44,540／年、建信 22,547／年。截止日是自訂目標。</li></ul>`,

{id:"spine",cat:"med",sub:"follow",due:"2026-11-05",kind:"已預約",
 t:"11/5 脊髓超音波追蹤（終絲囊泡）",
 d:`<ul><li><b>11/5 追蹤結果：確認沒事，已結束追蹤</b>（家人告知，2026/11/07 記錄）。</li><li>預約：<b>11/5（四）早診</b>，小禾馨民權小兒專科診所，小兒科二診（1 樓），徐碩澤醫師，序號 39。台北市內湖區行忠路 191 號，(02)2791-0233。同一趟打 B 肝第 2 劑。</li>
 <li>10/3 報告：終絲囊泡 0.15 × 0.76 cm；脊髓圓錐位置 L2；脊髓牽扯、皮膚竇道、腫塊都是 NO。醫師評語：新生兒常見的暫時現象，一個月大時追蹤。</li></ul>
 <h4>這是什麼</h4>
 <ul><li>終絲是脊髓最下端的一條細絲。終絲囊泡是長在這條細絲上、很小的充液空間，新生兒腰椎超音波常偶然看到，放射科參考資料把它列為<b>正常變異</b>，隨年齡增加越來越少見，成人沒有報告過。</li>
 <li>一篇 396 名嬰兒的研究：初次超音波約 1/4 的嬰兒有；5–12 個月大做 MRI 時，40% 已自行消失、60% 仍在，大多沒有症狀。只有 2 例變大，都合併終絲脂肪瘤（另一種病灶）。這群嬰兒是因下背皮膚異常才檢查，跟淩淵的情況不完全相同。</li></ul>
 <h4>要不要擔心</h4>
 <ul><li>報告本身已排除最在意的脊髓牽扯（tethered cord）。單純終絲囊泡目前資料顯示多半無害，追蹤目的是確認沒有變大。</li>
 <li>若追蹤時變大或看不清楚，醫師可能改安排 MRI；研究建議用 MRI 長期追蹤。</li>
 <li>追蹤後是否還要再追：依 11/5 醫師判斷。</li></ul>`,
 src:[["Drive：脊髓超音波報告 10/3",DRV("1D7NmhsKZUa4EMTdCzUjrhPGfDjqDpp5T")],["Drive：預約單 11/5",DRV("1FIYp3Jc0XfmQcXKpcomx-D2v2CGlCZWF")],["Radiopaedia：Filar cyst",FC_RADIO],["Child's Nervous System 2019：終絲囊泡自然病程",FC_STUDY]]},

 <li>去之前記下：每次餵奶時間、是否含乳困難、媽媽乳頭是否疼痛或破皮、寶寶體重變化。</li>

{id:"heart",cat:"med",sub:"follow",due:"2026-12-01",kind:"建議",
 t:"約 12 月初：心臟超音波追蹤（動脈導管、卵圓孔）",
 d:`<ul><li><span class="warn">還沒有預約單</span>。出院照護計劃書寫「2m 追蹤心臟」，報告寫「滿二個月以後再回小兒心臟科門診追蹤」。11/5 回診時直接預約，可與 12/1 滿 2 個月疫苗排在同一週。</li>
 <li>10/2 報告（出生約 1 天）：動脈導管未關閉、卵圓孔未關閉；心臟位置、心房心室大小、主動脈與肺動脈瓣都正常，心室中隔與心房中隔無缺損。醫師評語：目前不影響心臟功能，隨年紀增長可能逐漸復原。</li></ul>
 <h4>這是什麼</h4>
 <ul><li>胎兒在媽媽肚子裡不用肺呼吸，血液靠兩條「捷徑」繞過肺：<b>動脈導管</b>（主動脈和肺動脈之間的血管）與<b>卵圓孔</b>（左右心房之間的小開口）。出生後開始自己呼吸，這兩條捷徑會陸續關閉。</li>
 <li>動脈導管：健康足月兒通常 12–24 小時功能性關閉，約 72 小時內幾乎全部關閉，永久封死約需 2–3 週。淩淵是出生第 1 天做的超音波，這時還開著屬於過渡期常見情形。</li>
 <li>卵圓孔：通常 6 個月到 1 歲才關閉；成人約每 4 人就有 1 人卵圓孔一直沒關，多半一輩子沒症狀，也不需要治療。</li></ul>
 <h4>要不要擔心</h4>
 <ul><li>依報告與一般病程，屬於常見、多會自行關閉的狀況。追蹤目的是確認動脈導管已關閉。</li>
 <li>出現以下狀況就提前就醫，不要等到 12 月：喝奶時喘、吃一下就累到吃不完、呼吸明顯變快、嘴唇或臉色發紫或發灰、活動力明顯變差、體重增加不理想。</li>
 <li>報告「Other」欄另寫「Anterior shelf in aortic arch」（主動脈弓前方有一處突起），評語沒有說明。這代表什麼：【資料不足，無法確認】。11/5 回診時直接問醫師是否需要特別注意，並確認是否已排除主動脈窄縮。</li></ul>`,
 src:[["Drive：心臟超音波報告 10/2",DRV("1iX_yzNMvbkJ6ny7aARw9SNEUWLyXxBb1")],["StatPearls：Patent Ductus Arteriosus",PDA_REF],["KidsHealth：Patent Foramen Ovale",PFO_REF],["NeoCardioLab：主動脈窄縮與警訊",COA_REF]]},

{id:"rota",cat:"med",sub:"vax",due:"2027-01-04",kind:"已決定",
 t:"公費輪狀病毒疫苗第 1 劑：建議 1/4–1/8，最晚 1/13",
 d:`<p><b>11/27 決定：不在 12/3 自費，改 1 月初打公費第 1 劑。</b></p><ul><li><b>建議 1/4（一）到 1/8（五）</b>：1/1 元旦、1/2 週六；留緩衝是因為那幾天如果拉肚子或吐，要延後。</li><li><b>1/13 是美國 CDC 建議的第 1 劑最晚日期</b>（14 週 6 天）。萬一錯過，台灣公費規定到 8 個月（2027/6/1）都還能打。</li><li>12/3 看診時直接問櫃台並先預約：「1 月初有沒有公費輪狀疫苗第 1 劑？哪一牌？」</li><li>選羅特律：第 2 劑最早 4 週後（約 2 月初，可和 4 個月疫苗同一天），2 劑要在 24 週（2027/3/18）前打完。選輪達停是 3 劑（2、4、6 個月）。同一廠牌打完。</li><li>打完 1 個月內（特別是第 1 週）注意腸套疊：一陣一陣大哭、腳縮到肚子、反覆嘔吐（尤其綠色）、血便或果醬狀大便、很虛弱 → 急診。換尿布後用肥皂洗手約 2–4 週。</li></ul><p class="note">以下是原本的說明：</p><ul><li>公費 2027/1/1 上路，2 劑型（2、4 個月）或 3 劑型（2、4、6 個月）；最早滿 6 週（11/12），最大不超過 8 個月（2027/6/1），每劑間隔至少 4 週。上路後未完成劑次者也屬公費對象，原則同廠牌完成。</li>
 <li><b>建議路線</b>：12/1 滿 2 個月打第 1 劑（12 月仍是自費），之後各劑走公費。自費只付 1 劑。</li>
 <li>台北第一類兒童醫療補助資格核准後，這一劑有定額補助：<b>羅特律每劑補 1,050 元、倫達停每劑補 700 元</b>，到合約院所接種、適用出生滿 6–32 週。</li>
 <li>另一路線是等 1 月初公費打第 1 劑。第 1 劑最晚：台灣疾管署只寫「接種年齡最大不得超過 8 個月」，沒另外寫首劑上限；美國 CDC／ACIP 的規則是<b>第 1 劑最晚 14 週 6 天，滿 15 週就不開始</b>，最後一劑最晚 8 個月 0 天（<a href="https://www.immunize.org/ask-experts/topic/rotavirus/vaccine-recommendations-rotavirus/" target="_blank" rel="noopener">Immunize.org 整理 CDC 建議</a>）。淩淵 14 週 6 天是 <b>2027/1/13</b>，所以走這條路要在 1/13 前打第 1 劑；實際以醫師與所選廠牌仿單為準。</li></ul>`,
 src:[["衛福部：輪狀病毒疫苗 2027/1/1 納入公費","https://mohw.gov.tw/cp-16-87058-1.html"],["臺北市輪狀病毒疫苗補助說明",TPE_ROTA]]},

function kLinks(ids){
  const b=ids.map(i=>{ const c=CARE.find(x=>x.id===i); return c?`<button type="button" data-kgo="${i}">${c.h.replace(/^\d+\/\d+ /,"")}</button>`:""; }).join("");

function classTable(){
  const t=todayD(); const key=`${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,"0")}-${String(t.getDate()).padStart(2,"0")}`;
  const rows=CLASSES.map(([d,tm,name,who,id,rel])=>{
    const st = d<key?["past","已過"]:d===key?["now","今天"]:["next","還能去"];
    const md=d.slice(5).replace("-","/").replace(/^0/,"");
    let act;
    if(id) act=`<button type="button" class="linkbtn" data-kgo="${id}">看補課重點</button>`;
    else act = (rel&&rel.length)? kLinks(rel).replace("相關主題：","先看：") : "";
    return `<tr><td class="mono">${md}<span class="cw">${tm}</span></td><td>${name}<span class="cw">${who}</span>${id&&st[0]!=="past"?"":""}${act?`<div>${act}</div>`:""}</td><td class="cst ${st[0]}">${st[1]}</td></tr>`;
  }).join("");
  return `<div class="tbwrap"><table class="tb ctb"><thead><tr><th>日期</th><th>課程</th><th>狀態</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

   <li>出生幾週後就可以開始。房間要溫暖；寶寶清醒、安靜、休息夠；大人自己也要放鬆。</li>
   <li>適合的時間：睡醒後、換尿布時、洗完澡後。每次 10–30 分鐘。</li>
   <li>用安全、適合寶寶的乳霜或乳液，先在手上搓溫；手掌不要擦。</li>
  </ul>
  <h4>順序</h4>
  <ol class="plain">
   <li><b>腳</b>：一手一直扶著寶寶。從腳跟往腳趾慢慢、穩穩地推腳底；再從腳踝往大腿、繞過髖部，避開生殖器。輕輕把膝蓋往肚子推，幫忙排氣。</li>
   <li><b>上半身</b>：雙手從肩膀往胸口推；手臂從肩膀推到手腕。肚子軟軟的時候，順時針畫圈；臍帶還沒好就避開肚臍；乳頭到肚子之間不要壓。</li>
   <li><b>臉和背</b>：指腹從額頭往兩側臉頰撫下；頭皮畫小圈，<b>避開囟門</b>（頭頂軟軟的地方）。還很放鬆的話翻成趴姿，從頭到腳長長地撫下。</li>
  </ol>
  <h4>什麼時候停</h4>
  <ul class="plain">
   <li>寶寶不開心、哭：停。按肚子就不安：跳過肚子；仰躺不舒服：改趴著，還不舒服就停。</li>
   <li>大人很緊張時先不要做。</li>
  </ul>
  <h4>有沒有效？</h4>
  <ul class="plain">
   <li>Cochrane 2022 系統性回顧（34 個隨機試驗，未滿 6 個月、一般健康寶寶）：體重、睡眠、哭鬧等看似有效，但 20 個研究偏誤風險高；扣掉後只剩身長還有差別，而且追蹤久了效果就不見。</li>
   <li>作者結論：目前<b>不支持</b>對一般低風險家庭推行嬰兒按摩來促進健康。</li>
   <li>所以：喜歡就當成親子互動和放鬆，不用期待長得比較快或治好腸絞痛；不做也沒有缺少什麼。</li>
  </ul>

  <ul class="plain">
   <li>Cochrane 2020（41 個研究、約 3000 位媽媽）：葫蘆巴、茴香、薑、辣木、豬腳、椰棗、綜合草本茶等「天然發奶物」，對奶量的效果<b>非常不確定</b>；有的研究有效、有的幾乎沒差。</li>
   <li>ABM 2018：目前<b>無法推薦任何特定發奶物</b>。草藥問題在於缺乏管制、劑量不一、可能有汙染、過敏和藥物交互作用；葫蘆巴有數起媽媽嚴重過敏的報告。</li>

 {id:"feed",cat:"baby",h:"餵奶（混合餵養）",g:"次數、奶量、吃夠了嗎、沖泡與保存",html:()=>`
  <h4>頻率與訊號</h4>
  <ul class="plain">
   <li>新生兒 24 小時至少餵 8–12 次（含親餵）。前幾週睡超過 4–5 小時沒吃，要叫醒餵。</li>
   <li>吃飽的訊號：開始分心、扭動、推開。奶瓶吃完還一直咂嘴，可能還沒飽。</li>
  </ul>
  <h4>吃夠了嗎（比算奶量更準）</h4>
  <ul class="plain">
   <li>第 5–7 天起：每天 6 片以上濕尿布，尿色接近無色或淡黃。</li>
   <li>以母乳為主時，第 5–7 天起每天 3–4 次以上黃色軟便。</li>
   <li>多數寶寶 10–14 天回到出生體重，之後 1–3 個月平均每天約 +30 g。</li>
  </ul>
  <h4>配方奶量參考</h4>
  <ul class="plain">
   <li>第一週每餐約 30–60 ml，第一個月慢慢增加到每餐 90–120 ml。</li>
   <li>全天總量約為每公斤體重 165 ml（AAP：每磅 2.5 oz），一天平均不超過約 960 ml。</li>
   <li>多數寶寶每個月每餐平均多喝約 30 ml（1 oz），最後穩定在每餐 210–240 ml（AAP）。</li>
  </ul>
  <h4>什麼時候加量、怎麼加（2026/11/09 新增）</h4>
  <p class="note"><b>一句話：</b>看寶寶的反應和體重決定加不加，不是照月齡表加。上面的總量只是參考範圍，不是一定要喝到的目標。混合餵養時親餵量看不到，瓶餵量就是「補親餵不夠的部分」。</p>
  <ul class="plain">
   <li><b>可以加</b>（連續好幾餐都這樣才算）：奶瓶很快喝光後還張嘴找奶、吸手、咂嘴（哭是比較晚的飢餓訊號）；兩餐間隔明顯變短；濕尿布變少。</li>
   <li><b>怎麼加</b>：每餐多 10–30 ml，維持 2–3 天，看上面的訊號有沒有消失再決定要不要再加（App 整理的實務做法，不是指南數字）。</li>
   <li><b>先不要加</b>：每餐都喝不完、轉頭、推開奶嘴；吐奶變多、肚子脹、餵完很難安撫（可能喝太多，看「溢奶」）。</li>
   <li><b>最準的指標是體重</b>：體重穩定增加（1–3 個月平均每天約 +30 g）就代表夠了；不要跟別的寶寶比每餐 ml 數。</li>

  <h4>沖泡配方奶</h4>
  <ul class="plain">
   <li>未滿 2 個月、早產或免疫力較弱：用煮沸後仍約 70°C 的熱開水沖泡，放涼後滴在手腕內側試溫再餵。</li>
   <li><b>泡好 2 小時內要用；開始喝之後 1 小時內喝完</b>，剩下的倒掉，不留到下一餐。</li>
   <li>泡好 2 小時內不會用到：馬上冰起來，24 小時內用完；回溫過的不要再冰回去。</li>
   <li>不要用微波爐加熱奶：受熱不均，局部過燙會燙傷嘴巴和喉嚨。</li>

  <ul class="plain">
   <li>未滿 2 個月、早產或免疫力較弱：奶瓶等餵食用品<b>每天至少消毒 1 次</b>。</li>
   <li>方法擇一：拆開後整個泡在水裡，水滾後<b>煮 5 分鐘</b>；或用微波或插電的蒸氣消毒器（照說明書）；或用洗碗機的熱水加烘乾（或消毒模式），就不必另外消毒。</li>
   <li>消毒後完全晾乾再收起來。</li>
  </ul>

   <tr><td>剛擠出</td><td>冷凍</td><td>6 個月最好，12 個月可接受</td></tr>

  </ul>
  <p class="note">舌繫帶已確認沒問題（10/22），之後看診時追蹤；親餵或含乳有狀況，記在「今天 › 狀況」給醫師看。</p>

  <h4>先分辨是哪一種聲音</h4>
  <ul class="plain">
   <li><b>鼻子呼嚕、打呼、哼哼</b>：多半是鼻塞。先觀察，影響喝奶或睡覺才清鼻子。</li>

   <li><b>吸氣時高音咻咻、像吱吱叫，哭、喝奶、仰躺時更大聲</b>：最常見是喉軟化症。錄影給小兒科看；多數 12–18 個月會自己好。</li>
   <li><b>每次吐氣都「嗯」一聲</b>（很小的寶寶像小羊叫）：呼吸費力，<span class="warn">馬上就醫</span>。</li>
  </ul>
  <h4>數呼吸</h4>
  <ul class="plain">
   <li>趁安靜或睡著時看肚子起伏，數滿 1 分鐘。新生兒正常約 40–60 下。</li>
   <li>快喘幾下、停約 10 秒再繼續（週期性呼吸）是正常的。</li>
  </ul>
  <h4>在家可以做</h4>
  <ul class="plain">
   <li>鼻塞影響喝奶或睡覺時：生理食鹽水每邊滴 1–3 滴，等 30–60 秒，再用吸鼻器輕輕吸；可以在喝奶前做。</li>
   <li><b>不要吸太頻繁</b>：吸太多鼻子會腫，反而更塞。喝奶、睡覺都正常就不用吸。</li>
   <li>只用單純食鹽水；<span class="warn">4 歲以下不用感冒藥、鼻塞藥</span>（AAP）。</li>
   <li><b>照樣仰睡、床面平</b>：不要墊高頭或側睡來「通鼻子」，墊高床頭要滿 1 歲以後。</li>
   <li>空氣乾可在床邊開冷霧加濕器，每天清洗換水。</li>
  </ul>
  <h4>馬上就醫（119 或急診）</h4>
  <ul class="plain">
   <li>停止呼吸超過 10 秒，或嘴唇、臉色發紫發灰</li>
   <li>每次吐氣都呻吟</li>
   <li>吸氣時肋骨下、肋骨間或脖子凹進去；鼻翼一直張開；呼吸很快</li>
   <li>軟趴趴、叫不醒</li>
  </ul>
  <h4>當天看小兒科</h4>
  <ul class="plain">

   <li>喝奶明顯變少、喝一下就要停下來喘、濕尿布變少</li>
   <li>咻咻聲越來越大、安靜時也一直有，或喝奶常嗆到、體重增加不好</li>
   <li>鼻涕鼻塞超過 2 週</li>
  </ul>
  <p class="note">淩淵 12/3 要追蹤心臟超音波：喝奶時喘、呼吸明顯變快、嘴唇發紫，不要等到 12/3，提早看。聽到怪聲先錄 20–30 秒影片（拍到胸口和肚子），看診時給醫師看。</p>

  <ul class="plain">
   <li><b>每次都仰睡</b>，午睡也一樣。側睡跟趴睡一樣危險。</li>
   <li>睡在硬而平的床面，傾斜不超過 10 度。</li>
   <li><b>同房不同床</b>至少到 6 個月。不要同床睡：4 個月以下同床風險高 5–10 倍；抱著在沙發或扶手椅睡著，風險可高到 67 倍。</li>
   <li>床上不放枕頭、棉被、厚毯、玩偶、床圍；不用加重型睡袋、包巾或毯子。</li>
   <li>看起來想翻身就停止包巾（通常 3–4 個月，也可能更早）。</li>
   <li>穿著比大人多一層即可，出院回家後室內不戴帽子。</li>
   <li>可在小睡與夜間睡前給安撫奶嘴，能降低嬰兒猝死風險，睡著後掉出來也有效；怎麼給、幾歲戒，看「安撫奶嘴」。</li>
   <li>在汽座、推車、搖椅、揹巾裡睡著，盡快移到硬而平的床上仰睡。</li>
   <li>趴在大人身上睡：大人要清醒，想睡就先放回床；看「抱睡」。</li>
   <li>怕扁頭：照樣仰睡，只把頭的方向左右輪流，醒著多趴著玩；不要改側睡、不用定型枕。看「顧頭型」。</li>
   <li>家裡與車上全面禁菸，包括電子菸。</li>
   <li>白噪音機或手機：放在離嬰兒床 2 公尺（200 公分）以外、音量調小。研究測試的 14 台嬰兒白噪音機，開到最大聲時全部超過醫院新生兒室 50 分貝的上限。</li>
  </ul>
  <h4>清醒時趴著玩</h4>
  <ul class="plain"><li>從新生兒就可以開始，只在清醒且有大人看著時做。每次換完尿布趴一下，每天加約 1 分鐘；寶寶很不開心就慢一點加。</li></ul>

{id:"hold",cat:"baby",chk:"2026/10/23",h:"抱睡（掛在大人身上睡）",g:"0–3 個月抱睡不會寵壞；大人想睡就放回床仰睡；之後再一步一步減少幫忙",html:()=>`
  <h4>0–3 個月：可以抱睡，但大人要醒著</h4>
  <ul class="plain">
   <li>大人清醒、看得到寶寶的臉，讓寶寶趴在胸前睡可以。</li>
   <li>隨時檢查：頭直立並轉向一側，看得到鼻子和嘴巴；頸部伸直，下巴不要壓到胸口；毯子可以蓋身體，不要蓋到頭；雙手扶住寶寶。</li>
   <li><span class="warn">大人覺得睏、要躺平、或要去做別的事：先把寶寶仰躺放回自己的床。</span></li>
   <li><span class="warn">不要抱著寶寶在沙發、扶手椅上睡著</span>：寶寶睡眠相關死亡的風險可高到 67 倍。半躺在沙發上最容易不小心睡著。</li>
   <li>真的不小心睡著了，醒來馬上把寶寶放回自己的床。</li>
  </ul>
  <h4>可以抱到多大？</h4>
  <ul class="plain">
   <li>沒有官方的月齡或體重上限：大人醒著、看得到口鼻，幾個月大都可以抱著睡。抱的體重上限：【資料不足，無法確認】，抱得穩就行。</li>
   <li>最要小心的是 1–4 個月（淩淵約 11/1 到 2027/2/1）：這是嬰兒猝死（SIDS）高峰；約 9 成發生在 6 個月前（AAP 2022）。</li>
   <li>6 個月以後猝死風險大幅下降但沒有消失；寶寶會翻身、扭動、往外推，抱著時的主要風險改成從身上或沙發滑落（App 整理）。</li>
   <li>不管幾個月：睡著後放回自己的床、仰睡、床上不放東西，一直做到滿 1 歲（AAP 2022）。</li>
   <li>奶嘴可以吸著睡，但不接奶嘴鍊、不夾在衣服上（看「安撫奶嘴」）。</li>
  </ul>
  <h4>會不會養成「一定要抱才睡」？</h4>
  <ul class="plain">
   <li>AAP：小寶寶不會因為被關注而寵壞；頭幾個月快速回應哭聲，整體反而哭得比較少。</li>
   <li>小寶寶睡眠週期約 50–60 分鐘，每個週期結束會短暫醒來，常需要大人幫忙再睡著。放下就醒，多半跟這個有關，不是被抱出來的習慣。</li>
   <li>2–3 個月開始出現日夜作息，3–4 個月開始夜裡睡最長的一段。</li>
   <li>0–3 個月抱睡會不會讓寶寶之後更依賴抱：【資料不足，無法確認】，目前沒有直接研究這件事的高品質研究。</li>
   <li>放下常醒：先抱著走約 5 分鐘、坐著再抱約 8 分鐘，再仰躺放下（看「哭鬧與安撫」）。</li>
  </ul>
  <h4>3–6 個月：開始練習在床上睡著</h4>
  <ul class="plain">
   <li>大人小孩都有「入睡聯想」，也就是習慣怎麼睡著（被抱、被搖、喝奶）。搖睡、餵睡本身沒有不行；如果寶寶半夜醒來會很不開心，再來調整。</li>
   <li>可以試著在寶寶想睡但還醒著時放上床，讓他把「在自己床上」和睡著連在一起。在自己床上睡著的寶寶，半夜醒來比較會自己接回去睡。</li>
   <li>晚上保持暗、安靜、少互動，白天再玩。</li>
   <li>新生兒期就練「睏了還醒著放下」有沒有效：【資料不足，無法確認】。不成功就抱，不用勉強。</li>
  </ul>
  <h4>6–18 個月：一次減少一級幫忙</h4>
  <ul class="plain">
   <li>等寶寶用目前的方式能輕鬆睡著，再換成幫忙少一點的方式：餵到想睡（不是睡著）→ 抱著搖到想睡 → 在床上拍拍，想睡時拍慢、停下 → 寶寶還醒著就離開房間。</li>
   <li>寶寶很不開心就停下來抱一抱，過幾天再試。</li>
   <li>大人快生氣時，把寶寶仰躺放在安全的床上，先離開房間冷靜。</li>
  </ul>
  <h4>研究：睡眠訓練有沒有長期傷害</h4>
  <ul class="plain">
   <li>澳洲隨機試驗（Price 2012，Pediatrics）：326 位 7 個月大、家長說有睡眠問題的寶寶；一組在 8–10 個月時由護理師教家長「控制安撫」（隔一段時間進去安撫）或「陪睡椅子法」（大人在床邊陪，慢慢移出房間）。</li>
   <li>追到 6 歲：孩子的情緒與行為、睡眠、壓力荷爾蒙、親子關係，以及媽媽的心理健康與教養方式，兩組都沒有差異：沒有長期傷害，也沒有長期好處。</li>
   <li>所以現在抱睡，之後還有機會調整，不會定型。</li>
  </ul>

 {id:"sids",cat:"baby",chk:"2026/10/31",h:"嬰兒猝死（SIDS）是什麼",g:"未滿 1 歲在睡夢中突然死亡、查不出原因；1–4 個月最危險；每一覺仰睡、自己的床、床上沒東西",html:()=>`
  <p class="note">一句話：<b>原因查不出來，但風險可以降很多：每一覺都仰睡、睡自己的床、床上什麼都不放，做到滿 1 歲。</b></p>
  <h4>是什麼</h4>
  <ul class="plain">
   <li>SIDS（Sudden Infant Death Syndrome）＝嬰兒猝死症候群：未滿 1 歲、看起來健康的寶寶突然死亡，通常在睡覺時；經過解剖、死亡現場調查、病史回顧，仍找不出原因（AAP 2022）。</li>
   <li>被枕頭、被子、大人身體悶住，屬於「意外窒息」，原因清楚，不算 SIDS。AAP 把兩者合稱「睡眠相關死亡」，預防方法幾乎一樣。</li>
  </ul>
  <h4>幾個月最危險（淩淵的日期）</h4>
  <div class="tbwrap"><table class="tb"><thead><tr><th>年紀</th><th>風險</th></tr></thead><tbody>
   <tr><td>1–4 個月<br>11/1–2027/2/1</td><td><b>高峰</b></td></tr>
   <tr><td>4–6 個月<br>到 2027/4/1</td><td>仍高；約 9 成 SIDS 發生在 6 個月前</td></tr>
   <tr><td>6–12 個月<br>到 2027/10/1</td><td>大幅下降、8 個月後少見，但沒有消失：安全睡眠照做</td></tr>
  </tbody></table></div>
  <p class="note">年齡分布：AAP 2022 政策聲明；美國紐澤西州衛生部依 AAP 整理的問答。</p>
  <h4>為什麼會發生：三重風險模型</h4>
  <ul class="plain">
   <li>目前最被接受的解釋（AAP 2022、美國國家兒童健康與人類發展研究院 NICHD）：三件事同時發生才會出事。</li>
   <li>① 寶寶本身有看不出來的弱點：例如呼吸不順時醒不過來、心跳呼吸調節比較弱。<b>事先驗不出來。</b></li>
   <li>② 正在發育的關鍵期：約 1–6 個月，呼吸、心跳、睡醒的控制正在快速成熟。</li>
   <li>③ 外在壓力：趴睡或側睡、太熱、軟床、東西蓋到頭、二手菸、感冒。</li>
   <li>①②家長控制不了，③可以拿掉：所以每個寶寶都當作可能有弱點，每一覺都照安全睡眠做。</li>
  </ul>
  <h4>能降低風險的做法（AAP 2022）</h4>
  <ul class="plain">

  <h4>為什麼會扁</h4>
  <ul class="plain">
   <li>寶寶頭骨還軟，同一個地方一直壓著就會變平：一側扁（斜頭）或整個後腦扁（短頭）。</li>

   <li><span class="warn">不用定型枕、U 型枕、楔形枕，也不要用捲毛巾把頭固定住。</span>國健署「五招安心睡」：不趴睡、不用枕、不同床、不悶熱、不鬆軟。AAP 也不建議任何睡姿固定器。</li>
   <li>月子中心「一天左側、一天右側」側躺：回家改成仰躺，只讓頭左右輪流。</li>

  <h4>醒著時：減少後腦受壓（最有效的部分）</h4>

   <li><b>趴著玩</b>：AAP 建議從回家第一天開始，每天 2–3 次、每次 3–5 分鐘；<b>滿 7 週（約 11/19）前累積到每天 15–30 分鐘</b>。WHO：還不會爬的寶寶，每天醒著時合計至少趴 30 分鐘。</li>

   <li>少讓寶寶長時間躺在汽座、推車、搖椅、彈跳椅：這些都會壓後腦（AAP）。坐車一定用汽座，到了就抱出來（NHS）。WHO：1 歲以下一次不要被固定超過 1 小時。</li>

   <li>出生時頭型就怪、2–3 個月前就很扁、頭圍不長、發展慢：要排除「顱縫早閉」（頭骨太早接合，需要專科處理；英國 NHS 院區轉診標準）。</li>

  </ul>

  <p class="note">一句話：<b>好處（安撫、降猝死）集中在前 6 個月；壞處（中耳炎、咬合）隨使用時間累積。所以 6 個月起白天減、睡覺用到 1 歲，1 歲起戒，3 歲前戒完。</b></p>
  <h4>依年齡怎麼用</h4>
  <div class="tbwrap"><table class="tb"><thead><tr><th>年齡</th><th>做法</th></tr></thead><tbody>
   <tr><td>0–3/4 週</td><td>有親餵：建議等含乳順、奶量穩定（約 3–4 週）再給。只喝配方奶：隨時可以開始。</td></tr>
   <tr><td>1–6 個月</td><td>小睡與夜間入睡時主動給，<b>可降低嬰兒猝死症（SIDS）風險</b>；SIDS 高峰在 1–4 個月。</td></tr>
   <tr><td>6–12 個月</td><td>睡覺時仍可用（保護效果到 1 歲）；白天開始減少，因為中耳炎風險隨使用增加。</td></tr>
   <tr><td>1–2 歲</td><td>開始戒除的好時機。</td></tr>
   <tr><td>2–4 歲</td><td>最晚 3 歲前戒完，否則容易造成開咬、暴牙等咬合問題。</td></tr>
  </tbody></table></div>
  <h4>淩淵的日期</h4>
  <div class="tbwrap"><table class="tb"><thead><tr><th>期間</th><th>做法</th></tr></thead><tbody>
   <tr><td>現在–2027/4/1</td><td>照用：入睡時給。</td></tr>
   <tr><td>2027/4/1–10/1（6–12 個月）</td><td>白天拿掉，<b>只留入睡時</b>。AAP 建議第二個 6 個月開始戒以減少中耳炎；但睡覺時用奶嘴降猝死的效果到 1 歲。兩個建議的交集就是「白天不用、入睡時用」。</td></tr>
   <tr><td>2027/10/1 起（滿 1 歲）</td><td>開始戒。AFP 2025：最佳戒除時間未知，但滿 12 個月後健康風險似乎上升。</td></tr>
   <tr><td>最晚 2029/10/1（3 歲）</td><td>戒完。AAPD：3 歲後還在吸，請牙醫評估。AFP 2009：咬合影響 2 歲後可能出現，主要在 4 歲後。</td></tr>
  </tbody></table></div>
  <p class="note">對照：約 75% 以上的寶寶頭 2 個月用過奶嘴，2 個月時用得最多；1 歲時約一半還在用，5 歲約 1%（AFP 2025）。待辦「教育 › 生活自理」有 2027/4/1、2027/10/1 兩個提醒。</p>
  <h4>怎麼戒</h4>
  <ul class="plain">
   <li><b>先縮小使用時機</b>：從整天 → 只在入睡時（不是整晚）→ 睡著掉出來不塞回 → 不給。AFP 2009 指出只在入睡時用，可以減少持續使用。</li>
   <li><b>用正向鼓勵</b>：AFP 2025 唯一列出的方法是正向鼓勵（稱讚、獎勵），不嘲笑、不處罰。</li>
   <li>具體哪一種戒法（一次拿掉 vs 慢慢減）比較好：【資料不足，無法確認】。</li>
  </ul>
  <h4>正確給法</h4>
  <ul class="plain">
   <li><b>入睡時給，睡著後掉出來不用塞回去</b>：保護效果來自入睡過程。</li>
   <li>不想要就不強迫。</li>
   <li>不用奶嘴拖延餵奶：餓了就餵，奶嘴不能取代吃奶。</li>
   <li><span class="warn">不沾蜂蜜或糖</span>：1 歲前吃蜂蜜有肉毒桿菌中毒風險，沾糖也會蛀牙。</li>
   <li>睡覺時不用奶嘴鍊、不掛脖子、不綁在玩偶上，避免勒頸與窒息。</li>
  </ul>
  <h4>挑選與清潔</h4>
  <ul class="plain">
   <li>一體成型，護片有通氣孔，尺寸依月齡。</li>
   <li>每次用前拉一拉檢查；有裂痕、變黏、變形就換新。</li>
   <li>6 個月前定期煮沸或用蒸氣消毒鍋消毒；大人不要用自己的嘴「清潔」奶嘴。</li>
  </ul>
  <h4>會不會讓親餵失敗？</h4>
  <ul class="plain">
   <li>Cochrane 2016 回顧隨機試驗：健康足月、媽媽想親餵的寶寶，不論哺乳穩定前或後開始用奶嘴，對 4 個月內純母乳比例與持續時間都沒有明顯影響。觀察性研究看到的負相關，比較可能是親餵本來就不順，才更常用奶嘴。</li>
   <li>所以「等 3–4 週」是保守做法，不是硬規定。</li>
  </ul>
  <p class="note">淩淵的舌繫帶已確認沒問題（10/22）；有親餵的話，等含乳順了再開始，可以順便問醫師。早產、體重增加不好、含乳困難時，開始時機都先問兒科或泌乳顧問。</p>
  ${srcHTML(["aapSleep","aapPaci","cochPaci","aapdPaci","aapOM","afpPaci09","afpPaci25"])}`},
 {id:"teeth",cat:"baby",h:"牙齒與口腔",g:"長牙就刷、含氟 1000 ppm 米粒大小、每半年塗氟",html:()=>`
  <h4>什麼時候長牙</h4>
  <ul class="plain"><li>平均 4–7 個月開始長牙，乳牙共 20 顆，約 3 歲長齊。1 歲還沒長，健檢時問醫師。</li></ul>
  <h4>長牙後刷牙</h4>
  <ul class="plain">
   <li><b>第一顆牙冒出來就開始</b>，每天至少 2 次，其中 1 次在睡前；每次約 2 分鐘，大人幫忙刷。</li>
   <li>含氟牙膏濃度 <b>至少 1000 ppm</b>（3 歲前用兒童含氟牙膏即可，牙醫建議才用 1350–1500 ppm 的家庭用牙膏）。氟不到 1000 ppm 就沒有防蛀效果，買之前看成分標示。</li>
   <li>用量：3 歲前每次最多<b>米粒大小</b>；3–6 歲最多豌豆大小。由大人擠牙膏。</li>
   <li>刷完吐掉、不要大量漱口，漱口會把氟沖掉、效果變差。</li>
  </ul>
  <h4>看牙醫與塗氟</h4>
  <ul class="plain">
   <li>第一次看牙醫：第一顆牙長出後 6 個月內，最晚滿 1 歲前，順便建立固定看的牙醫。</li>
   <li>塗氟：牙醫把高濃度氟漆塗在牙齒表面，每 6 個月 1 次；蛀牙風險高的孩子可能要每 3 個月。</li>
   <li>公費：2026/9/1（115 年）起補助到「上小學那年的 8/31」，一般兒童每半年 1 次，到健保特約牙科，帶健保卡。每次包含塗氟、口腔檢查和衛教。</li>
  </ul>
  <h4>奶瓶、夜奶與飲料</h4>
  <ul class="plain">
   <li><span class="warn">不要讓寶寶含著奶瓶睡覺</span>（午睡也一樣）；睡前若一定要奶瓶，裡面只能裝水。</li>
   <li>滿 1 歲後，避免「想喝就給」和夜間的奶瓶與親餵，這和幼兒蛀牙有關（AAPD 2025）。</li>
   <li>6–12 個月：可以用杯子喝少量的水（每天約 120–240 ml），不喝果汁。</li>
   <li>安撫奶嘴不沾糖或蜂蜜；不要把大人嚼過的食物餵給寶寶。</li>
  </ul>
  <h4>長牙不舒服</h4>
  <ul class="plain">
   <li>可以：用乾淨的手指輕輕按摩牙齦；給硬橡膠、<b>不是充液式</b>的固齒器咬，<b>不要冷凍</b>（太硬會傷牙齦），在旁邊看著以免噎到。</li>
   <li>真的很痛時，止痛藥（ibuprofen 要 6 個月以上）先問醫師依體重給的 ml 數。</li>
   <li><span class="warn">不要用</span>：含 benzocaine 或 lidocaine 的牙齦藥、順勢療法長牙錠或凝膠；琥珀長牙項鍊、手鍊等首飾（FDA 有勒頸、窒息致死與重傷通報）。</li>
   <li>發燒照「醫療」頁的規則處理，不要先當成長牙。</li>
   <li>口水變多、下巴起口水疹怎麼照顧，看「流口水」：2–3 個月就會開始，多半不是長牙。</li>
  </ul>
  <h4>大人的牙齒</h4>
  <ul class="plain"><li>媽媽或主要照顧者過去 12 個月內有蛀牙，是孩子蛀牙的風險因子。爸媽和常幫忙的長輩先把自己的牙齒顧好（待辦已列）。</li></ul>
  ${kLinks(["drool"])}

 {id:"drool",cat:"baby",chk:"2026/11/07",h:"流口水",g:"2–3 個月開始變多、3–6 個月最明顯、18 個月後慢慢變少；4 歲後清醒時還常流才要評估",html:()=>`
  <p class="note"><b>一句話：</b>唾液腺大約 2–3 個月開始變得很活躍，寶寶還不會把多出來的口水吞下去，所以會流出來；通常 18 個月後慢慢變少。健康的孩子 4 歲前流口水都還在常見範圍，4 歲後清醒時還常流才需要評估。</p>
  <h4>淩淵的日期</h4>
  <div class="tbwrap"><table class="tb"><thead><tr><th>時間</th><th>會怎樣</th></tr></thead><tbody>
   <tr><td>2–3 個月<br>2026/12/1–2027/1/1</td><td>唾液腺變活躍，開始流口水。這時多半不是長牙，是口水變多但還不會吞。</td></tr>
   <tr><td>3–6 個月<br>2027/1/1–2027/4/1</td><td>流口水、吹泡泡特別明顯（這時期寶寶什麼都用嘴巴探索）。</td></tr>
   <tr><td>約 6 個月起</td><td>開始長牙的時期和流口水重疊；口水會沖洗、安撫牙齦，牙齒長出來後也幫忙保護牙齒。</td></tr>
   <tr><td>18 個月後<br>2028/4/1 起</td><td>通常逐漸變少。這時還流很多，可以跟兒科醫師討論。</td></tr>
   <tr><td>4 歲<br>2030/10/1</td><td>耳鼻喉科文獻的判斷線：清醒時還常流口水，要找原因（例如鼻塞、牙齒問題、口腔動作控制）。少數健康孩子會超過 4 歲，屬正常差異。</td></tr>
  </tbody></table></div>
  <p class="note"><b>兩個數字怎麼看：</b>18 個月是「大多數孩子明顯變少」的時間（AAP）；4 歲是醫學上判斷「異常、需要評估」的界線（J Laryngol Otol 2024 回顧、CMAJ 2024、Connecticut Children's）。兩者不衝突。各年紀流口水的確切比例【資料不足，無法確認】。</p>
  <h4>皮膚照顧（口水疹）</h4>
  <ul class="plain">
   <li>口水會刺激嘴巴周圍、下巴、臉頰，有時連脖子、胸口、手都會起疹子。</li>
   <li>用柔軟、吸水的棉質圍兜，<b>午睡和晚上睡覺前拿掉</b>；濕了就換。</li>
   <li>輕輕擦乾下巴、脖子、臉頰；手濕了用清水沾濕的軟布擦。要不要擦隔離霜／軟膏先問兒科醫師。</li>
   <li>圍兜和布用溫和、無香精的洗劑洗，不用柔軟精和去漬劑；濕紙巾可能含酒精或香精，會刺激皮膚，天然纖維的布比較好。</li>
  </ul>
  <h4>什麼時候要看醫師</h4>
  <ul class="plain">
   <li><span class="warn">立刻打 119</span>：突然開始流口水，同時發不出聲音、像嗆到、或呼吸困難。</li>
   <li><b>打給／去看兒科</b>：流很多口水又同時生病、發燒或吞嚥困難；18 個月後還流很多；口水疹反覆、衣服總是濕透，或流口水時常咳嗽、嗆到。</li>
   <li>感冒、鼻塞、過敏、長牙時口水會暫時變多，通常不用特別處理。</li>
  </ul>

 {id:"edu03",cat:"edu",h:"0–3 歲怎麼陪",g:"一來一往地回應、說話唱歌、每天共讀、玩就是學",html:()=>`
  <h4>核心：一來一往的互動</h4>
  <ul class="plain">
   <li>寶寶發出聲音、做表情、哭的時候，大人用眼神、說話、擁抱回應他，像打乒乓球一樣來回。這種「發球—回球」會建立並強化大腦的連結，是溝通和社交能力的基礎。</li>
   <li>抱他、回應他不會把他寵壞（CDC）。</li>
   <li>陪寶寶的時候少看手機，比較能及時回應他（CDC）。</li>
  </ul>
  <h4>說話、唱歌、共讀</h4>
  <ul class="plain">
   <li>AAP 鼓勵<b>從新生兒就開始讀給他聽</b>，至少持續到幼兒園大班。共讀能建立親子關係，幫助語言、專注力和自我控制，也是上學準備。</li>
   <li>紙本書優先；螢幕沒有一樣的互動效果。用有聲書或電子書時，也要跟他聊內容。</li>
   <li>做法：放進睡前固定流程；選圖畫清楚、語言豐富的書；邊看圖邊說；換尿布、洗澡、餵奶時跟他說你在做什麼。</li>
   <li>他發出聲音時模仿他，輪流「聊天」（CDC 2 個月）；4 個月起常叫他的名字，約 9 個月會開始認得（CDC）。</li>
  </ul>
  <h4>玩就是學</h4>
  <ul class="plain">
   <li>每天在地墊上玩，讓他伸手、踢、探索；少放在搖椅、推車、跳跳椅裡（CDC 4 個月）。</li>
   <li>每個月齡建議玩什麼：<button type="button" class="linkbtn" data-playgo>打開遊戲清單</button>，會依年齡自動換。</li>
  </ul>
  <h4>作息、情緒與規矩</h4>
  <ul class="plain">
   <li>睡覺和吃飯時間固定（CDC）。</li>
   <li>多注意、具體稱讚你想看到的行為，比一直說「不行」有用（CDC 18 個月）。</li>
   <li>1 歲多常發脾氣，這是正常的（CDC 15、18 個月）；3 歲左右幫他說出感覺：「你很生氣，因為積木倒了」（CDC 3 歲）。</li>
   <li>如廁訓練不用急：大多數孩子 2–3 歲才訓練得成功（CDC）。</li>
  </ul>
  ${srcHTML(["harvardSR","aapRead","cdc2m","cdc4m","cdc15m","cdc18m","cdc2y","cdc3y"])}`},
 {id:"devcheck",cat:"edu",h:"發展進度：幾個月該會什麼",g:"抬頭、翻身、坐、走、說話；沒做到怎麼辦",html:()=>`
  <p class="note">下表取自 CDC 與 AAP 2022 年依證據整理的清單：大多數（約 75% 以上）孩子到這個年紀會做到的事。完整清單在「紀錄」頁，可以勾選。</p>
  <div class="tbwrap"><table class="tb"><thead><tr><th>年紀</th><th>動作</th><th>語言與社交</th></tr></thead><tbody>
   <tr><td>2 個月</td><td>趴著能抬頭</td><td>對你微笑；發出哭以外的聲音</td></tr>
   <tr><td>4 個月</td><td>頭穩穩抬著；握得住玩具</td><td>咯咯笑；轉頭找你的聲音</td></tr>
   <tr><td>6 個月</td><td>從趴著翻成躺著；伸手抓玩具</td><td>笑出聲；跟你輪流發聲</td></tr>
   <tr><td>9 個月</td><td>不靠支撐能坐</td><td>叫名字會看過來；發「mamama」</td></tr>
   <tr><td>12 個月</td><td>扶站、扶著家具走</td><td>揮手掰掰；叫爸爸媽媽</td></tr>
   <tr><td>15 個月</td><td>自己走幾步</td><td>說 1–2 個字；用手指要東西</td></tr>
   <tr><td>18 個月</td><td>自己走；爬上爬下椅子</td><td>說 3 個字以上；聽懂一步驟指令</td></tr>
   <tr><td>2 歲</td><td>跑；踢球</td><td>兩個字組合；指出 2 個身體部位</td></tr>
   <tr><td>2 歲半</td><td>雙腳一起跳</td><td>約 50 個詞；聽懂兩步驟指令</td></tr>
   <tr><td>3 歲</td><td>用叉子；自己穿簡單衣服</td><td>對話來回兩次；說出自己名字</td></tr>
   <tr><td>4 歲</td><td>接大球；用手指握筆</td><td>4 個詞以上的句子</td></tr>
   <tr><td>5 歲</td><td>單腳跳；扣釦子</td><td>數到 10；講有兩件事的故事</td></tr>
  </tbody></table></div>
  <h4>沒做到怎麼辦</h4>
  <ul class="plain">
   <li><b>不要等</b>：沒做到一項以上，或會的事情不會了（退步），跟醫師說、問發展篩檢（CDC）。</li>
   <li>AAP 建議 9、18、30 個月做標準化發展篩檢，18、24 個月做自閉症篩檢（CDC 引述）。</li>
