 {id:"reflux",cat:"sick",chk:"2026/11/07",h:"溢奶與吐奶（逆流）",g:"睡覺一律仰睡；會哭會咳不介入；吐綠色或噴射狀要就醫",html:()=>`
  <p class="note">一句話：<b>會溢奶也要仰睡平躺，不側睡、不趴睡、不墊高。</b>要不要看醫生看「症狀種類」和生長，不看吐多少。</p>
  <h4>睡姿：為什麼仰睡反而不容易嗆</h4>
  <ul class="plain">
   <li>AAP 2022：平坦、堅實、不傾斜的床面上仰睡，<b>不會增加吸入或嗆到的風險，有逆流的寶寶也一樣</b>。</li>
   <li>原理：仰躺時氣管在食道上方，逆流上來的奶被重力留在下方的食道，不容易往上流進氣管；趴睡時位置相反。</li>
   <li><b>側睡不安全</b>：姿勢不穩，容易翻成趴睡（AAP 2022、國健署）。</li>
   <li>NASPGHAN/ESPGHAN 2018：不建議用墊高頭部、側躺、趴睡來處理睡眠中寶寶的逆流。床面傾斜超過 10° 不安全。</li>
   <li>可以不平躺的時候：<b>醒著、有大人看著</b>（餵完直立抱 30 分鐘左右、趴著玩）；或醫師為特定疾病（如顱顏異常、唇顎裂、氣道結構問題）另外開的睡姿。家長不要自己改。</li>
  </ul>
  <h4>正在溢奶、吐奶的當下</h4>
  <ul class="plain">
   <li><b>只是嘴角流一點</b>：擦乾淨、看呼吸和臉色就好，寶寶多半會自己調整吞嚥。</li>
   <li><b>還能哭、能用力咳</b>：不要拍背、壓胸，讓他自己咳出來（Merck 專業版）；不要用手指伸進嘴巴盲挖。</li>
   <li><b>不能哭、咳不出聲、臉發紫或發灰</b>：嚴重哽塞，打 119，同時做 5 次拍背↔5 次壓胸（AHA/AAP 2025），看「嗆到怎麼救」。</li>
   <li>躺著大量吐時先把頭和身體一起轉向側邊，讓奶從嘴角流出，再抱起直立：這是台灣兒科醫師常見建議，<b>國際指南沒有直接規範【資料不足，無法確認】</b>。吐完平靜後放回去仍是仰睡。</li>
  </ul>
  <h4>平常怎麼減少</h4>
  <ul class="plain">
   <li>餵奶中或剛餵完吐一些很常見，多在 8 週前開始，約 1 歲改善（NICE：至少 4 成嬰兒會有，9 成在 1 歲前消失）。寶寶開心、體重有增加，就不用看醫生。</li>
   <li>減少溢奶：太餓之前就餵；瓶餵少量多次、不強迫喝完；奶嘴孔大小合適；餵奶中途停下來拍嗝；餵的時候和餵完都直立抱一會兒；尿布不要綁太緊。</li>
   <li><b>睡覺照樣仰睡、平躺</b>，不墊高床頭，也不用斜坡枕。</li>
  </ul>
  <h4>看醫師</h4>
  <ul class="plain"><li>上面的方法試了沒改善；6 個月以後才開始；1 歲以後還有；體重不增或下降；吐出物帶血絲；拒喝或看起來很痛。</li></ul>
  <h4><span class="warn">立刻就醫</span></h4>
  <ul class="plain"><li>吐綠色或黃色（可能腸阻塞）；吐血或深褐色；噴射狀嘔吐（2 個月內要想到幽門狹窄，淩淵 12/1 前都在這個年紀）；大便帶血；肚子脹或一碰就痛；高燒；一直吐、喝不進去；6 小時沒尿或囟門凹陷；嗜睡叫不醒或一直哭不停；吐完持續咳、喘。</li></ul>
  ${kLinks(["sleep","sids","choke","gi"])}
  ${srcHTML(["aap2022","naspghan18","niceNG1","merckChoke","ahaPBLS25","nhsReflux","spit"])}`},
 {id:"jaundice",cat:"sick",h:"新生兒黃疸",g:"約 2 週退；尿深黃、大便淡色要就醫",html:()=>`
  <ul class="plain">
   <li>很常見，多半無害；通常約第 3 天最明顯，約 2 週退。在自然光下看眼白、皮膚、舌頭下面。</li>
   <li>多餵有幫助：一天餵 8–12 次，很愛睡時要叫醒餵。</li>
   <li>需要治療時多半是照光，多數約 48 小時。淩淵 10/5–10/6 照過光。</li>
  </ul>
  <h4>看醫師（出生滿 24 小時後）</h4>
  <ul class="plain"><li>黃疸又出現或變明顯；確診後沒改善；尿是深黃或褐色；大便顏色淡（對大便卡 1–6 號）。</li></ul>
  <h4><span class="warn">立刻就醫</span></h4>
  <ul class="plain"><li>比平常愛睡、很難叫醒；不吃；身體軟趴趴，或僵硬、抽動；體溫 38°C 以上或 36°C 以下；沒有濕尿布；呼吸困難。</li></ul>
  ${srcHTML(["nhsJaundice","stool"])}`},
 {id:"eczema",cat:"sick",h:"異位性皮膚炎（濕疹）",g:"每天保濕 2 次以上；起水泡流湯要就醫",html:()=>`
  <ul class="plain">
   <li>嬰兒多從臉頰開始；皮膚乾、紅、粗、癢，時好時壞。脂漏性皮膚炎多半不癢，可對照「常見小狀況」。</li>
   <li>保濕劑<b>每天至少 2 次</b>，好了也繼續擦；洗澡用保濕劑代替肥皂。</li>
   <li>避開肥皂、泡泡浴、會刺激的布料和過熱。指甲剪短，可以戴防抓手套。</li>
   <li>不要自己改飲食（包括親餵媽媽忌口），先問醫師。</li>
   <li>類固醇藥膏由醫師開，照醫囑擦。</li>
  </ul>
  <h4>盡快就醫（可能感染）</h4>
  <ul class="plain"><li>起水泡、結痂、流湯或長膿疱；腫、痛、摸起來熱；突然惡化或擴散；發燒或看起來不舒服。</li></ul>
  ${srcHTML(["nhsEczema"])}`},
 {id:"common",cat:"sick",h:"常見小狀況",g:"便秘、尿布疹、鵝口瘡、臉上脫屑與痘痘、眼屎、包皮、臍疝氣",html:()=>`
  <h4>便秘</h4>
  <ul class="plain">
   <li>看軟硬，不看次數：大便硬、像顆粒，或拉的時候哭，才可能是便秘。只是用力、臉漲紅不算，平躺本來就比較難用力。</li>
   <li>母乳寶寶 3–6 週後可能一週才 1–2 次；喝配方奶的通常每天都有。</li>
   <li>不要自己用浣腸、塞劑或瀉藥；要不要加水或果汁先問醫師。</li>
   <li><span class="warn">立刻打給醫師</span>：嘔吐、發燒、肚子脹、精神差、吃很少、大便帶血。</li>
  </ul>
  <h4>尿布疹</h4>
  <ul class="plain">
   <li>濕了、髒了就換；用清水或無香料、無酒精的濕紙巾清潔，輕拍乾、不要搓。</li>
   <li>有空就讓屁股透氣；尿布要合身、不要包太緊。每天洗澡，但不超過 2 次。</li>
   <li>不用肥皂、嬰兒乳液、泡泡浴、爽身粉、抗菌藥膏。不舒服時可請藥師推薦護膚膏，每次換尿布薄擦一層。</li>
   <li>看醫師：沒好、變嚴重或擴散；發燒；看起來很不舒服。</li>
  </ul>
  <h4>嘴巴裡白白的（鵝口瘡）</h4>
  <ul class="plain">
   <li>舌頭或嘴裡一層像白色乳酪的東西，寶寶可能不肯吃，通常不嚴重。</li>
   <li><b>未滿 4 個月要看醫師</b>；藥局買得到的口腔凝膠只適用 4 個月以上。</li>
   <li>預防：奶瓶每次用完消毒、奶嘴定期消毒；奶嘴頭和乳頭保護罩每週換；胸罩、溢乳墊、口水巾用熱水洗。有鵝口瘡時，擠出的母乳不要冷凍留著以後用。</li>
  </ul>
  <h4>臉上脫屑、紅疹、小痘痘</h4>
  <ul class="plain">
   <li><b>脂漏性皮膚炎</b>（頭皮的乳痂是同一種）：眉毛、眉心、眼皮、鼻翼旁、頭皮出現淡紅底加白或黃色皮屑。不癢、不傳染，通常 3 個月內出現，多在 6–12 個月大前自己好。</li>
   <li><b>新生兒痤瘡</b>：約 2 週大開始，臉頰、鼻子、額頭冒紅色小丘疹或白頭，約 2 成新生兒會有，幾週到幾個月內自己退，很少留疤。</li>
   <li>照顧：溫水輕洗、輕拍乾，不搓、不摳、不擠。厚屑先用保濕乳、椰子油、凡士林或礦物油軟化，再用軟刷、嬰兒洗髮精洗掉；油和洗髮精不要碰到眼睛。不用橄欖油、花生油、肥皂、大人洗髮精或有香味的產品；長痘的地方不擦油性產品。</li>
   <li>不要自己擦藥：抗黴菌藥膏、類固醇、痘痘藥都要醫師開。</li>
   <li>看醫生：照顧幾週沒改善、擴散到全身、流血滲液或腫起來、寶寶一直磨臉（會癢要排除異位性皮膚炎）、痘痘 6 週大以後才開始。眼白紅或有黃綠色眼屎，另外就醫。</li>
  </ul>
  <h4>眼屎多、一直流淚</h4>
  <ul class="plain"><li>常見原因是淚管阻塞（sticky eye）。回診時給醫師看一次確認。</li></ul>
  <h4>男寶寶的包皮</h4>
  <ul class="plain"><li>不要往後推。嬰兒期包皮和龜頭還黏在一起，硬推會撕裂出血；跟尿布區一樣清洗即可，不用棉花棒或消毒水。可以推的時間由醫師告訴你。</li></ul>
  <h4>肚臍凸起（臍疝氣）</h4>
  <ul class="plain">
   <li>肚臍一個軟軟的凸起，嬰兒很常見，多數 5 歲前自己消失，通常不用處理。</li>
   <li>看醫師：發現時給醫師看一次；凸起會痛、變硬、推不動、越來越大或一直沒消。</li>
   <li><span class="warn">立刻就醫</span>：肚子劇痛不停；吐、吃不下；凸起比平常腫、周圍皮膚變色；不能排便或排氣。</li>
  </ul>
  ${srcHTML(["consti","nhsNappy","nhsThrush","cradle","scSD","cutisSD","aadAcne","eye","penis","nhsHernia"])}`},

 {id:"momwarn",cat:"mom",h:"產後危險徵兆",g:"產後 1 年內都算；出現就立刻就醫",html:()=>`
  <p class="note">出現任一項：立刻就醫或打 119，並告訴醫護「我最近一年內生產」。拿不準嚴不嚴重，也先問婦產科。</p>
  <ul class="plain">
   <li><b>出血</b>：1 小時內濕透 1 片以上衛生棉、血塊比雞蛋大、排出組織，或分泌物有臭味；突然大量出血，合併頭暈、心跳很快。</li>
   <li><b>一側小腿或手臂</b>腫、痛、紅、熱（產後 6 週內特別注意，可能是血栓）。</li>
   <li><b>胸痛</b>、胸悶、痛到背、脖子或手臂；呼吸突然變喘、躺平就喘；心跳很快或不規則。</li>
   <li><b>頭痛</b>持續、越來越痛或突然劇痛；看東西模糊、閃光、看不見一塊或複視。</li>
   <li><b>發燒 38°C 以上</b>，尤其合併肚子痛、壓痛（可能感染）。</li>
   <li>昏倒、反覆頭暈、記憶斷片。</li>
   <li>臉或手明顯水腫。</li>
   <li>嚴重或突然的肚子痛；嚴重嘔吐、超過 8 小時喝不下水。</li>
   <li>想傷害自己或寶寶、覺得沒有希望；突然極度疲累到無法照顧寶寶。也可撥 1925 安心專線（24 小時免付費）。</li>
  </ul>
  ${srcHTML(["cdcHearHer","nhsBody","h1925"])}`},
 {id:"mood",cat:"mom",h:"產後情緒",g:"產後情緒低落很常見；約 1 成會變成產後憂鬱",html:()=>`
  <ul class="plain">
   <li>產後 3–4 天內，約 3–8 成媽媽會焦慮、心情低落、容易掉淚，多數幾天內就好。</li>
   <li>約 1 成媽媽在產後 6 週內發生產後憂鬱，持續較久，可能情緒激動、行為改變。情況一直沒改善或越來越重，就去婦產科、家醫科或身心科。</li>
   <li>孕產婦關懷專線 0800-870-870（孕期到產後、母乳、寶寶照顧、情緒都可以問）；1925 安心專線 24 小時免付費。</li>
   <li>家人可以分擔照顧寶寶和家事，輪班讓媽媽每天有一段連續睡眠；多聽、多陪伴。</li>
   <li>有想傷害自己或寶寶的念頭，看「產後危險徵兆」，立刻就醫。</li>
  </ul>
  ${srcHTML(["ppd","hotline","h1925","cdcHearHer"])}`},
 {id:"mastitis",cat:"mom",h:"乳腺炎",g:"繼續餵、冷敷；12–24 小時沒好就看醫師",html:()=>`
  <ul class="plain">
   <li>通常一邊乳房紅、腫、熱、痛，摸到硬塊，可能發燒、發冷、全身痠痛。</li>
   <li>繼續親餵或擠奶，不要突然停。</li>
   <li>每小時冷敷 10 分鐘；穿舒適內衣，避免太緊的衣服。</li>
   <li><span class="warn">不要</span>用力按摩或擠壓、不要擠出超過寶寶需要的量、不要抹油。</li>
   <li>可用 paracetamol（乙醯胺酚）或 ibuprofen 止痛，買之前跟藥師說正在餵母乳。</li>
   <li>在家處理 12–24 小時沒有改善，就去看醫生。</li>
  </ul>
  ${srcHTML(["mastitis","nhsBody"])}`},
 {id:"lochia",cat:"mom",h:"惡露、傷口、痔瘡與排便",g:"惡露數週變少；6 週前不用棉條",html:()=>`
  <h4>惡露</h4>
  <ul class="plain">
   <li>一開始量多，用加長型產墊並勤換，換前後洗手；幾週內慢慢變褐色、變少到停。</li>
   <li>親餵時子宮收縮，惡露可能變紅、變多，也可能像經痛。</li>
   <li>排出大血塊要告訴醫護；1 小時濕透 1 片以上看「產後危險徵兆」。</li>
   <li>6 週產後檢查前不用衛生棉條或月亮杯，用產墊或衛生棉。</li>
  </ul>
  <h4>會陰傷口與小便</h4>
  <ul class="plain">
   <li>每天用清水洗傷口、輕拍乾；縫線多半會自己吸收。</li>
   <li>上大號時拿乾淨的護墊輕壓傷口，比較不痛。</li>
   <li>小便刺痛：多喝水稀釋尿液。尿很困難、很痛或有異味，告訴醫護。</li>
  </ul>
  <h4>排便與痔瘡</h4>
  <ul class="plain">
   <li>產後幾天沒大便很常見；多吃纖維、多喝水，不要用力。一直便秘就問醫師，可以用溫和的軟便劑。</li>
   <li>痔瘡產後很常見，多數幾天到幾週消；藥膏請醫師或藥師開。</li>
   <li>親餵中要買止痛藥或成藥，先問藥師或醫師。</li>
  </ul>
  ${srcHTML(["nhsBody","cdcHearHer"])}`},
 {id:"pelvic",cat:"mom",h:"骨盆底與漏尿",g:"四種收縮、每種 10 下、每天 3 回",html:()=>`
  <ul class="plain">
   <li>產後笑、咳嗽、突然動的時候漏一點尿很常見，骨盆底運動有幫助。</li>
  </ul>
  <h4>骨盆底運動（躺、坐、站都可以）</h4>
  <ol class="plain num">
   <li>像憋住放屁一樣，收緊肛門往內往上提。</li>
   <li>像憋尿一樣，收緊陰道和尿道周圍。</li>
   <li><b>長收縮</b>：收緊最多撐 10 秒，再完全放鬆。</li>
   <li><b>短收縮</b>：快速收緊、立刻放鬆，重複到肌肉累。</li>
  </ol>
  <ul class="plain">
   <li>每一種逐步做到 10 下，<b>每天至少 3 回</b>。</li>
   <li>過程中正常呼吸，不要縮肚子。</li>
   <li>可以把「上完廁所、還坐在馬桶上」當提醒，尿完再做。</li>
   <li>做了沒改善：6–8 週產後檢查時提出，可轉骨盆底物理治療。</li>
  </ul>
  <p class="note">骨盆帶、束腹帶能不能「矯正骨盆」：沒有找到高品質來源，【資料不足，無法確認】，所以不收。</p>
  ${srcHTML(["nhsPPBody","nhsBody"])}`},
 {id:"tummy",cat:"mom",h:"肚子、身材與運動",g:"腹直肌分離約 8 週恢復；先散步與骨盆底運動",html:()=>`
  <h4>肚子和腹直肌分離</h4>
  <ul class="plain">
   <li>產後肚子比孕前大是正常的，肌肉被撐開了；均衡飲食加運動會慢慢恢復。</li>
   <li>懷孕時兩條腹直肌常分開約 2 指寬，<b>通常產後約 8 週回到正常</b>。</li>
   <li>自我檢查：仰躺、屈膝、腳踩地，肩膀稍微抬起，用手指量肚臍上方和下方的縫有幾指寬；定期量，看有沒有變窄。</li>
   <li>8 週後縫還很明顯：看醫師，可轉物理治療（不處理可能增加背痛風險）。</li>
   <li>初期避免：仰臥起坐、平板支撐、高衝擊運動、提重物、上廁所用力。</li>
  </ul>
  <h4>深層腹肌運動</h4>
  <ul class="plain"><li>側躺、膝蓋微彎，吸氣放鬆肚子；吐氣時把下腹往內收（像穿束腹讓腰變細），同時收緊骨盆底，正常呼吸撐 10 秒再放鬆。最多 10 下。</li></ul>
  <h4>什麼時候可以運動</h4>
  <ul class="plain">
   <li>順產、覺得可以了：就能開始散步、伸展、骨盆底運動。</li>
   <li>難產或剖腹產：恢復較久，做較費力的運動前先問醫師。</li>
   <li>跑步、有氧等高衝擊運動：等 6 週產後檢查問過再開始。</li>
   <li>游泳：惡露停止滿 7 天後。</li>
  </ul>
  <h4>體重與飲食</h4>
  <ul class="plain">
   <li>均衡飲食加規律中等運動（例如每天快走 30 分鐘），不會影響母乳的品質和量。</li>
   <li>親餵、體重正常的話，不需要特別的飲食；每天至少 5 份蔬果，多喝水、多休息。</li>
  </ul>
  ${srcHTML(["nhsPPBody","nhsFit","nhsBody"])}`},
 {id:"back",cat:"mom",h:"腰痠背痛與媽媽手",g:"餵奶坐姿、蹲下不彎腰；拇指側手腕痛",html:()=>`
  <h4>顧好腰背</h4>
  <ul class="plain">
   <li>餵奶：背靠好坐直，腰後放一個小靠墊，腳踩得到地。</li>
   <li>做低處的事：跪或蹲，不要彎腰。</li>
   <li>換尿布：在高一點的平面，或跪在沙發、床邊換。寶寶在高處時一秒都不離開。</li>
   <li>抱起寶寶或東西：背挺直、彎膝蓋。</li>
   <li>推推車時背挺直；或改用合身的揹巾。</li>
   <li>腹直肌分離沒回來可能增加背痛，看「肚子、身材與運動」。</li>
  </ul>
  <h4>媽媽手（狄奎凡氏症）</h4>
  <ul class="plain">
   <li>大拇指那一側的手腕痛、壓痛，可能痛到前臂；大拇指動、抓握、抱、扭手腕時更痛；可能腫或卡卡的。</li>
   <li>和懷孕、產後有關，常在產後 4–6 週出現；大拇指朝上、手腕出力抱孩子會加重。</li>
   <li>處理：減少會痛的動作，特別是手腕左右出力；冰敷；可拆式護具固定手腕和拇指（晚上戴特別有幫助）；消炎止痛藥（親餵先問醫師或藥師）；類固醇注射由醫師評估。</li>
   <li>很嚴重，或保守治療 6 週沒改善：才由醫師評估是否手術。</li>
  </ul>
  ${srcHTML(["nhsPPBody","aaosDQ"])}`},
 {id:"hair",cat:"mom",h:"產後掉髮",g:"約產後 4 個月最多；多數寶寶 1 歲前恢復",html:()=>`
  <ul class="plain">
   <li>產後幾個月開始明顯掉髮，<b>約產後 4 個月最多</b>。</li>
   <li>原因是雌激素下降造成的「休止期落髮」，是暫時多掉，<b>不是真正的禿髮</b>，不需要治療。</li>
   <li>多數在寶寶 1 歲前恢復原本的髮量。</li>
  </ul>
  <h4>皮膚科醫師的建議</h4>
  <ul class="plain">
   <li>用「蓬鬆型（volumizing）」洗髮精。</li>
   <li>避開標示「潤髮、修護（conditioning）」的洗髮精和深層護髮，太厚重會讓頭髮更塌。</li>
   <li>潤髮乳選細軟髮用的，只擦髮尾。</li>
   <li>剪短一點，看起來比較多、也比較好整理。</li>
  </ul>
  <ul class="plain">
   <li>寶寶滿 1 歲髮量還沒回來：看皮膚科，可能有其他原因。</li>
   <li>吃保健品能不能減少產後掉髮：這份來源沒有提到，【資料不足，無法確認】。</li>
  </ul>
  ${srcHTML(["aadHair"])}`},
 {id:"period",cat:"mom",h:"月經與避孕",g:"最早產後 3 週就可能再懷孕；21 天內開始避孕",html:()=>`
  <ul class="plain">
   <li>瓶餵或混合餵養（淩淵是混合）：最早產後 5–6 週就可能來月經。</li>
   <li>全親餵（包括夜裡）：可能等到減少親餵後才來。</li>
   <li><b>最早產後 3 週就可能再懷孕</b>，即使正在親餵、月經還沒來。</li>
   <li>建議產後 21 天內開始避孕；用哪種方法問婦產科。</li>
   <li>6 週產後檢查前不用衛生棉條或月亮杯。</li>
  </ul>
  <p class="note">淩淵 10/1 出生，10/22 滿 21 天。</p>
  ${srcHTML(["nhsBody"])}`},

 {id:"visit",cat:"home",h:"親友探視與過年",g:"不親臉頰、洗手再抱、家人打疫苗",html:()=>`
  <ul class="plain">
   <li><b>不要親寶寶的臉和手</b>。有唇疱疹的人親寶寶，可能造成新生兒皰疹，對新生兒非常危險；從開始刺癢到完全癒合都會傳染。</li>
   <li>進門先洗手再抱。感冒、發燒、拉肚子或嘴邊有疱疹的親友，這陣子先不要抱。</li>
   <li>爸媽與常照顧的長輩打流感疫苗：2026 年度公費第一階段 10/1 開打，未滿 6 個月嬰兒的雙親或實際扶養者是公費對象。</li>
   <li>家裡和車上不抽菸，包括電子菸。</li>
   <li>過年人多：可以先把下面這段話傳到家族群組。長途開車時，2 歲以下坐後座提籃或後向座椅；在座椅上睡著，到了要移到床上仰睡。</li>
  </ul>
  <div class="calc" style="display:flex;flex-direction:column;gap:8px"><span>${VISITOR_MSG}</span><button type="button" class="btn ghost" data-copy="visitor" style="align-self:flex-start">複製這段話</button></div>
  ${srcHTML(["nhsCold","flu","aapSleep","car"])}`},
 {id:"out",cat:"home",h:"外出、乘車與新家",g:"2 歲以下坐後座後向、避開日曬、入住前驗甲醛",html:()=>`
  <h4>乘車</h4>
  <ul class="plain">
   <li>2 歲以下：放在後座的攜帶式嬰兒床（提籃）或<b>後向</b>幼童座椅。建議裝在後座中間；一張座椅只坐一個孩子；安全帶繫緊，與身體留約一指寬。</li>
   <li>小型車載幼童沒有依規定坐安全椅，罰駕駛新臺幣 1,500–3,000 元；6 歲以下兒童單獨留在車內，罰駕駛 3,000 元（道路交通管理處罰條例第 31 條）。</li>
   <li>在座椅上睡著，到家後移到床上仰睡。</li>
  </ul>
  <h4>日曬</h4>
  <ul class="plain"><li>6 個月以下避開直接和間接日照；外出用有遮陽的推車、穿薄長袖長褲、戴寬帽，避開上午 10 點到下午 4 點。防曬乳 6 個月以上才用。</li></ul>
  <h4>林口新家</h4>
  <ul class="plain"><li>新裝潢與新家具會釋放甲醛等揮發性有機物。入住前請專業檢測，依《室內空氣品質標準》判讀：甲醛 1 小時值 0.08 ppm、總揮發性有機化合物（TVOC）1 小時值 0.56 ppm。寶寶房的新家具最晚搬入，入住後持續通風（待辦已列）。</li></ul>
  ${srcHTML(["car","lawCar","aapSleep","sun","iaq"])}`},

 {id:"gofaq",cat:"go",chk:"2026/10/30",h:"出門遇到狀況：先看這裡",g:"發燒、哭不停、嗆到、吐奶、摔到頭、太熱太冷、被叮、陌生人要抱……一張卡一個做法",html:()=>`
  <p class="note">在外面慌的時候照這頁做。有紅色標籤的＝馬上處理；其他照卡片裡的順序試。細節點各卡下面的主題。</p>
  <div class="games">
   <div class="game"><div class="gt"><b>叫不醒、不呼吸、嘴唇發紫</b><span class="chip s-over">119</span></div><div>馬上打 119、開擴音，照派遣員說的做 CPR；請旁邊的人去拿 AED。CPR 步驟在「醫療 › 急救」，附近 AED 頁也在那裡。</div></div>
   <div class="game"><div class="gt"><b>嗆到：咳不出聲、哭不出來</b><span class="chip s-over">馬上救</span></div><div>叫人打 119。頭低於身體，<b>5 下拍背 ↔ 5 下壓胸</b>輪流。還會咳、會哭：不要拍、不要挖，讓他自己咳。</div><div class="gfor">看「嗆到怎麼救」。</div></div>
   <div class="game"><div class="gt"><b>摸起來很燙、量到 38°C</b><span class="chip s-over">未滿 3 個月直接急診</span></div><div>未滿 3 個月（到 2027/1/1）：38.0°C 以上<b>直接去最近的急診</b>，不先回家觀察，不自己給退燒藥。量肛溫最準。</div><div class="gfor">「醫療」頁有導航到急診的按鈕。</div></div>
   <div class="game"><div class="gt"><b>摔下來撞到頭</b><span class="chip s-over">未滿 1 歲有腫包就叫救護車</span></div><div>英國 NHS：未滿 1 歲，頭上有<b>瘀青、腫包或大傷口</b>，就打 119。任何年紀：昏過去、抽搐、從超過 1 公尺高摔下、耳朵或鼻子流清水、行為跟平常不一樣，也打 119。</div><div class="gfor">沒有上面這些：冰敷（用布包著），之後 24 小時都要有大人在旁邊看。</div></div>
   <div class="game"><div class="gt"><b>哭不停、哄不好</b></div><div>先檢查：餓了嗎、尿布、太熱或太冷（摸胸口或上背）。再試：抱著平穩地走約 5 分鐘、坐下抱約 8 分鐘。哭聲跟平常不一樣、合併發燒、很難叫醒：照「醫療」頁第二層，直接就醫。</div><div class="gfor">看「哭鬧與安撫」。</div></div>
   <div class="game"><div class="gt"><b>吐奶</b></div><div>直立抱一下、擦乾、換衣服；下一餐少量一點。<span class="warn">吐綠色或黃色、帶血或像咖啡渣、噴射狀、一直吐喝不進去：立刻就醫。</span></div><div class="gfor">看「溢奶與吐奶」。</div></div>
   <div class="game"><div class="gt"><b>大便爆出來、拉很多次</b></div><div>換尿布、換衣服（外出包要帶一套）。很水又很多次、帶血或黏液、尿布變少、不太喝奶：找小兒科；看起來很不舒服就直接就醫。</div><div class="gfor">看「腹瀉與嘔吐」。</div></div>
   <div class="game"><div class="gt"><b>太熱：臉紅、流汗、胸口很燙</b></div><div>移到陰涼或冷氣處、脫一層，只穿尿布也可以；多餵奶。<span class="warn">皮膚又熱又紅又乾、很難叫醒、抽搐：119。</span>不要自己泡鹽水或電解質水給寶寶。</div><div class="gfor">看「天氣：熱、冷、太陽、蚊子」。</div></div>
   <div class="game"><div class="gt"><b>太冷：胸口、背摸起來涼</b></div><div>加一層、戴帽子，進室內。手腳冰冰的很常見，判斷冷熱看胸口或上背，不看手腳。</div></div>
   <div class="game"><div class="gt"><b>在揹巾、推車、汽座裡睡著了</b></div><div>揹巾：看得到臉、下巴不貼胸口、口鼻沒有被布蓋住。推車、汽座：短時間可以；到了目的地或回家，移到平的床上<b>仰睡</b>。</div><div class="gfor">看「交通工具」。</div></div>
   <div class="game"><div class="gt"><b>被蚊子叮</b></div><div>清水洗、冷敷。未滿 2 個月不擦防蚊液（美國 CDC）；推車、揹巾罩蚊帳，穿薄長袖長褲。紅腫一直擴大、發燒、流膿：看醫師。</div></div>
   <div class="game"><div class="gt"><b>曬紅了</b></div><div>移到陰涼處，涼的濕毛巾敷，不要讓寶寶冷到；寶寶曬傷要盡快看醫師（英國 NHS）。6 個月以下不擦防曬乳，靠遮陽。</div></div>
   <div class="game"><div class="gt"><b>陌生人或親友要抱、要親</b></div><div>可以直接說：「他還太小、還沒打完疫苗，我們先不給抱，謝謝。」不親臉和手；有感冒或嘴邊有疱疹的人不靠近。</div><div class="gfor">看「親友探視與過年」，有一段話可以複製。</div></div>
   <div class="game"><div class="gt"><b>要在外面餵母乳、被說不行</b></div><div>法律保障：任何人不得禁止、驅離或妨礙在公共場所哺乳，違反可罰 6,000–30,000 元（公共場所母乳哺育條例）。</div><div class="gfor">看「外面餵奶」。</div></div>
  </div>

 {id:"gofeed",cat:"go",chk:"2026/10/30",h:"外面餵奶：配方、母乳、哺乳室",g:"奶粉和熱水分開帶，要喝再泡；母乳保冷袋 24 小時；公共場所餵奶受法律保障",html:()=>`
  <h4>配方奶</h4>
  <ul class="plain">
   <li><b>奶粉和熱水分開帶，要喝再泡</b>：分裝盒裝好每一餐的奶粉、保溫瓶裝熱開水、乾淨奶瓶。</li>
   <li>未滿 2 個月、早產或免疫力較弱：沖泡要用很熱的水（約 70°C）才能殺菌；水煮開後放約 5 分鐘再泡（CDC）。所以保溫瓶的水要夠熱，泡好後放涼或用冷水沖瓶身降溫，滴手腕內側溫溫的才餵。</li>
   <li><b>泡好 2 小時內要用；開始喝之後 1 小時內喝完</b>，剩的倒掉，不留到下一餐（CDC）。</li>
   <li>奶不用加熱也可以喝；要加熱就用溫水沖瓶身，不用微波（CDC）。</li>
   <li>未開封的奶粉罐放室內陰涼乾燥處，<b>不要放在車上</b>（CDC）。</li>
  </ul>
  <h4>擠出來的母乳</h4>
  <ul class="plain">
   <li>保冷袋加冷凍過的冰寶：<b>最多 24 小時</b>（CDC）。到了目的地馬上喝，或放冰箱冷藏、冷凍。</li>
   <li>剛擠出的放室溫（25°C 以下）最多 4 小時；冷藏 4 天（CDC）。</li>
   <li>喝過一口或回溫過的：2 小時內喝完，剩的倒掉。</li>
  </ul>
  <h4>親餵、哺乳室與法律</h4>
  <ul class="plain">
   <li><b>任何人不得禁止、驅離或妨礙</b>婦女在公共場所哺乳；就算那裡有哺乳室，也可以選擇在外面餵（衛福部說明公共場所母乳哺育條例）。</li>
   <li>違反：罰 6,000–30,000 元；如果是場所員工做的，場所負責人也可能被罰（同上）。</li>
   <li>一定要設哺集乳室並清楚標示：大型公共場所、火車站、機場航廈、捷運轉乘站、百貨公司、大賣場（同上）。</li>
  </ul>
  <p class="note">衛福部 <a href="https://mohw.gov.tw/cp-16-74597-1.html" target="_blank" rel="noopener">2023/5/12 新聞稿</a>仍寫違反者罰 6,000–30,000 元，和 2012 年說明相同。條例原文本次未讀到，若之後修法以全國法規資料庫為準。</p>
  <h4>出門前</h4>
  <ul class="plain">
   <li>算一下會在外面幾餐，多帶 1 餐的量。</li>
   <li>餵完直立抱一下、拍嗝；在推車或汽座裡吐奶比較難處理。</li>
  </ul>

 {id:"godiaper",cat:"go",chk:"2026/10/30",h:"外面換尿布",g:"尿布台一定扣安全帶、手不離開寶寶；東西先拿好；換完洗手",html:()=>`
  <ul class="plain">
   <li><b>東西先拿好再放寶寶上去</b>：尿布、濕巾、隔尿墊、屁屁膏、裝髒尿布的袋子，放在你拿得到、寶寶碰不到的地方（KidsHealth）。</li>
   <li><b>每次都扣安全帶，一隻手一直放在寶寶身上</b>；就算覺得他不會動，也不要離開（KidsHealth）。</li>
   <li>公共尿布台先鋪一張隔尿墊，用完丟掉或帶回家洗。</li>
   <li>找不到尿布台：鋪隔尿墊在地上或寬的長椅上換，比在窄的高處換安全（App 依上面的跌落風險整理）。不要放在洗手台、窄桌邊緣。</li>

  <h4>熱</h4>

   <li>熱傷害徵象：體溫升高、皮膚又熱又紅又乾、心跳很快；嚴重時抽搐、叫不醒（國健署）。→ 移到陰涼處、鬆開衣服、用水擦身體或搧風，<b>盡快就醫</b>。</li>
   <li>國健署寫的「加少許鹽的涼開水」是給一般人的；寶寶不要自己泡鹽水或電解質水，照常餵奶、直接就醫。</li>

   <li>寶寶曬傷：移到陰涼、用涼的濕毛巾敷，不要讓他冷到；盡快看醫師（英國 NHS）。</li>

   <li><span class="warn">坐汽座不要穿厚外套、羽絨衣</span>：撞擊時蓬鬆的外套一壓就扁，安全帶會變鬆、孩子可能滑出去。穿薄的幾層，<b>扣好安全帶後</b>再蓋毯子，或把外套反穿蓋在安全帶外面（AAP）。</li>

   <li>汽座罩：只用寶寶身體下面沒有任何墊層的款式，臉不能被蓋住（AAP）。</li>

  <h4>汽車</h4>
  <ul class="plain">
   <li>2 歲以下：放在後座的提籃或<b>後向</b>座椅；後向乘坐安全性高 75%（國健署）。</li>
   <li>國健署口訣「後、安、固、指」：放後座、照說明書安裝、裝好要穩固不晃、安全帶跟身體留約一指寬。</li>
   <li>大人抱在手上不算安全座椅：2 歲以下規定要用提籃或後向座椅（國健署）；違規罰駕駛 1,500–3,000 元（道路交通管理處罰條例第 31 條）。</li>
   <li>6 歲以下不可單獨留在車內（同條例第 31 條）。冬天不穿厚外套坐汽座（看「天氣」）。</li>
  </ul>
  <h4>計程車、叫車</h4>
  <ul class="plain">
   <li>把自己的提籃式汽座帶上車，照說明書用安全帶固定在後座。</li>
   <li>計程車有沒有義務提供安全座椅、沒有座椅時會不會罰：新聞報導（TVBS 2017/10/20）寫法令只強制私家小型車，計程車、公車、客運沒有強制；但現行法規原文本次讀不到，有無修法【資料不足，無法確認】。不管規定，寶寶的安全靠汽座。</li>
  </ul>
  <h4>推車</h4>
  <ul class="plain">
   <li>停下來就踩煞車；五點式安全帶每次都扣（AAP）。</li>
   <li><span class="warn">包包不要掛在把手上</span>：推車會往後翻；東西放下面的籃子（AAP）。</li>
   <li>打開要確實卡好再放寶寶，收折時手指遠離關節（AAP）。</li>
   <li>不讓寶寶離開視線；在推車裡睡著要一直看得到他（AAP），回家移到床上仰睡。</li>
   <li>太熱時不用毯子蓋住推車（看「天氣」）。</li>
  </ul>
  <h4>揹巾、揹帶</h4>
  <ul class="plain">
   <li><b>隨時看得到寶寶的臉</b>，臉在布料邊緣上方、口鼻不被布蓋住（美國 CPSC）。</li>
   <li><b>下巴不要貼到胸口</b>：縮成一團、下巴貼胸的姿勢會影響呼吸，可能窒息（CPSC）。</li>
   <li>未滿 4 個月、早產、出生體重低、感冒或呼吸道不舒服的寶寶風險較高，更要小心（CPSC）。淩淵現在未滿 4 個月。</li>
   <li>常低頭檢查；在揹巾裡餵完奶要把寶寶重新擺好（CPSC）。</li>
  </ul>
  <h4>捷運、公車、高鐵</h4>
  <ul class="plain">
   <li>避開尖峰；用揹巾或推車，讓寶寶的臉朝向大人。注意事項看「外出場所指南與外出包」。</li>
  </ul>
  <h4>機車</h4>
  <ul class="plain">
   <li>法規有沒有寫幾歲以上才能坐機車：警方說明引用的《道路交通安全規則》第 88 條只規定小型輕型機車不得載人、後座要有固定座位、不得側坐、要戴安全帽，<b>沒有年齡下限</b>（TVBS 2026/1/22 轉引，條文原文本次未讀到）。沒寫年齡不等於安全。</li>
   <li>機車沒有任何給嬰兒用的保護裝置，抱著、用揹巾或放在腳踏墊都沒有保護。App 的建議：<b>不要騎機車載淩淵</b>（App 依上面整理，不是官方規定）。</li>
  </ul>
  <h4>飛機</h4>
  <ul class="plain">
   <li>Mayo Clinic：專家不建議出生 7 天內搭飛機；健康足月的寶寶通常幾週後就可以，也有醫師建議等到滿幾個月。要搭之前先問小兒科。</li>
   <li>起飛、開始降落時給他吸奶或奶嘴，可以減少耳朵不舒服（Mayo Clinic）。</li>
   <li>美國 FAA 建議嬰兒坐在固定好的安全座椅上，多數嬰兒汽座可用在飛機上（Mayo Clinic 引述）。</li>
   <li>各航空公司的最小年齡規定不同，訂票前查。未滿 3 個月期間（到 2027/1/1）發燒 38°C 就要就醫，長途行程更難處理（看「外出場所指南」）。</li>
  </ul>

  <p class="note">一句話：沒有「滿幾個月就安全」的官方門檻（確切月齡【資料不足，無法確認】）。判斷方式＝<b>接觸到病人的機會 × 寶寶有多脆弱</b>。</p>

  <ul class="plain">
   <li><b>低風險</b>：戶外、通風、沒人碰寶寶，例如推車在公園散步。天氣好、穿著合適，大人準備好就可以出門（KidsHealth）。</li>
   <li><b>高風險</b>：室內、擁擠、空氣不流通、會被抱被親：百貨、餐廳、喜宴、過年拜年、醫院候診區。KidsHealth：有些醫師建議滿幾個月再去擁擠場所。</li>
   <li>病菌主要靠近距離接觸和室內空氣傳；美國 CDC：戶外的病毒不像室內那樣累積在空氣裡，室內開窗、開抽風扇也有幫助。</li>
   <li>各場所（公園、親友家、餐廳、百貨、捷運、醫院、喜宴拜年）的注意事項和外出包清單：看「外出場所指南與外出包」。</li>

  <ul class="plain">

   <li>6 個月以下是百日咳高危險群：未完成 3 劑基礎劑的 6 個月以下嬰兒，約占確定病例的 40% 以上，傳染來源多是親密照顧者（衛福部）。</li>
  </ul>
  <h4>依疫苗時程，淩淵各階段的保護</h4>
  <div class="tbwrap"><table class="tb"><thead><tr><th>時間</th><th>疫苗（公費時程）</th><th>保護</th></tr></thead><tbody>
   <tr><td>出生～<br>12/1</td><td>B 肝第 1 劑（第 2 劑 11/5）</td><td>主要靠媽媽給的抗體：媽媽孕期打過百日咳（Tdap）和 RSV 疫苗</td></tr>
   <tr><td>12/1<br>2 個月</td><td>五合一（含百日咳、b 型嗜血桿菌）、肺炎鏈球菌、輪狀第 1 劑</td><td>開始有，只有 1 劑</td></tr>
   <tr><td>2027/2/1<br>4 個月</td><td>第 2 劑</td><td>部分</td></tr>
   <tr><td>2027/4/1<br>6 個月</td><td>第 3 劑；可打流感疫苗；預計補打 RSV 抗體</td><td>基礎劑完成</td></tr>
   <tr><td>1 歲</td><td>麻疹腮腺炎德國麻疹（MMR）、水痘</td><td>麻疹保護從這時開始</td></tr>
  </tbody></table></div>
  <ul class="plain">
   <li><b>家人疫苗（2026/10/25 爸爸告知）</b>：太太、爸爸、奶奶、外公、外婆都打過百日咳和流感疫苗。常抱淩淵的人都打了，傳給他的機會比較低。</li>
   <li><b>太太是孕期打百日咳疫苗</b>（2026/10/26 爸爸告知）。美國 CDC：孕期 27–36 週打，抗體會在出生前傳給寶寶，是短期保護；2 個月以下寶寶得百日咳的風險少 78%，需要住院的重症 10 個裡防住 9 個。孕期第幾週打的：【資料不足，無法確認】。這份抗體只能撐過頭幾個月，所以 12/1 起的五合一仍要準時打。</li>
   <li>流感：淩淵 6 個月前不能打，靠身邊的大人都打。疾管署 9/22：流感仍在上升，以 A 型 H1N1 為主。</li>

  <h4>實際做法</h4>
  <ul class="plain">
   <li><b>0–2 個月（到 12/1）</b>：戶外通風散步可以；避開室內擁擠場所；外人不抱、不親臉；生病的人不靠近。</li>

   <li><b>6 個月以後</b>：基礎劑完成、可打流感疫苗，風險明顯降低。</li>

   <li>抱、摸、餵寶寶前先洗手；常規疫苗準時打，家人每年打流感疫苗（KidsHealth）。</li>
   <li>回診、打疫苗難免要去醫院：候診時跟其他病人保持距離即可。</li>
  </ul>

  <div class="games"><div class="game"><div class="gt"><b>公園、戶外步道</b><span class="chip s-done">風險低</span></div><div>推車遮陽、穿薄長袖；6 個月以下避免直接日照、避開 10–16 點。不讓陌生人摸、親。</div><div class="gfor">戶外的病毒不像室內那樣累積在空氣裡（美國 CDC）。</div></div><div class="game"><div class="gt"><b>社區散步</b><span class="chip s-done">風險低</span></div><div>騎樓人多時不停留；回家大人先洗手再抱。</div><div class="gfor">同上：戶外、時間短。</div></div><div class="game"><div class="gt"><b>開車兜風</b><span class="chip s-done">風險低</span></div><div>後座後向汽座、繫緊；睡著到了就抱到床上仰睡；不單獨留在車內。</div><div class="gfor">車內只有家人。</div></div><div class="game"><div class="gt"><b>親友家</b><span class="chip s-week">風險中</span></div><div>先把「親友探視與過年」那段話傳過去；開窗或開抽風扇讓空氣流通（美國 CDC）；洗手再抱；感冒、發燒、拉肚子、嘴邊有疱疹的不抱、不親。</div><div class="gfor">室內、近距離，有沒有人生病差很多。</div></div><div class="game"><div class="gt"><b>餐廳、咖啡廳</b><span class="chip s-week">風險中～高</span></div><div>選離峰時段、靠窗或戶外座位、時間短；推車不讓陌生人靠近。</div><div class="gfor">室內、人多、待得久。</div></div><div class="game"><div class="gt"><b>百貨、大賣場</b><span class="chip s-over">風險高</span></div><div>未滿 2 個月盡量不去；要去就離峰、短時間，大人戴口罩。</div><div class="gfor">室內擁擠；KidsHealth：有些醫師建議滿幾個月再去擁擠場所。</div></div><div class="game"><div class="gt"><b>捷運、公車</b><span class="chip s-week">風險尖峰高、離峰中</span></div><div>避開上下班尖峰；用揹巾或推車，讓寶寶的臉朝向大人；能開車就用汽座。</div><div class="gfor">密閉、近距離。</div></div><div class="game"><div class="gt"><b>高鐵、飛機</b><span class="chip s-over">風險高</span></div><div>未滿 3 個月盡量不安排長途：這段時間 38°C 就要就醫，旅途中不好處理。真的要去，先問醫師。</div><div class="gfor">密閉、人多、時間長。</div></div><div class="game"><div class="gt"><b>醫院、診所</b><span class="chip s-over">風險高，但必要</span></div><div>預約時段、晚一點到少等一點；候診時離咳嗽的人遠一點；大人戴口罩；回家先洗手。</div><div class="gfor">病人集中；回診、打疫苗不能不去。</div></div><div class="game"><div class="gt"><b>喜宴、拜年、聚會</b><span class="chip s-over">風險高</span></div><div>時間短；外人不抱、不親臉；生病的人不靠近。過年時淩淵約 4 個月、只打了 2 劑。</div><div class="gfor">室內擁擠、待得久、很多人想抱。</div></div></div>
  <p class="note">風險高低是 App 依上面三件事整理，不是官方分級；每張卡片最下面的灰色小字才是來源的說法。</p>
  <h4>外出包清單</h4>
  <ul class="plain"><li><b>尿布、隔尿墊、裝髒尿布的袋子</b></li><li><b>清水濕巾或紗布＋屁屁膏</b><br><span class="note">2–4 週前先用清水（看「脫皮、乳液與屁屁膏」）</span></li><li><b>備用衣服、包巾或薄毯</b><br><span class="note">穿得比大人多一層即可</span></li><li><b>奶瓶、分裝好的配方奶粉、熱水</b><br><span class="note">要喝時再泡；泡好 2 小時內用，開始喝 1 小時內喝完（CDC）</span></li><li><b>大人用乾洗手</b><br><span class="note">給大人用，不擦寶寶的手</span></li><li><b>推車遮陽罩、薄長袖、寬帽</b><br><span class="note">6 個月以下不擦防曬乳</span></li><li><b>健保卡、兒童健康手冊</b><br><span class="note">看醫生、打疫苗、臨時就醫要用</span></li><li><b>汽座（開車時）</b><br><span class="note">後座後向</span></li></ul>

 {id:"choke",cat:"home",chk:"2026/10/28",h:"嗆到怎麼救（異物哽塞）",g:"會咳就讓他咳；哭不出、咳不出：未滿 1 歲拍背＋壓胸，1 歲以上拍背＋推腹；防嗆器只當備案",html:()=>`
  <p class="note">依美國心臟協會（AHA）與 AAP 2025 年 10 月新版指引、愛爾蘭衛生署（HSE）、美國 FDA。手法要靠實際上課練過才做得出來，這頁是複習用，不能代替上課。</p>
  <h4>先分輕重（最重要的一步）</h4>
  <div class="games"><div class="game"><div class="gt"><b>還在咳、哭得出聲音</b></div><div><b>不要拍、不要挖</b>，讓他自己咳，在旁邊盯著有沒有變嚴重（AHA）。FDA 提醒：還能咳時去拍背，可能把部分阻塞變成完全阻塞。</div></div><div class="game"><div class="gt"><b>哭不出聲、咳不出來、不能呼吸</b></div><div>立刻動手救，同時叫另一個人打 <b>119</b> 開擴音；只有自己一個人時，先救一輪再打。這種情況可能很快變成心跳停止（AHA）。</div></div></div>
  <h4>未滿 1 歲（淩淵到 2027/10/1）：5 下拍背 ↔ 5 下壓胸，輪流重複</h4>
  <ul class="plain">
   <li><b>拍背</b>：坐下，讓寶寶臉朝下趴在你的前臂上，前臂靠在大腿上；手托住下巴與頭頸，<b>頭比身體低</b>。用另一手掌根在兩片肩胛骨中間用力拍 5 下（HSE）。</li>
   <li><b>壓胸</b>：還沒出來就翻成臉朝上，躺在前臂、靠在大腿上，頭一樣比身體低；在胸骨中間、約兩側腋下連線的高度，快速用力往下壓 5 下（HSE）。</li>
   <li>壓胸用什麼壓：AHA 2025 改為<b>單手掌根</b>；愛爾蘭 HSE 仍寫兩根手指。上課照講師教的版本做。</li>
   <li><b>不要壓肚子</b>：未滿 1 歲不做哈姆立克（推腹），可能傷到腹部器官（AHA）。</li>
   <li>重複「5 拍背、5 壓胸」，直到東西出來、救護車到，或寶寶失去反應。</li>
  </ul>
  <h4>1 歲以上：5 下拍背 ↔ 5 下推腹（哈姆立克），輪流重複</h4>
  <ul class="plain">
   <li>AHA 2025 新版：孩子嚴重哽塞時，5 下拍背和 5 下推腹輪流做；舊版只教推腹。</li>
  </ul>
  <h4>失去反應時</h4>
  <ul class="plain">
   <li>放在硬的平面上，馬上開始 CPR，<b>先壓胸</b>，不用花時間摸脈搏（AHA）。119 線上人員會帶著做。</li>
   <li>每次打開呼吸道要吹氣前，看嘴裡：<b>看得到</b>東西才拿出來。</li>
   <li><b>不要用手指盲挖</b>：看不到東西時伸手指進去，可能把東西推得更深，AHA 列為「有害」。</li>
   <li>嬰兒 CPR 的按壓：2025 年起取消「兩指壓胸」（壓不夠深），改用兩手拇指環抱胸部，或單手掌根（AHA）。</li>
  </ul>
  <h4>東西出來以後</h4>
  <ul class="plain">
   <li>就算東西已經出來，還是要給醫師看：可能有一部分還在，或救的時候受了傷（HSE）。</li>
  </ul>
  <h4>防嗆器（LifeVac、Dechoker 等抽吸式）要不要買</h4>
  <ul class="plain">
   <li><b>FDA</b>（2026/3/4 更新）：標準手法（拍背、推腹）是最有效的方法；防嗆器只能在標準手法失敗後當第二選擇，先用防嗆器可能延誤救命。要拆包裝、組裝才能用，會花時間。已知問題：吸不出來、臉與嘴唇瘀青、喉嚨刮傷。</li>
   <li>FDA 截至 2026/3/4 只授權 1 款：<b>LifeVac</b>（De Novo DEN250012，2026/3/4 核准信），定位是「標準手法失敗後的第二線」，<b>只適用 1 歲以上</b>，禁忌症明列「未滿 1 歲兒童」（<a href="https://www.accessdata.fda.gov/cdrh_docs/pdf25/DEN250012.pdf" target="_blank" rel="noopener">FDA 核准文件</a>）。2025/10/8 對多款未授權的抽吸式防嗆器發布進口警示。</li>
   <li><b>AHA 2025</b>：對嬰兒與兒童的效果與安全性都還沒確立，證據只有一份來自廠商贊助登錄系統的病例報告，不足以建議使用。</li>
   <li><b>英國復甦委員會（RCUK）</b>、<b>愛爾蘭 HSE</b>：目前不支持／不要使用，理由是研究不足、可能延誤正確處置。</li>
   <li>嬰兒尺寸面罩：FDA 授權的這款只附成人與兒童面罩，臉型評估從 1 歲起，未滿 1 歲是禁忌症（同上）。所以<b>淩淵 1 歲前不適用任何經 FDA 授權的防嗆器</b>；其他品牌的嬰兒面罩沒有安全有效的證據。</li>
   <li>如果家人還是想買：放在固定位置、事先照說明書練過，<b>只在 5 拍背＋5 壓胸（或推腹）做了沒用時才拿</b>，不能拿來代替上課。</li>
  </ul>
  <h4>最該做的一件事</h4>
  <ul class="plain">
   <li>所有照顧者（爸爸、媽媽、奶奶、外公外婆）都去上一次嬰兒 CPR 與異物哽塞課（AAP 建議照顧者上合格的 CPR 與急救課）。報名前問清楚是否已改用 2025 年新版；台灣哪些課程已更新【資料不足，無法確認】。</li>
  </ul>
  <h4>預防：4 歲前少給、或切小再給的食物（AAP）</h4>
  <ul class="plain">
   <li>熱狗與香腸、肉條、大塊肉、大塊起司：一定要切成很小的塊。</li>
   <li>整顆葡萄（先切開）、生的紅蘿蔔條、生的蘋果塊。</li>
   <li>堅果和種子（尤其葵花子）、爆米花、硬糖或黏牙的糖、口香糖、棉花糖。</li>
   <li>一大匙花生醬等堅果醬：抹薄薄一層。</li>
   <li>食物切到不超過約 1.3 公分（半英寸）；吃東西一定坐著，不要邊走、邊跑、邊玩、躺著吃。</li>
   <li>家裡的小東西：氣球（8 歲前都有嗆到風險）、硬幣、彈珠、小球、筆蓋、小零件玩具、鈕扣電池、餵藥針筒；沙發縫和家具底下要常檢查。</li>
   <li>哥哥姊姊或其他小孩常是源頭：他們會把食物、玩具、小東西拿給小寶寶。</li>
  </ul>

 {id:"danger",cat:"home",chk:"2026/10/28",h:"各年齡最危險的事故與預防",g:"未滿 1 歲睡眠窒息、1–4 歲溺水；還有車禍、墜樓、鈕扣電池、燙傷、藥物、窗簾繩",html:()=>`
  <p class="note">致命事故集中在少數幾種方式，而且跟著孩子會做什麼而換。預防靠「把環境改到出事也不會致命」比靠「一直盯著」可靠：人一定會分心，但窗戶限位器、高處的藥櫃不會。（這段是 App 依下列資料整理的觀點。）</p>
  <h4>數字</h4>
  <ul class="plain">
   <li>美國 CDC：未滿 1 歲的傷害死亡，三分之二是窒息；1–4 歲傷害死亡第一名是溺水（2000–2006 年資料）。CDC 2026 年頁面：1–4 歲兒童死於溺水的人數，比任何其他死因都多。</li>
   <li>台灣：林口長庚分析 2005–2016 年 6 歲以下到院不明原因死亡 115 人，85% 發生在家裡室內，嬰兒猝死占 40%；團隊估計約 30% 的 6 歲以下死亡可以避免。</li>
   <li>衛福部：事故傷害是 1–14 歲死因第一位（2008 年資料）；居家事故以跌倒、割刺傷、燒燙傷、中毒、窒息為主。衛福部 113 年死因統計（2025/6/16 公布）全年齡事故傷害排第 7；分年齡的兒童排序在統計附件裡，本次沒讀到【資料不足，無法確認】。</li>
  </ul>
  <h4>依年齡：現在要先做好的事</h4>
  <div class="games"><div class="game"><div class="gt"><b>0–6 個月 （現在）</b></div><div><b>最危險：</b>睡眠窒息、車禍</div><div><b>怎麼防：</b>每覺仰睡、床上淨空、不跟大人同床；每趟坐車都用後向安全座椅。</div></div><div class="game"><div class="gt"><b>會翻身、會抓（約 4–6 個月起）</b></div><div><b>最危險：</b>從床或沙發摔落、把小東西放進嘴</div><div><b>怎麼防：</b>放在床、沙發、尿布台上時手不離開（App 整理）；國健署調查 3 歲幼兒意外就醫第一名是跌墜（8.0%）。小東西、鈕扣電池收好（見「嗆到怎麼救」）。</div></div><div class="game"><div class="gt"><b>會爬、會站（約 6–12 個月）</b></div><div><b>最危險：</b>墜樓、浴室溺水、燙傷、誤食藥物、窗簾拉繩</div><div><b>怎麼防：</b>見下面各項；<b>搬到林口新家時就一次裝好</b>，不要等會爬才做。</div></div><div class="game"><div class="gt"><b>1–4 歲</b></div><div><b>最危險：</b>溺水（第一名）、車禍、獨留車內</div><div><b>怎麼防：</b>有水的地方全程有大人專心看；6 歲以下不能單獨留在車內（見「外出、乘車與新家」）。</div></div></div>
  <h4>溺水（浴缸、水桶、馬桶）</h4>
  <ul class="plain">
   <li>嬰幼兒在約 2.5 公分深的水裡就可能溺死（加拿大卑詩省衛生局 HealthLinkBC）。</li>
   <li>洗澡時不能留寶寶自己在浴缸，去拿東西也不行；洗澡椅、浮具不能防溺水，不能代替大人看著。寶寶滑倒臉朝下時可能翻不回來。</li>
   <li>水桶用完馬上倒掉、收起來；馬桶蓋蓋好，3 歲以下特別危險（會頭朝下栽進去爬不出來）；沒有大人陪時不讓幼兒進浴室。</li>
   <li>去游泳池、海邊：指定一個大人專門盯著孩子，不滑手機（HealthLinkBC、美國 CDC）。</li>
  </ul>
  <h4>墜樓（新家在高樓層）</h4>
  <ul class="plain">
   <li>窗戶裝限位器，讓窗戶最多只開約 10 公分（4 英寸）；2 樓以上的窗戶裝防護欄，選大人能快速打開的款式，火災時才逃得出去（美國 Nationwide 兒童醫院）。</li>
   <li><b>紗窗擋不住小孩</b>。床、沙發、椅子不要靠窗擺，孩子會爬上去。</li>
   <li>從窗戶摔落造成的傷害與死亡，比其他摔落都嚴重（同上）。</li>
  </ul>
  <h4>窗簾繩、藥物、燙傷</h4>
  <ul class="plain">
   <li>窗簾拉繩收高或改無繩款；細繩、塑膠袋放在小孩拿不到的地方（長庚、國健署檢核表）。</li>
   <li>藥品、清潔劑放高處或上鎖（長庚）。</li>
   <li>開飲機、熱水瓶、電熱壺放小孩碰不到的地方；廚房煮菜時的燙傷是長庚十大疏忽之一（長庚、國健署檢核表）。</li>
   <li>國健署「幼童居家安全環境檢核表」可以照著逐項檢查新家。</li>
  </ul>
  <h4>鈕扣電池（吞下去 2 小時就可能燒穿食道）</h4>
  <ul class="plain">
   <li>多數嚴重案例沒人看到吞；吃東西或喝水就咳、作嘔，也要想到可能吞了電池（美國國家毒物中心）。</li>
   <li>懷疑吞了：<b>馬上去急診</b>，不要催吐。卡在食道的電池要立刻取出，嚴重灼傷可在 2 小時內發生。</li>
   <li><b>滿 1 歲以上</b>、12 小時內吞的、還能吞嚥：去醫院的路上每 10 分鐘給 10 mL（2 小匙）蜂蜜，最多 6 次。蜂蜜只能減慢傷害，不能代替就醫。</li>
   <li><b>未滿 1 歲不能給蜂蜜</b>（肉毒桿菌風險），直接送醫。</li>
   <li>家裡用鈕扣電池的東西（遙控器、電子秤、體溫計等）和換下來的舊電池，都收在小孩拿不到的地方。</li>
  </ul>

function playBracket(days){ return PLAY.find(p=>days>=p.from && days<=p.to) || PLAY[PLAY.length-1]; }
function playLabel(){ const a=ageDaysAt(now()); return playBracket(a).lab; }
function openPlay(){
  const a=ageDaysAt(now()); const p=playBracket(a); const i=PLAY.indexOf(p); const nx=PLAY[i+1];
  const pick = a % p.g.length;
  const card = (x,k) => `<div class="game${k===pick?" today":""}"><div class="gt">${k===pick?'<span class="gtag">今天先玩</span>':""}<b>${x[0]}</b></div><div>${x[1]}</div><div class="gfor">練：${x[2]}</div></div>`;
  const srcs=[...new Set(p.g.flatMap(x=>x[3]).concat(nx?nx.g.flatMap(x=>x[3]):[]))];
  $("sheet").innerHTML = `<h3 id="sheetTitle">遊戲・${p.lab}</h3>
   <p class="note">淩淵今天 ${a} 天（第 ${Math.floor(a/7)+1} 週）。這個階段練：${p.focus}。依日齡自動更新。</p>
   <div class="games">${p.g.map(card).join("")}</div>
   <ul class="plain note">
    <li>看他的反應：開心就繼續；煩躁、哭鬧就休息、抱抱他。</li>
    <li>趴著玩一定要大人在旁邊；睡著就移回床上仰睡。</li>
    <li>2 歲前不看螢幕，和家人視訊除外。</li>
   </ul>
   ${nx?`<details class="src"><summary>下個階段（${nx.lab}）預告</summary><ul>${nx.g.map(x=>`<li><b>${x[0]}</b>：${x[1]}</li>`).join("")}</ul></details>`:""}
   ${srcHTML(srcs)}
   <div class="acts"><button type="button" class="btn" data-close>關閉</button></div>`;
  $("sheet").hidden=false; $("scrim").hidden=false;
}

function applyOp(op){
  const A = DATA;
  switch(op.o){
    case "log+": if(A.logs.some(l=>l.id===op.l.id)) return false; A.logs.push(op.l); return true;
    case "log-": { const n=A.logs.length; A.logs=A.logs.filter(l=>l.id!==op.id); return A.logs.length!==n; }
    case "log=": { const i=A.logs.findIndex(l=>l.id===op.l.id); if(i<0 || JSON.stringify(A.logs[i])===JSON.stringify(op.l)) return false; A.logs[i]=op.l; return true; }
    case "logEnd": { const l=A.logs.find(x=>x.id===op.id); if(!l || l.end===op.end) return false; l.end=op.end; return true; }
    case "check": if(!!A.checks[op.id]===op.v) return false; if(op.v) A.checks[op.id]=true; else delete A.checks[op.id]; return true;
    case "mile": if(!!A.miles[op.id]===op.v) return false; if(op.v) A.miles[op.id]=true; else delete A.miles[op.id]; return true;
    case "grow": { const i=A.growth.findIndex(g=>g.d===op.g.d); if(i>=0 && JSON.stringify(A.growth[i])===JSON.stringify(op.g)) return false; if(i>=0) A.growth[i]=op.g; else A.growth.push(op.g); return true; }
    case "grow-": { const n=A.growth.length; A.growth=A.growth.filter(g=>g.d!==op.d); return A.growth.length!==n; }
    case "q+": if(A.qs.some(q=>q.id===op.q.id)) return false; A.qs.push(op.q); return true;
    case "q": { const q=A.qs.find(x=>x.id===op.id); if(!q || !!q.done===op.v) return false; q.done=op.v; return true; }
    case "qa": { const q=A.qs.find(x=>x.id===op.id); const v=String(op.a||"").slice(0,400); if(!q || (q.a||"")===v) return false; if(v) q.a=v; else delete q.a; return true; }
    case "q-": { const n=A.qs.length; A.qs=A.qs.filter(q=>q.id!==op.id); return A.qs.length!==n; }
    case "contacts": if(A.contacts===op.t) return false; A.contacts=op.t; return true;
    case "medinfo": if(JSON.stringify(A.medInfo||{})===JSON.stringify(op.v)) return false; A.medInfo=op.v; return true;
    case "day": { const i=A.days.findIndex(x=>x.d===op.x.d); if(i>=0 && JSON.stringify(A.days[i])===JSON.stringify(op.x)) return false; if(i>=0) A.days[i]=op.x; else A.days.push(op.x); A.days.sort((p,q)=>p.d<q.d?-1:1); return true; }
    case "day-": { const n=A.days.length; A.days=A.days.filter(x=>x.d!==op.d); return A.days.length!==n; }
    case "todo+": { if(!Array.isArray(A.items)) A.items=[]; if(A.items.some(x=>x.id===op.it.id)) return false; A.items.push(op.it); if(!ITEMS.some(x=>x.id===op.it.id)) ITEMS.push(Object.assign({src:[],d:""},op.it)); return true; }
    case "todo-": { if(!Array.isArray(A.items)) A.items=[]; const n=A.items.length; A.items=A.items.filter(x=>x.id!==op.id); const k=ITEMS.findIndex(x=>x.id===op.id && x.u); if(k>=0) ITEMS.splice(k,1); delete A.checks[op.id]; return A.items.length!==n || k>=0; }
  }
  return false;
}

  try{ const st=[...document.head.querySelectorAll("style")].find(s=>s.textContent.includes("safe-area-inset-top")); if(st) reset=st.textContent; }catch(e){}
  const css = $("css").textContent, shell = $("shell").innerHTML, main = $("main").textContent;
  const data = JSON.stringify(DATA).replace(/</g,"\\u003c");
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+reset+'</style></head><body>'
    + '<title>'+TITLE+'</title>\n' + FONT_LINKS + '\n<style id="css">' + css + '</style>\n<template id="shell">' + shell + '</template>\n<div id="root"></div>\n<script type="application/json" id="data">' + data + '<\/script>\n<script id="main">' + main + '<\/script>\n</body></html>';
}
async function doPublish(){
  if(!ART) return;
  DATA.updated = new Date().toISOString();
  ss.set("ly-view", JSON.stringify({tab:curTab, y:window.scrollY, day:viewDay, rsec, msec}));
  showSave("儲存中…");
  try{ await ART.publish(buildDoc()); retried=false; showSave("已儲存"); }
  catch(e){
    const c = e && e.code;
    if(c==="conflict"){ showSave("家人剛好也更新了，正在合併…"); return; }
    if(["not_writer","not_granted","not_declared","consent_required","capability_disabled","capability_removed"].includes(c)){ setMode("ro"); pending=[]; savePending(); showSave("這個帳號只能看，剛才的變更沒有存",6000); return; }
    if(c==="rate_limited"){ showSave("存得太頻繁，10 秒後再存"); saveTimer=setTimeout(doPublish,10000); return; }
    if(c==="too_large"){ showSave("紀錄太多存不下，請請 Claude 整理舊紀錄",8000); return; }
    if(!retried){ retried=true; showSave("網路不穩，重試中…"); saveTimer=setTimeout(doPublish, 2000+Math.random()*2000); return; }
    retried=false; showSave("沒存成功，變更先留在這個分頁；下次操作會一起存",6000);
  }
}

function monthsDone(d){ let m=(d.getFullYear()-BIRTH.getFullYear())*12+(d.getMonth()-BIRTH.getMonth()); if(d.getDate()<BIRTH.getDate()) m--; return Math.max(0,m); }
function addMonths(n){ return new Date(BIRTH.getFullYear(),BIRTH.getMonth()+n,BIRTH.getDate()); }
function ageText(){ const a=ageDaysAt(now()), w=Math.floor(a/7), dd=a%7, m=monthsDone(todayD()); if(m>=12){ const y=Math.floor(m/12), r=m%12; return `${y} 歲${r?` ${r} 個月`:""}・出生第 ${a} 天`; } const wk=`第 ${w+1} 週（${w} 週 ${dd} 天）`; return m<1?`${wk}・未滿 1 個月`:`${wk}・${m} 個月大`; }
function nextMarker(){
  const T=todayD();
  const marks=[[14,"滿 2 週：多數寶寶已回到出生體重"],[21,"滿 3 週：臍帶應已脫落"],[null,1,"滿 1 個月：B 肝第 2 劑、第 1 次兒童預防保健"],[null,2,"滿 2 個月：疫苗與心臟追蹤"],[null,3,"滿 3 個月：發燒規則放寬"],[null,4,"滿 4 個月：疫苗、問補鐵"],[null,6,"滿 6 個月：疫苗、副食品"],[null,9,"滿 9 個月"],[null,12,"滿 1 歲"],[null,15,"滿 15 個月：日本腦炎疫苗"],[null,18,"滿 18 個月：五合一第 4 劑、A 肝"],[null,24,"滿 2 歲"],[null,27,"滿 27 個月：日本腦炎、A 肝"],[null,36,"滿 3 歲"],[null,48,"滿 4 歲"],[null,60,"滿 5 歲"]];
  for(const mk of marks){ if(mk[0]===21 && DATA.checks["f:cord"]) continue; const date = mk[0]!==null ? new Date(BIRTH.getTime()+mk[0]*DAY) : addMonths(mk[1]); const left=Math.round((date-T)/DAY); if(left>0) return `下一個節點：<b class="mono">${fmt(iso(date))}</b> ${mk[mk.length-1]}（${left} 天後）`; }

/* ---------- log helpers ---------- */
const FEEDK = ["bf","bottle"];
const isVitD = l => l.k==="vitd" || (l.k==="med" && l.name==="維生素 D");
const logsOn = d => DATA.logs.filter(l=>l.t.slice(0,10)===d).sort((a,b)=>a.t<b.t?-1:1);
function describe(l){
  switch(l.k){
    case "bf": { const side={L:"左",R:"右",B:"兩邊"}[l.side]||""; const parts = (l.L||l.R) && l.side==="B" ? `（左 ${l.L||0}・右 ${l.R||0}）` : ""; return ["親餵", `${side} ${l.min||0} 分${parts}`]; }
    case "bottle": return ["瓶餵", `${l.src==="m"?"母乳":"配方"} ${l.ml} ml`];
    case "pump": return ["擠奶", `${l.ml} ml${l.store?"・"+({fridge:"冷藏",freezer:"冷凍",fed:"直接餵"}[l.store]||""):""}`];
    case "diaper": { const a=[]; if(l.wet) a.push("濕"); if(l.poop) a.push("便"+(l.color?`（大便卡 ${l.color} 號）`:"")+(l.pa?`（${({more:"量多",less:"量少"})[l.pa]||l.pa}）`:"")+(l.pq?`（${({ok:"正常",bad:"不正常",tbd:"待確認"})[l.pq]||l.pq}）`:"")); return ["尿布", a.join("＋")||"乾"]; }
    case "sleep": return ["睡眠", l.end ? `${hm(l.t)}–${hm(l.end)}，${durText(pdt(l.end)-pdt(l.t))}` : `${hm(l.t)} 開始，睡覺中`];
    case "temp": return ["體溫", `${l.c.toFixed(1)}°C（${l.m||""}）`];
    case "med": return ["用藥", (l.name||"")+(l.dose?" "+l.dose:"")];
    case "vitd": return ["維生素 D", "已給"];
    case "note": return ["狀況", [ (l.tags||[]).join("、"), l.text ].filter(Boolean).join("：")];
  }
  return [l.k,""];
}
const isAlert = l => (l.k==="diaper" && ((l.color && l.color<=6) || l.pq==="bad")) || (l.k==="temp" && l.c>=38);
function dayStats(d){
  const L = logsOn(d);
  const imp = DATA.days.find(x=>x.d===d);
  const LF = L.filter(l=>["bf","bottle","diaper"].includes(l.k));
  if(!LF.length && imp) return {vitd: L.some(isVitD) || null,imp:true, feeds:null, fm:imp.fm||0, bm:imp.bm||0, bfmin:imp.bf||0, wet:imp.wet, poop:imp.poop, sleep:null, pump:0, n:imp.n||"", isrc:imp.src||""};
  const feeds = L.filter(l=>FEEDK.includes(l.k)).map(l=>pdt(l.t).getTime()).sort((a,b)=>a-b);
  let sessions=0, lastT=-Infinity; feeds.forEach(t=>{ if(t-lastT>30*60000) sessions++; lastT=t; });
  const s = {imp:false, feeds:sessions, fm:0, bm:0, bfmin:0, wet:0, poop:0, sleep:0, vitd:false, pump:0};
  L.forEach(l=>{
    if(l.k==="bottle"){ if(l.src==="m") s.bm+=l.ml; else s.fm+=l.ml; }
    if(l.k==="bf") s.bfmin+=l.min||0;
    if(l.k==="diaper"){ if(l.wet) s.wet++; if(l.poop) s.poop++; }
    if(isVitD(l)) s.vitd=true;
    if(l.k==="med") s.med=(s.med||0)+1;
    if(l.k==="pump") s.pump+=l.ml;
    if(l.k==="sleep"){ const st=pdt(l.t), en=l.end?pdt(l.end):now(); s.sleep += Math.max(0,en-st); }
  });
  return s;
}
function statChips(s, live){
  const c=[];
  const chip=(v,lbl,cls)=>`<div class="stat ${cls||""}"><b>${v}</b><span>${lbl}</span></div>`;
  if(s.feeds!==null) c.push(chip(s.feeds,"餵奶（次）"));
  c.push(chip(s.fm+s.bm,"瓶餵 ml"));
  if(s.bfmin) c.push(chip(s.bfmin,"親餵 分"));
  c.push(chip(s.wet??"—","濕尿布", (!live && s.wet!=null && s.wet<6)?"low":""));
  c.push(chip(s.poop??"—","便便"));
  if(s.sleep!==null) c.push(chip((s.sleep/3600000).toFixed(1),"睡（時）"));
  if(s.vitd!==null) c.push(chip(s.vitd?"✓":"—","維生素 D", s.vitd?"ok":""));
  if(s.pump) c.push(chip(s.pump,"擠奶 ml"));
  if(s.med) c.push(chip(s.med,"用藥（次）"));
  return c.join("");
}

/* ---------- stage focus with checkboxes ---------- */
let focusShowDone = false;
const focusKey = it => it.key || ("f:"+it.id);
const focusDone = it => it.auto ? !!it.auto() : (it.ck ? !!DATA.checks[focusKey(it)] : false);
function renderFocus(st){
  const fl=$("focusList"); fl.innerHTML="";
  const done = st.items.filter(focusDone);
  st.items.forEach(it=>{
    const isDone = focusDone(it);
    if(isDone && !focusShowDone) return;
    const inner = `<div class="t">${it.t}</div><div>${it.d}</div>${srcHTML(it.s)}`;
    if(!it.ck){ fl.appendChild(el("div",{class:"fc"+(isDone?" done":"")}, inner)); return; }
    const c=el("div",{class:"fc ck"+(isDone?" done":"")});
    const cb=el("input",{type:"checkbox","aria-label":it.ck});
    cb.checked=isDone; cb.disabled = MODE!=="rw";
    cb.addEventListener("change",()=>{ if(!commit({o:"check",id:focusKey(it),v:cb.checked})) cb.checked=focusDone(it); });
    const bd=el("div",{class:"bd"}, inner + `<span class="note">做完就勾「${it.ck}」，這張會收起來。</span>`);
    c.append(cb, bd); fl.appendChild(c);
  });
  if(!fl.children.length) fl.appendChild(el("p",{class:"note"},"這個階段的項目都完成了。"));
  const b=$("focusDoneBtn");
  b.hidden = !done.length;
  b.textContent = focusShowDone ? "收起已完成的項目" : `已完成 ${done.length} 項（${done.map(x=>x.t).join("、")}）・顯示`;
  b.onclick = ()=>{ focusShowDone=!focusShowDone; renderToday(); };
}
/* ---------- automatic daily check (intake, diapers, weight) ----------
   Reference numbers: wet diapers 6+/day from day 5–7, back to birth weight by 10–14 days, AAP 2.5 oz/lb/day (165 ml/kg) capped at 960 ml,
   weight gain ~30 g/day in the first 3 months (SickKids). Under 20 g/day after regaining birth weight is flagged for a doctor's look. */
function healthFlags(){
  const out=[]; const add=(lv,t,d)=>out.push({lv,t,d});
  const days=intakeDays(10).filter(x=>x.has && !x.live);
  const last=days[days.length-1];
  if(last){
    const lbl=`${fmt(last.d)}（第 ${last.age} 天）`;
    const low = x => x.ref && x.tot>0 && !x.bf && x.tot < x.ref*0.8;
    if(low(last) && last.age<=183){
      const prev=days[days.length-2];
      if(prev && low(prev)) add("warn", `連續 2 天瓶餵量偏低（${fmt(prev.d)} ${prev.tot} ml、${fmt(last.d)} ${last.tot} ml）`, `參考量約 ${Math.round(last.ref/10)*10} ml，兩天都不到 8 成。加上濕尿布少或體重沒增加，就打給小兒科。`);
      else add("soft", `${lbl}瓶餵 ${last.tot} ml，低於參考量 8 成`, `參考量約 ${Math.round(last.ref/10)*10} ml。只有一天先觀察；明天也偏低就注意尿布和體重。`);
    }
    if(last.tot>REF_MAX && last.age<=183) add("soft", `${lbl}瓶餵 ${last.tot} ml，超過一天約 960 ml 的上限`, "留意是不是常溢奶、吐奶；寶寶推開、轉頭就是飽了，不要硬餵完。");
    if(last.age>=5 && last.wet!=null && last.wet<6) add(last.wet<4?"warn":"soft", `${lbl}濕尿布 ${last.wet} 片（少於 6 片）`, "可能奶量不夠。今天也少於 6 片，或尿色深黃、嘴唇乾、很愛睡，就找小兒科。");
    if(last.age>=4 && last.age<=42 && last.poop===0) add("soft", `${lbl}沒有大便`, "一天沒大便先觀察；肚子脹硬、吐奶、哭鬧不安，或連續兩天沒大便，就問小兒科。");
    if(last.poop!=null && last.poop>=12) add("soft", `${lbl}大便 ${last.poop} 次，比平常多很多`, "如果變得很水、有黏液或血絲、尿布變少，可能是腹瀉，要找小兒科。");
  }
  const ws=sortedGrowth().filter(r=>r.w); const lw=ws[ws.length-1]; const aNow=ageDaysAt(now());
  if(lw){
    const ad=dayOf(lw);
    if((BW-lw.w)/BW>=0.10) add("warn", `體重 ${lw.w} g，比出生少 ${Math.round((BW-lw.w)/BW*100)}%`, "掉超過 10% 要請醫師評估餵食。");
    else if(aNow>=15 && !ws.some(r=>r.w>=BW)) add("soft", `滿 2 週還沒回到出生體重（最新 ${lw.w} g）`, "多數寶寶 10–14 天回到出生體重，請小兒科看一下。");
    const prev=ws.slice().reverse().find(r=>ad-dayOf(r)>=5 && dayOf(r)>=10);
    if(prev && ws.some(r=>r.w>=BW) && aNow<=90){ const g=(lw.w-prev.w)/(ad-dayOf(prev)); if(g<20) add(g<0?"warn":"soft", `近 ${ad-dayOf(prev)} 天體重每天只增加 ${Math.round(g)} g`, "3 個月內平均每天約 30 g。連續偏低請問小兒科。"); }
    if(aNow-ad >= (aNow<90?10:aNow<365?35:100)) add("soft", `已經 ${aNow-ad} 天沒量體重`, "在家用嬰兒秤或下次看診時量，記在「紀錄」頁。");
  }
  return {flags:out, last};
}
function renderDailyCheck(){
  const box=$("dailyCheck"); if(!box) return;
  const {flags,last}=healthFlags();
  if(!last){ box.innerHTML = `<div class="okline">還沒有完整一天的紀錄可以檢查。</div>`; return; }
  if(!flags.length){
    const ws=sortedGrowth().filter(r=>r.w); const lw=ws[ws.length-1];
    box.innerHTML = `<div class="okline"><b>${fmt(last.d)} 自動檢查：都正常</b><br><span class="note">瓶餵 ${last.tot} ml${last.ref?`（參考 ${Math.round(last.ref/10)*10}）`:""}・濕尿布 ${last.wet??"—"}・便便 ${last.poop??"—"}${lw?`・體重 ${lw.w} g（${fmt(lw.d)}）`:""}</span></div>`;

function startSleepAt(t){

  const rs=runningSleep(); if(rs) return err(`已經有一段「睡覺中」（${hm(rs.t)} 開始），先按「醒了」或到時間軸修改`);
  const ov=DATA.logs.find(l=>l.k==="sleep" && l.end && pdt(l.end)>pdt(t));
  if(ov) return err(`跟 ${hm(ov.t)}–${hm(ov.end)} 那段睡眠重疊，請選晚一點的時間`);
  closeSheet(); commit({o:"log+", l:{id:uid(), t:t, k:"sleep", end:null}});

function saveSheet(kind){
  const m=$("sheetMsg"); const err=t=>{ m.textContent=t; };
  if(kind==="todo"){
    const t=($("s-tt").value||"").trim(), due=$("s-due").value, [cat,sub]=($("s-cat").value||"med.follow").split("."), note=($("s-note").value||"").trim();
    if(!t) return err("請寫要做什麼");
    if(!/^\d{4}-\d{2}-\d{2}$/.test(due||"")) return err("請選日期");
    const it={id:"u"+uid(), u:1, cat, sub, due, kind:"家人新增", t, d: note?`<p>${esc(note)}</p>`:"", src:[], at:isoT(now())};
    closeSheet();
    if(commit({o:"todo+", it})) revealItem(it.id);

  }
  if(kind==="weight"){
    const raw=+$("s-kg").value, date=$("s-wd").value, note=($("s-wn").value||"").trim().slice(0,60);
    if(!raw) return err("請填體重");
    const W = raw<30 ? Math.round(raw*1000) : Math.round(raw);
    if(W<1500||W>15000) return err("請填 1.5–15 公斤（或 1500–15000 公克）");
    if(!/^\d{4}-\d{2}-\d{2}$/.test(date||"") || pd(date)<BIRTH || pd(date)>todayD()) return err("日期要在出生日到今天之間");
    const old=DATA.growth.find(r=>r.d===date)||{};

  if(kind==="bf"){ const min=+$("s-min").value; if(!min||min<1||min>120) return err("請填 1–120 分鐘"); l.side=getOpt("side")||"L"; l.min=min; }

  if(kind==="pump"){ const ml=+$("s-ml").value; if(!ml||ml<1||ml>500) return err("請填 ml"); l.ml=ml; l.store=getOpt("store"); }

/* ---------- growth ---------- */
function lmsAt(m, days){ const wk=days/7; let tab,x; if(wk<=13){ tab=LMS[m+"W"]; x=wk; } else { tab=LMS[m+"M"]; x=days/30.4375; } const i=Math.min(Math.floor(x),tab.length-2), f=Math.min(1,Math.max(0,x-i)); const a=tab[i], b=tab[i+1]; return [a[0]+(b[0]-a[0])*f, a[1]+(b[1]-a[1])*f, a[2]+(b[2]-a[2])*f]; }
function zOf(m, days, v){ const [L,M,Sg]=lmsAt(m,days); return Math.abs(L)<1e-6 ? Math.log(v/M)/Sg : (Math.pow(v/M,L)-1)/(L*Sg); }

function cdf(z){ const t=1/(1+0.3275911*Math.abs(z)/Math.SQRT2); const y=1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-0.284496736)*t+0.254829592)*t*Math.exp(-z*z/2); return z>=0?(1+y)/2:(1-y)/2; }

const MET = {w:{name:"體重",unit:"kg",get:r=>r.w?r.w/1000:null,dp:2},l:{name:"身長",unit:"cm",get:r=>r.l||null,dp:1},h:{name:"頭圍",unit:"cm",get:r=>r.h||null,dp:1}};
const dayOf = r => Math.round((pd(r.d)-BIRTH)/DAY);
const sortedGrowth = () => DATA.growth.slice().sort((a,b)=>a.d<b.d?-1:1);
let metric="w";
function weightNote(){
  const ws=sortedGrowth().filter(r=>r.w); const lw=ws[ws.length-1];
  if(!lw) return "還沒有體重紀錄。";
  const diff=lw.w-BW, pct=(diff/BW*100).toFixed(1);
  let t = diff>=0 ? `已回到出生體重（+${diff} g）。` : `比出生體重少 ${-diff} g（${pct}%）。`;
  if(diff<0 && dayOf(lw)<=14) t+=" 出生後前幾天先掉、約 10–14 天回升是常見過程。";
  const prev=ws.slice().reverse().find(r=>dayOf(lw)-dayOf(r)>=5 && (dayOf(r)>=10 || r.w>=BW));
  if(prev){ const dd=dayOf(lw)-dayOf(prev); t+=` 近 ${dd} 天 ${lw.w-prev.w>=0?"+":""}${lw.w-prev.w} g（每天約 ${Math.round((lw.w-prev.w)/dd)} g）。`; }
  const since=ageDaysAt(now())-dayOf(lw); if(since>=7) t+=` 上次量體重是 ${since} 天前。`;
  return t;
}
/* ---------- 生長：按天／週／月切換＋總結（v66） ----------
   growGP：d 按天（每次量測，最近 4 週）、w 按週（每週最後一次量測）、m 按月（每個月齡最後一次量測）。
   總結數字全部由 WHO LMS 算：「照原本百分位線走」＝用起點的 z 值，算同樣天數後該 z 對應的數值差。 */
let growGP = (v=>["d","w","m"].includes(v)?v:"d")(ls.get("ly-grow-gp"));
const pctNum = z => cdf(z)*100;
const pctS = p => p<10 ? p.toFixed(1) : String(Math.round(p));
const mdS = d => fmt(iso(d));
const sgn = (x, dp) => (x>=0?"+":"−")+Math.abs(x).toFixed(dp);
function gDiff(metric, dv){ return metric==="w" ? `${sgn(dv*1000,0)} g` : `${sgn(dv,1)} cm`; }
function gVal(metric, r){ return metric==="w" ? `${r.w} g` : `${MET[metric].get(r).toFixed(1)} cm`; }
function gPer(gp, r){ return gp==="w" ? Math.floor(dayOf(r)/7) : monthsDone(pd(r.d)); }
function gRange(gp, k){
  if(gp==="w"){ const s=new Date(BIRTH); s.setDate(s.getDate()+7*k); const e=new Date(s); e.setDate(e.getDate()+6); return [s,e]; }
  const s=addMonths(k), e=addMonths(k+1); e.setDate(e.getDate()-1); return [s,e];
}
const gName = (gp,k) => gp==="w" ? `第 ${k+1} 週` : `第 ${k+1} 個月`;
function growAll(metric){ return sortedGrowth().filter(r=>MET[metric].get(r)!=null); }
function growPoints(metric, gp){
  const all=growAll(metric); if(gp==="d") return all;
  const by=new Map(); all.forEach(r=>by.set(gPer(gp,r), r));
  const out=[]; if(all.length && dayOf(all[0])===0) out.push(all[0]);
  [...by.keys()].sort((a,b)=>a-b).forEach(k=>{ const r=by.get(k); if(!out.includes(r)) out.push(r); });
  return out;
}
function growWin(gp, pts){
  const a=ageDaysAt(now()), last=pts.length?dayOf(pts[pts.length-1]):0, end=Math.max(a,last);
  if(gp==="d") return end>42 ? [end-28, end+3] : [0, Math.max(14, end+3)];
  if(gp==="w") return [0, Math.min(1827, Math.max(56, Math.ceil((end+14)/7)*7))];
  return [0, Math.min(1827, Math.max(183, Math.ceil(end/30.4375+2)*30.4375))];
}
/* 一個指標的短總結 */
function growStat(metric){
  const m=MET[metric], g=growAll(metric);
  if(!g.length) return {n:0, short:"還沒量", line:`還沒有${m.name}紀錄；健檢後按「新增量測」把兒童健康手冊上的數字記下來。`};
  const last=g[g.length-1], dL=dayOf(last), v=m.get(last), z=zOf(metric,dL,v), p=pctNum(z), val=gVal(metric,last);
  const base={n:g.length, last, z, p, val};
  if(g.length===1) return {...base, short:`只有 ${fmt(last.d)} 1 筆・第 ${pctS(p)} 百分位`, line:`${fmt(last.d)} 量的，第 ${pctS(p)} 百分位。只有 1 筆，還看不出長多快；再量一次就會算。`};
  let ref = metric==="w" ? g.slice().reverse().find(r=>dL-dayOf(r)>=7) : null;
  if(!ref) ref=g[g.length-2];
  const dR=dayOf(ref), dd=dL-dR, dv=v-m.get(ref), zR=zOf(metric,dR,m.get(ref)), pR=pctNum(zR);
  const exp=valAt(metric,dL,zR)-valAt(metric,dR,zR), dz=z-zR;
  const tr = Math.abs(dz)<0.1 ? "大致持平" : dz>0 ? "往上" : "往下";
  const trTxt = `百分位${tr}（第 ${pctS(pR)} → ${pctS(p)}）`;
  let line, short;
  if(metric==="w"){
    const perDay=Math.round(dv*1000/dd), expDay=Math.round(exp*1000/dd);
    short=`第 ${pctS(p)} 百分位・近 ${dd} 天每天 ${sgn(perDay,0)} g`;
    line=`第 ${pctS(p)} 百分位。近 ${dd} 天 ${gDiff(metric,dv)}（每天 ${sgn(perDay,0)} g）；照 ${fmt(ref.d)} 那條百分位線走約每天 ${sgn(expDay,0)} g，${trTxt}。`;
    if(last.w<BW) line+=` 目前比出生體重少 ${BW-last.w} g。`;
    else { const lo=g.reduce((a,r)=>r.w<a.w?r:a,g[0]); const back=g.find(r=>r.d>lo.d && r.w>=BW); if(back && dayOf(back)<=60) line+=` 出生第 ${dayOf(back)} 天回到出生體重。`; }
  } else {
    short=`第 ${pctS(p)} 百分位・${tr}`;
    line=`第 ${pctS(p)} 百分位。比 ${fmt(ref.d)} ${gDiff(metric,dv)}（${dd} 天）；照原本百分位線走約 ${gDiff(metric,exp)}，${trTxt}。`;
  }
  return {...base, short, line, dz, dd, ref};
}
/* 總結（v69）：跟喝奶頁一樣的判讀框——自動檢查有體重提醒就黃／紅「注意」，沒有就綠「正常」；下面體重、身長、頭圍各一行，點一行切到那個指標 */
function renderGrowSum(){
  const box=$("growSum"); if(!box) return;
  const S={w:growStat("w"), l:growStat("l"), h:growStat("h")};
  const W=S.w; let head="";
  if(W.n>=2){
    const ws=growAll("w"), dL=dayOf(ws[ws.length-1]), rec=ws.filter(r=>dL-dayOf(r)<=14);
    const ps=rec.map(r=>pctNum(zOf("w",dayOf(r),r.w/1000))), lo=Math.min(...ps), hi=Math.max(...ps);
    head=`體重 ${W.val}，${W.dz<-0.1?"比原本的百分位線長得慢一點":W.dz>0.1?"比原本的百分位線長得快一點":"大致沿著同一條百分位線"}${rec.length>=3?`（近 2 週在第 ${pctS(lo)}–${pctS(hi)} 百分位）`:""}，近 ${W.dd} 天每天 ${sgn(Math.round((W.last.w-W.ref.w)/W.dd),0)} g。`;
  } else head = W.n ? "體重只有 1 筆，再量一次就看得出長多快。" : "還沒有體重紀錄。";
  const miss=["l","h"].filter(k=>S[k].n<2).map(k=>S[k].n?`${MET[k].name}只有 1 筆`:`${MET[k].name}還沒量`);
  if(miss.length) head+=`${miss.join("、")}，健檢量完記下來才看得出趨勢。`;
  const bad=healthFlags().flags.filter(f=>/體重/.test(f.t)), warn=bad.some(f=>f.lv==="warn");
  const rows=`<div class="gsl">${["w","l","h"].map(k=>`<button type="button" data-gm="${k}" aria-pressed="${k===metric}"><b>${MET[k].name}</b>${S[k].n?S[k].val+"・":""}${S[k].line}</button>`).join("")}</div>`;
  box.innerHTML = bad.length
    ? `<div class="flagx ${warn?"warn":""}"><b>${warn?"異常":"注意"}：${bad.map(f=>esc(f.t)).join("；")}</b><span>${bad[0].d}</span><span>${head}</span>${rows}</div>`
    : `<div class="okline"><b>正常</b>：${head}${rows}</div>`;

/* 目前指標＋時間單位的一句話 */
function growPSum(g){
  const m=MET[metric], k=metric==="w"?1000:1;
  if(g.length<2) return g.length ? `${m.name}只有 1 筆，切換天／週／月要等量到第 2 次。` : `還沒有${m.name}紀錄。`;
  if(growGP==="d"){
    if(metric!=="w") return `按天：${m.name}通常幾週到一個月量一次，看「按月」比較清楚。`;
    const ds=[]; for(let i=1;i<g.length;i++){ const dd=dayOf(g[i])-dayOf(g[i-1]); if(dd===1) ds.push(g[i].w-g[i-1].w); }
    const f=g[0], l=g[g.length-1], per=Math.round((l.w-f.w)/Math.max(1,dayOf(l)-dayOf(f)));
    return `按天：${fmt(f.d)}–${fmt(l.d)} 共 ${g.length} 次，${ds.length?`單日變化 ${sgn(Math.min(...ds),0)} 到 ${sgn(Math.max(...ds),0)} g，`:""}平均每天 ${sgn(per,0)} g。單次秤重會受剛喝奶、尿布、衣服影響（100 ml 奶約 100 g），看長期走勢切「按週」。`;
  }
  const rows=[]; for(let i=1;i<g.length;i++){ const r=g[i], pr=g[i-1], kk=gPer(growGP,r), [s,e]=gRange(growGP,kk), part=pd(r.d)<e && iso(e)>=iso(todayD()); rows.push({kk,s,e,part,dv:m.get(r)-m.get(pr),dd:dayOf(r)-dayOf(pr),r}); }
  const fmtRow=x=>`${gName(growGP,x.kk)}（${mdS(x.s)}–${mdS(x.e)}）${x.part?`到 ${fmt(x.r.d)} 為止 `:""}${gDiff(metric,x.dv)}${metric==="w"&&x.dd>0?`（每天 ${sgn(Math.round(x.dv*k/x.dd),0)} g）`:""}`;
  const done=rows.filter(x=>!x.part), cur=rows.find(x=>x.part);

  if(cur) parts.push(fmtRow(cur)+(growGP==="m"?`；滿 ${cur.kk+1} 個月是 ${mdS(addMonths(cur.kk+1))}`:""));

function renderGrowTable(g){

  if(!g.length){ t.innerHTML=""; return; }
  const rows=[]; for(let i=g.length-1;i>=0 && rows.length<(growGP==="d"?14:60);i--){
    const r=g[i], pr=g[i-1], d=dayOf(r), p=pctNum(zOf(metric,d,m.get(r)));
    let lab;
    if(growGP==="d") lab=`${fmt(r.d)}<small>第 ${d} 天</small>`;

/* ---------- intake trend (喝奶量) ----------
   Reference = AAP average of 2.5 oz per lb per day (= about 165 ml per kg), capped at 960 ml/day.
   It is drawn from day 7: in the first week AAP caps a feed at 30–60 ml, so intake is still climbing. */
const REF_ML_PER_KG = 165, REF_MAX = 960, REF_FROM_AGE = 7;
let INTAKE_DAYS = 14;
function weightOn(d){
  const ws = sortedGrowth().filter(r=>r.w).map(r=>({t:pd(r.d).getTime(), w:r.w}));
  if(!ws.length) return BW;
  const t = pd(d).getTime();
  if(t<=ws[0].t) return ws[0].w;
  for(let i=1;i<ws.length;i++){ if(t<=ws[i].t){ const a=ws[i-1], b=ws[i]; return a.w + (b.w-a.w)*(t-a.t)/(b.t-a.t); } }
  return ws[ws.length-1].w;
}
function refOn(d){ const age=ageDaysAt(pd(d)); if(age<REF_FROM_AGE) return null; return Math.min(REF_MAX, REF_ML_PER_KG*weightOn(d)/1000); }
function intakeDays(n){
  const T=todayD(), out=[];
  for(let i=n-1;i>=0;i--){
    const dt=new Date(T); dt.setDate(dt.getDate()-i); if(dt<BIRTH) continue;
    const k=iso(dt), s=dayStats(k), has=s.imp || logsOn(k).length>0, kg=weightOn(k)/1000, tot=s.fm+s.bm;
    out.push({d:k, age:ageDaysAt(dt), live:i===0, has, imp:s.imp, fm:s.fm, bm:s.bm, tot, bf:s.bfmin, feeds:s.feeds, wet:s.wet, poop:s.poop, kg, mlkg: has&&tot>0 ? tot/kg : null, ref:refOn(k), n:s.n||"", src:s.isrc||""});
  }
  return out;
}
const avg = a => a.length ? a.reduce((p,q)=>p+q,0)/a.length : null;
function intakeTrend(days){
  const done = days.filter(x=>!x.live && x.has && x.tot>0);
  const last3 = done.slice(-3), prev3 = done.slice(-6,-3);
  const a3 = avg(last3.map(x=>x.tot)), p3 = avg(prev3.map(x=>x.tot)), k3 = avg(last3.map(x=>x.mlkg));
  return {done, last3, a3, p3, k3, chg: (a3!=null && p3) ? (a3-p3)/p3 : null};
}
function renderTodayIntake(){

    ? `今天瓶餵 <b>${s.fm+s.bm}</b> ml，全天參考約 <b>${Math.round(ref/10)*10}</b> ml（依 ${w} g × 每公斤 165 ml）・看喝奶趨勢 ›`
    : `今天瓶餵 <b>${s.fm+s.bm}</b> ml。出生第一週奶量本來就逐天增加，第 7 天起顯示全天參考量・看喝奶趨勢 ›`;

let intakeSel = null;
function renderIntake(){
  const svg=$("intakeChart"); if(!svg) return;
  const days=intakeDays(INTAKE_DAYS), tr=intakeTrend(days), today=days[days.length-1];
  const chip=(v,lbl,cls)=>`<div class="stat ${cls||""}"><b>${v}</b><span>${lbl}</span></div>`;
  const tRef = today && today.ref ? Math.round(today.ref/10)*10 : null;
  $("intakeStats").innerHTML =
    chip(today?today.tot:0, `今天到現在 ml${today&&today.feeds!=null?`（${today.feeds} 次）`:""}`) +
    chip(tRef!=null?tRef:"—", "全天參考 ml") +
    chip(tr.k3!=null?Math.round(tr.k3):"—", "近 3 天 每公斤 ml") +
    chip(tr.chg!=null?`${tr.chg>=0?"+":""}${Math.round(tr.chg*100)}%`:"—", "近 3 天 vs 前 3 天");

  const bw=(W-pl-pr)/Math.max(n,1), barW=Math.min(16, bw*0.62);
  const X=i=>pl+bw*i+bw/2, Y=v=>pt+(1-v/ymax)*(H-pt-pb);

  const every = Math.max(1, Math.ceil(n/8));

      if(x.bm>0 && x.fm>0){ s+=`<rect x="${x0}" y="${yF.toFixed(1)}" width="${barW.toFixed(1)}" height="${(Y(0)-yF).toFixed(1)}" fill="var(--feed-f)"${op}/>`; s+=top(yT, yF-gap, "var(--feed-m)"); }
      else if(x.fm>0) s+=top(yT, Y(0), "var(--feed-f)");
      else s+=top(yT, Y(0), "var(--feed-m)");
    } else if(x.has){ s+=`<text x="${cx.toFixed(1)}" y="${(Y(0)-4).toFixed(1)}" text-anchor="middle">0</text>`; }
    if(i%every===(n-1)%every) s+=`<text x="${cx.toFixed(1)}" y="${H-14}" text-anchor="middle">${x.d.slice(5).replace("-","/").replace(/^0/,"")}</text>`;
    if(x.live) s+=`<text x="${cx.toFixed(1)}" y="${H-3}" text-anchor="middle">今天</text>`;
  });
  /* reference line: one dashed segment per run of consecutive days that have a reference */
  let path="", prev=false;
  days.forEach((x,i)=>{ if(x.ref){ path+=`${prev?"L":"M"}${(X(i)-bw/2+1).toFixed(1)},${Y(x.ref).toFixed(1)}L${(X(i)+bw/2-1).toFixed(1)},${Y(x.ref).toFixed(1)}`; prev=true; } else prev=false; });
  if(path) s+=`<path d="${path}" fill="none" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="4 3"/>`;
  /* selective direct labels: last complete day with data, and today */
  const lastDone = tr.done[tr.done.length-1];
  days.forEach((x,i)=>{ if(x.tot>0 && (x===lastDone || x.live)){ let ly=Y(x.tot)-5; if(x.ref && Math.abs(Y(x.ref)-ly)<10) ly=Math.min(Y(x.ref),Y(x.tot))-7; s+=`<text x="${X(i).toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="middle" style="fill:var(--ink)">${+x.tot.toFixed(1)}</text>`; } });
  days.forEach((x,i)=>{ s+=`<rect class="hit" data-i="${i}" x="${(pl+bw*i).toFixed(1)}" y="${pt}" width="${bw.toFixed(1)}" height="${H-pt-pb+18}"/>`; });
  svg.innerHTML=s;

  const showTip=i=>{
    const x=days[i]; if(!x){ tip.innerHTML=""; return; }
    const L=[`<div class="full"><b>${x.d.slice(5).replace("-","/")}</b>　出生第 ${x.age} 天${x.live?"（今天，還沒結束）":""}${i===defIdx&&intakeSel==null?'　<span class="note">點其他長條看別天</span>':""}</div>`];

  pee:{h:"尿尿（濕尿布）", sub:"每天換下的濕尿布片數。虛線是至少 6 片：出生第 5 天起少於 6 片會提醒。"},
  poop:{h:"大便次數", sub:"每天大便次數。虛線是 12 次：達到會提醒留意腹瀉。"},

function paintIm(){

function poopLook(n){ const m=(n||"").match(/性狀「([^」]+)」/); return m?m[1]:""; }
function renderDiaper(days, defIdx){
  paintIm();
  const svg=$("diaperChart"); if(!svg || IM==="feed") return;
  const k = IM==="pee" ? "wet" : "poop", col = IM==="pee" ? "var(--feed-f)" : "var(--poo)", ref = IM==="pee" ? WET_MIN : POOP_HI;
  const unit = IM==="pee" ? "片" : "次", name = IM==="pee" ? "濕尿布" : "大便";
  const chip=(v,lbl,cls)=>`<div class="stat ${cls||""}"><b>${v}</b><span>${lbl}</span></div>`;
  const today=days[days.length-1];
  const done=days.filter(x=>!x.live && x.has && x[k]!=null), last=done[done.length-1], l3=done.slice(-3), a3=avg(l3.map(x=>x[k]));
  const bad = v => v!=null && (IM==="pee" ? v<WET_MIN : v>=POOP_HI);
  $("diaperStats").innerHTML =
    chip(today&&today[k]!=null?today[k]:"—", `今天到現在${name}`) +
    chip(last?last[k]:"—", last?`${fmt(last.d)} 整天`:"最近整天", bad(last&&last[k])?"low":"") +
    chip(a3!=null?a3.toFixed(1):"—", `近 3 天平均`, bad(a3)?"low":"") +
    chip(IM==="pee"?`≥ ${WET_MIN}`:`< ${POOP_HI}`, IM==="pee"?"建議（片／天）":"提醒線（次／天）");
  const W=360,H=200,pl=30,pr=14,pt=16,pb=30,n=days.length;
  const maxV=Math.max(ref+3, ...days.map(x=>x[k]||0));
  const ystep=maxV>30?10:5, ymax=Math.ceil(maxV*1.1/ystep)*ystep;
  const bw=(W-pl-pr)/Math.max(n,1), barW=Math.min(16,bw*0.62);
  const X=i=>pl+bw*i+bw/2, Y=v=>pt+(1-v/ymax)*(H-pt-pb);
  let s="";
  for(let v=0; v<=ymax+1e-9; v+=ystep) s+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="var(--line)" stroke-width="${v===0?1:0.6}"/><text x="${pl-5}" y="${(Y(v)+3).toFixed(1)}" text-anchor="end">${v}</text>`;
  if(defIdx>=0 && days[defIdx]) s+=`<rect class="sel" x="${(pl+bw*defIdx).toFixed(1)}" y="${pt}" width="${bw.toFixed(1)}" height="${H-pt-pb}" rx="4"/>`;
  const every=Math.max(1,Math.ceil(n/8));
  days.forEach((x,i)=>{
    const cx=X(i), v=x[k], op=x.live?' opacity="0.5"':'';
    if(v>0){ const x0=cx-barW/2, y0=Y(v), y1=Y(0), r=Math.min(4,(y1-y0)/2,barW/2);
      s+=`<path d="M${x0.toFixed(1)},${y1.toFixed(1)}V${(y0+r).toFixed(1)}Q${x0.toFixed(1)},${y0.toFixed(1)} ${(x0+r).toFixed(1)},${y0.toFixed(1)}H${(x0+barW-r).toFixed(1)}Q${(x0+barW).toFixed(1)},${y0.toFixed(1)} ${(x0+barW).toFixed(1)},${(y0+r).toFixed(1)}V${y1.toFixed(1)}Z" fill="${col}"${op}/>`; }
    else if(x.has && v===0) s+=`<text x="${cx.toFixed(1)}" y="${(Y(0)-4).toFixed(1)}" text-anchor="middle">0</text>`;
    if(i%every===(n-1)%every) s+=`<text x="${cx.toFixed(1)}" y="${H-14}" text-anchor="middle">${x.d.slice(5).replace("-","/").replace(/^0/,"")}</text>`;
    if(x.live) s+=`<text x="${cx.toFixed(1)}" y="${H-3}" text-anchor="middle">今天</text>`;
  });
  s+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(ref).toFixed(1)}" y2="${Y(ref).toFixed(1)}" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="4 3"/>`;
  if(last){ const i=days.indexOf(last); let ly=Y(last[k])-5; if(Math.abs(Y(ref)-ly)<10) ly=Math.min(Y(ref),Y(last[k]))-7; s+=`<text x="${X(i).toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="middle" style="fill:var(--ink)">${last[k]}</text>`; }
  days.forEach((x,i)=>{ s+=`<rect class="hit" data-i="${i}" x="${(pl+bw*i).toFixed(1)}" y="${pt}" width="${bw.toFixed(1)}" height="${H-pt-pb+18}"/>`; });
  svg.innerHTML=s;
  svg.setAttribute("aria-label", `最近 ${n} 天每日${name}${IM==="pee"?"片數":"次數"}長條圖`);
  $("diaperLegend").innerHTML = `<span><i style="background:${col}"></i>${name}（${unit}）</span><span><i class="dash"></i>${IM==="pee"?`建議至少 ${WET_MIN} 片`:`提醒線 ${POOP_HI} 次`}</span>`;
  const x=days[defIdx], tip=$("diaperTip");
  if(!x){ tip.innerHTML=""; }
  else {
    const L=[`<div class="full"><b>${x.d.slice(5).replace("-","/")}</b>　出生第 ${x.age} 天${x.live?"（今天，還沒結束）":""}${intakeSel==null?'　<span class="note">點其他長條看別天</span>':""}</div>`];
    if(!x.has || (x.wet==null && x.poop==null)) L.push(`<div class="full note">這天沒有尿布紀錄</div>`);
    else {
      L.push(`<div><span class="sw" style="background:var(--feed-f)"></span>濕尿布 <b>${x.wet??"—"}</b> 片</div>`);
      L.push(`<div><span class="sw" style="background:var(--poo)"></span>大便 <b>${x.poop??"—"}</b> 次</div>`);
      const look=poopLook(x.n); if(look) L.push(`<div class="full">大便性狀：${esc(look)}</div>`);
      const w=[];
      if(!x.live && x.age>=5 && x.wet!=null && x.wet<WET_MIN) w.push(`濕尿布少於 ${WET_MIN} 片${x.wet<4?"（少於 4 片，偏嚴重）":""}：可能奶量不夠，尿色深黃、嘴唇乾、很愛睡就找小兒科。`);
      if(!x.live && x.age>=4 && x.age<=42 && x.poop===0) w.push("這天沒有大便：先觀察；肚子脹硬、吐奶、哭鬧不安，或連續兩天沒大便，就問小兒科。");
      if(x.poop!=null && x.poop>=POOP_HI) w.push(`大便 ${POOP_HI} 次以上：變得很水、有黏液或血絲、尿布變少，可能是腹瀉，要找小兒科。`);
      w.forEach(t=>L.push(`<div class="full" style="color:var(--amber)">${t}</div>`));
      if(x.imp) L.push(`<div class="full note">來源：${esc(x.src||"寶寶狀況記錄表（試算表）")}</div>`);
    }
    tip.innerHTML=L.join("");
  }
  svg.querySelectorAll(".hit").forEach(r=>r.addEventListener("click",()=>{ intakeSel=+r.dataset.i; renderIntake(); }));
  $("diaperNote").innerHTML = "點長條看當天細節；切到喝奶也會停在同一天。今天的長條是半透明（還沒結束）。提醒規則和「今天」頁的自動檢查相同。";
}

/* ---------- 睡眠與清醒（v46）：近 14 天每天的睡覺／醒著時間條 ----------
   Reference hours per 24 h incl. naps (CDC, citing NSF for 0–3 months and AASM for 4 months–5 years). */
let SLEEP_DAYS = 14;
function sleepRef(d){ const m=monthsDone(d); return m<4?[14,17,"0–3 個月"]:m<12?[12,16,"4–12 個月"]:m<36?[11,14,"1–2 歲"]:[10,13,"3–5 歲"]; }
function sleepDay(dayIso){
  const d0=pd(dayIso).getTime(), d1=d0+DAY, nowT=Date.now(); const segs=[];
  DATA.logs.filter(l=>l.k==="sleep").forEach(l=>{ const s=pdt(l.t).getTime(), e=l.end?pdt(l.end).getTime():nowT; const a=Math.max(s,d0), b=Math.min(e,d1); if(b>a) segs.push({a,b,run:!l.end,own:s>=d0}); });
  segs.sort((p,q)=>p.a-q.a);
  const m=[]; segs.forEach(s=>{ const p=m[m.length-1]; if(p && s.a<=p.b){ p.b=Math.max(p.b,s.b); p.run=p.run||s.run; p.own=p.own||s.own; } else m.push(Object.assign({},s)); });
  return {d:dayIso, segs:m, tot:m.reduce((a,s)=>a+s.b-s.a,0), n:m.length, has:m.some(s=>s.own)};
}
const hhmm = t => { const d=new Date(t); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const hrs = ms => (ms/3600000).toFixed(1);
let sleepSel=null;
function renderSleep(){
  const svg=$("sleepChart"); if(!svg) return;
  const T=todayD(), days=[];
  for(let i=SLEEP_DAYS-1;i>=0;i--){ const dt=new Date(T); dt.setDate(dt.getDate()-i); if(dt<BIRTH) continue; days.push(Object.assign(sleepDay(iso(dt)),{live:i===0, age:ageDaysAt(dt)})); }
  const ref=sleepRef(T);
  const done=days.filter(x=>!x.live && x.has), l7=done.slice(-7);
  const since=T.getTime()-7*DAY;
  const L=DATA.logs.filter(l=>l.k==="sleep" && l.end && pdt(l.end).getTime()>=since).sort((a,b)=>a.t<b.t?-1:1);
  const longest=L.length?Math.max(...L.map(l=>pdt(l.end)-pdt(l.t))):null;
  const gaps=[]; for(let i=1;i<L.length;i++){ const g=pdt(L[i].t)-pdt(L[i-1].end); if(g>0 && g<12*3600000) gaps.push(g); }
  const chip=(v,lbl)=>`<div class="stat"><b>${v}</b><span>${lbl}</span></div>`;
  $("sleepStats").innerHTML = chip(l7.length?hrs(avg(l7.map(x=>x.tot))):"—", `近 ${l7.length||7} 天平均睡（時）`) + chip(longest!=null?hrs(longest):"—","最長一段（時）") + chip(gaps.length?hrs(avg(gaps)):"—","兩段睡之間醒（時）") + chip(`${ref[0]}–${ref[1]}`,"建議（時／天）");
  const any=days.some(x=>x.n);
  ["sleepChart","sleepLegend","sleepTip"].forEach(id=>$(id).hidden=!any);
  if(!any){ $("sleepNote").innerHTML = `近 ${SLEEP_DAYS} 天還沒有睡眠紀錄。在「今天」頁按「睡了」，醒來按「醒了」；忘了按可以用下面「補登一段睡眠」。月子中心紀錄本只寫「睡眠：佳」，沒有時間，所以不畫進來。建議睡眠時數（含小睡）：${ref[2]} 每天 ${ref[0]}–${ref[1]} 小時（CDC）。`; return; }
  const W=360, pl=38, pr=34, pt=16, rh=13, gp=4, n=days.length, H=pt+n*(rh+gp)+2;
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
  const X=ms=>pl+(ms/DAY)*(W-pl-pr);
  let s="";
  [0,6,12,18,24].forEach(h=>{ const x=X(h*3600000).toFixed(1); s+=`<line x1="${x}" x2="${x}" y1="${pt-3}" y2="${H}" stroke="var(--line)" stroke-width="0.6"/><text x="${x}" y="${pt-5}" text-anchor="middle">${h}時</text>`; });
  if(sleepSel!=null && !days[sleepSel]) sleepSel=null;
  const lastIdx=(()=>{ for(let i=days.length-1;i>=0;i--) if(days[i].has) return i; return days.length-1; })();
  const selI = sleepSel!=null ? sleepSel : lastIdx;
  days.forEach((x,i)=>{
    const y=pt+i*(rh+gp), d0=pd(x.d).getTime(), w=W-pl-pr;
    if(i===selI) s+=`<rect x="1" y="${y-1.5}" width="${W-2}" height="${rh+3}" rx="4" fill="var(--accent-soft)"/>`;
    s+= x.has ? `<rect x="${pl}" y="${y}" width="${w}" height="${rh}" rx="3" fill="var(--grey-soft)" stroke="var(--line)" stroke-width="0.6"/>`
            : `<rect x="${pl+0.5}" y="${y+0.5}" width="${w-1}" height="${rh-1}" rx="3" fill="none" stroke="var(--muted)" stroke-width="0.7" stroke-dasharray="3 3"/>`;
    x.segs.forEach(g=>{ const a=X(g.a-d0), b=X(g.b-d0); s+=`<rect x="${a.toFixed(1)}" y="${y}" width="${Math.max(1.5,b-a).toFixed(1)}" height="${rh}" rx="2" fill="var(--accent)"${g.run?' opacity="0.5"':""}/>`; });
    s+=`<text x="${pl-5}" y="${y+rh-3}" text-anchor="end">${x.live?"今天":x.d.slice(5).replace("-","/").replace(/^0/,"")}</text>`;
    s+=`<text x="${W-pr+4}" y="${y+rh-3}" style="fill:var(--ink)">${x.has?hrs(x.tot):"—"}</text>`;
    s+=`<rect class="hit" data-i="${i}" x="0" y="${y-gp/2}" width="${W}" height="${rh+gp}" fill="transparent" style="cursor:pointer"/>`;
  });
  svg.innerHTML=s;
  const x=days[selI], d0=pd(x.d).getTime();
  const tip=[`<div class="full"><b>${x.d.slice(5).replace("-","/")}</b>　出生第 ${x.age} 天${x.live?"（今天，還沒結束）":""}${sleepSel==null?'　<span class="note">點其他天看細節</span>':""}</div>`];
  if(!x.has) tip.push(`<div class="full note">這天沒有睡眠紀錄${x.n?"（只有前一晚睡過午夜的那一段）":""}。</div>`);
  else {
    tip.push(`<div>睡 <b>${hrs(x.tot)}</b> 時（${x.n} 段）</div><div>${x.live?"":`醒著 <b>${hrs(DAY-x.tot)}</b> 時`}</div>`);
    tip.push(`<div class="full">${x.segs.map(g=>`${hhmm(g.a)}–${g.run?"睡覺中":(g.b>=d0+DAY?"24:00":hhmm(g.b))}`).join("、")}</div>`);
    if(!x.live) tip.push(`<div class="full note">醒著＝24 小時減掉有記到的睡眠；漏記的睡眠會被算成醒著。跨過午夜的那段，會分在兩天。</div>`);
  }
  $("sleepTip").innerHTML=tip.join("");
  svg.querySelectorAll(".hit").forEach(r=>r.addEventListener("click",()=>{ sleepSel=+r.dataset.i; renderSleep(); }));
  const a7=l7.length?avg(l7.map(x=>x.tot))/3600000:null;
  $("sleepNote").innerHTML = [
    `建議睡眠時數（含小睡）：${ref[2]} 每天 ${ref[0]}–${ref[1]} 小時（CDC）。`,
    a7!=null ? `近 ${l7.length} 天有紀錄的日子平均 ${a7.toFixed(1)} 小時${a7<ref[0]?"，低於建議，但也可能是有幾段睡眠沒記到；先確認紀錄完整，再觀察精神和喝奶":""}。` : "",
    "長條右邊的數字是當天睡了幾小時。"
  ].filter(Boolean).join("");
}

/* ---------- one-line intake verdict (uses the same thresholds as the Today auto-check) ---------- */
function renderIntakeAdvice(){

  if(!done.length){ box.innerHTML=`<div class="okline">還沒有完整一天的喝奶紀錄。</div>`; return; }

  const l3=done.slice(-3), a=Math.round(avg(l3.map(x=>x.tot))), k=Math.round(avg(l3.map(x=>x.mlkg))), r=l3[l3.length-1].ref;
  box.innerHTML=`<div class="okline"><b>正常</b>：近 ${l3.length} 天平均每天瓶餵 ${a} ml（每公斤 ${k} ml${r?`，參考約 ${Math.round(r/10)*10} ml`:""}），尿布次數也足夠。</div>`;

/* day-total form */
(function(){
  const f=$("dform"); if(!f) return;
  const dIn=$("d-date"); dIn.value=iso(todayD()); dIn.max=iso(todayD()); dIn.min=iso(BIRTH);
  const fill=()=>{ const x=DATA.days.find(z=>z.d===dIn.value); ["fm","bm","bf","wet","poop"].forEach(k=>{ $("d-"+k).value = x && x[k]!=null ? x[k] : ""; }); $("d-note").value = x && x.n ? x.n : ""; $("d-msg").textContent = x ? "這天已有總數，改完按儲存會覆蓋。" : ""; $("d-msg").className="msg"; };
  dIn.addEventListener("change", fill); fill();
  $("dayFormClose").addEventListener("click",()=>{ $("dayFormPanel").hidden=true; });
  f.addEventListener("submit", e=>{
    e.preventDefault();
    const m=$("d-msg"); m.className="msg"; const err=t=>{ m.className="msg err"; m.textContent=t; };
    const d=dIn.value; if(!d) return err("請選日期");
    if(d>iso(todayD()) || d<iso(BIRTH)) return err("日期要在出生日到今天之間");
    const nL=logsOn(d).filter(l=>["bf","bottle","diaper"].includes(l.k)).length; if(nL) return err(`這天已經有 ${nL} 筆逐筆紀錄，總量會以逐筆為準；要補請在「今天」頁按鈕補記。`);
    const num=k=>{ const v=$("d-"+k).value.trim(); if(v==="") return null; const x=Number(v); return Number.isFinite(x)&&x>=0 ? Math.round(x*10)/10 : NaN; };
    const x={d, fm:num("fm"), bm:num("bm"), bf:num("bf"), wet:num("wet"), poop:num("poop")};
    if(["fm","bm","bf","wet","poop"].some(k=>Number.isNaN(x[k]))) return err("數字格式不對");
    if(["fm","bm","bf","wet","poop"].every(k=>x[k]==null)) return err("至少填一項");
    x.fm=x.fm||0; x.bm=x.bm||0; x.bf=x.bf||0;
    const old=DATA.days.find(z=>z.d===d);
    const note=$("d-note").value.trim(); if(note) x.n=note; else if(old && old.n) x.n=old.n;
    x.src = old && old.src ? old.src : "手動補登每日總數";
    if(commit({o:"day", x})){ m.textContent="已存"; $("dayFormPanel").hidden=true; }
    else if(MODE==="rw") m.textContent="跟原本一樣，沒有變更";
  });
})();

/* ---------- copy helpers ---------- */
async function copyText(t, btn, okLabel){
  const orig=btn.textContent;
  try{ await navigator.clipboard.writeText(t); btn.textContent=okLabel||"已複製"; }
  catch(e){ const ta=el("textarea"); ta.value=t; ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select(); let ok=false; try{ ok=document.execCommand("copy"); }catch(_){} ta.remove(); btn.textContent= ok?(okLabel||"已複製"):"無法自動複製，請長按選取"; }
  setTimeout(()=>btn.textContent=orig,2500);
}
function docData(){
  const T=todayD(), a=ageDaysAt(now());
  const ws=sortedGrowth().filter(r=>r.w); const lw=ws[ws.length-1];
  const gl=sortedGrowth().filter(r=>r.l).pop(), gh=sortedGrowth().filter(r=>r.h).pop();
  let gain=null; if(lw){ const prev=ws.slice().reverse().find(r=>dayOf(lw)-dayOf(r)>=5); if(prev){ const dd=dayOf(lw)-dayOf(prev); gain={from:prev, dd, g:Math.round((lw.w-prev.w)/dd)}; } }
  const rows=[]; for(let i=1;i<=7;i++){ const d=new Date(T); d.setDate(d.getDate()-i); if(d<BIRTH) break; const k=iso(d); const s=dayStats(k); if(!s.imp && !logsOn(k).length) continue; rows.push({d:k, s, mlkg:Math.round((s.fm+s.bm)/(weightOn(k)/1000))}); }
  const follow=ITEMS.filter(i=>i.cat==="med" && i.sub==="follow" && !DATA.checks[i.id]).sort((p,q)=>sortKey(p)-sortKey(q));
  const since=new Date(T); since.setDate(since.getDate()-14);
  const alerts=DATA.logs.filter(l=>pdt(l.t)>=since && isAlert(l));
  const notes=DATA.logs.filter(l=>l.k==="note" && pdt(l.t)>=since).sort((p,q)=>p.t<q.t?-1:1).slice(-8);
  const qs=DATA.qs.filter(q=>!q.done);
  return {a, lw, gl, gh, gain, rows, follow, alerts, notes, qs, flags:healthFlags().flags};
}
const plain = h => String(h).replace(/<[^>]+>/g,"").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&amp;/g,"&");
/* ---------- 檢查報告（v45）：程式內建既有報告，之後新增的寫在 DATA.reports，同 id 會覆蓋 ----------
   report = {id, d:"YYYY-MM-DD", name, st:"正常|追蹤|待複檢|異常|已結束", key:[重點…], next, file} */

/* ---------- 文字大小（每支手機各自記在 ly-fs；只改執行中的樣式，不會寫進存檔） ---------- */
const FS_MIN=85, FS_MAX=160;
let fsK=1, fsRules=null;
function fsCollect(){
  fsRules=[];
  const walk=rs=>{ for(const r of rs){ if(r.style){ const v=(r.style.getPropertyValue("font-size")||"").trim(); if(/^[\d.]+px$/.test(v)) fsRules.push([r.style, parseFloat(v), r.style.getPropertyPriority("font-size")]); } if(r.cssRules && r.cssRules.length) walk(r.cssRules); } };
  for(const sh of document.styleSheets){ let rs=null; try{ rs=sh.cssRules; }catch(e){} if(rs) walk(rs); }
}
function fsInline(root){
  const one=el=>{ if(!el || !el.style) return; let b=el.dataset.fs0; if(!b){ const v=el.style.fontSize||""; if(!/px$/.test(v)) return; b=el.dataset.fs0=String(parseFloat(v)); } el.style.fontSize = fsK===1 ? b+"px" : (b*fsK).toFixed(2)+"px"; };
  if(root.matches && root.matches('[style*="font-size"]')) one(root);
  if(root.querySelectorAll) root.querySelectorAll('[style*="font-size"]').forEach(one);
}
function fsApply(pct, save){
  pct=Math.round((+pct||100)/5)*5; pct=Math.max(FS_MIN, Math.min(FS_MAX, pct)); fsK=pct/100;
  try{ if(!fsRules) fsCollect(); fsRules.forEach(([st,b,p])=>st.setProperty("font-size", fsK===1 ? b+"px" : (b*fsK).toFixed(2)+"px", p)); }catch(e){}
  fsInline(document.body);
  document.documentElement.classList.toggle("fs-big", fsK>=1.2);
  const r=$("fsRange"), v=$("fsVal"), b=$("fsBtn");
  if(r && +r.value!==pct) r.value=String(pct); if(v) v.textContent=pct+"%"; if(b) b.classList.toggle("on", pct!==110);
  if(save){ try{ ls.set("ly-fs", String(pct)); }catch(e){} }
}
function fsOpen(open){ const p=$("fsPanel"), b=$("fsBtn"); if(!p) return; p.hidden=!open; if(b) b.setAttribute("aria-expanded", String(open)); }
try{ new MutationObserver(ms=>{ if(fsK===1) return; ms.forEach(m=>m.addedNodes.forEach(n=>{ if(n.nodeType===1) fsInline(n); })); }).observe(document.body,{childList:true,subtree:true}); }catch(e){}
$("fsBtn").addEventListener("click",()=>fsOpen($("fsPanel").hidden));

   shell 的 #v-log 加 <div class="rsec" data-rsec="id" hidden>…</div>，並在 renderRView 加它的 render。 */
const RVIEWS = [
 {id:"home", name:"總覽"},

 {id:"sleep", name:"睡眠", card:rcSleep},

let rsec = "home";
function spark(vals, opt={}){
  const v=vals.filter(x=>x!=null && isFinite(x)); if(v.length<2) return "";
  const W=120,H=30,p=3; let mn=Math.min(...v), mx=Math.max(...v); if(opt.ref!=null){ mn=Math.min(mn,opt.ref); mx=Math.max(mx,opt.ref); } if(mx===mn){ mx+=1; mn-=1; }
  const X=i=>p+i*(W-2*p)/Math.max(1,vals.length-1), Y=x=>H-p-(x-mn)/(mx-mn)*(H-2*p);
  let d="", L=null; vals.forEach((x,i)=>{ if(x==null||!isFinite(x)) return; d+=(d?"L":"M")+X(i).toFixed(1)+","+Y(x).toFixed(1); L=i; });

  else { setMode("ro"); if(pending.length){ pending=[]; savePending(); } roDiagnose(a, u); }
})();
function setLinkUI(url, label){
  const has = !!url;
  $("roLinkRow").hidden = !has; $("roUrl").hidden = !has;
  if(has){ $("roLink").href = url; $("roLink").textContent = label; $("roUrl").textContent = url; }
}
/* The viewer frame's window.name carries {"usable":[...]} — the capabilities this view may run. Used only to explain, never to decide. */
function frameInfo(){ try{ const o = JSON.parse(window.name || "null"); if(o && Array.isArray(o.usable)) return o; }catch(e){} return null; }
function uaTag(){ const ua = navigator.userAgent || ""; if(/Line\//i.test(ua)) return "LINE內建"; if(/FBAN|FBAV|Instagram|Messenger/i.test(ua)) return "FB內建"; if(/CriOS|Chrome/i.test(ua)) return "Chrome"; if(/Safari/i.test(ua)) return "Safari"; return "其他"; }
async function roDiagnose(a, u){
  let me = null, can = null;
  if(u){ try{ me = await u.me(); }catch(e){ me = null; } try{ can = await u.canEdit(); }catch(e){ can = null; } }
  const fi = frameInfo();
  const steps = [];
  $("roText").textContent = "目前只能看，不能記錄。";
  if(!fi && !a && !u){
    steps.push("這個畫面不在 Claude 裡打開（常見：從 LINE、Messenger、郵件 App 直接點開，那是 App 內建的瀏覽器，沒有你的 Claude 登入）。");
    steps.push("請按右上角「⋯」選「用預設瀏覽器開啟」，或把下面的連結貼到 Safari／Chrome，用受邀請的 Email 登入 claude.ai。");
  } else {
    steps.push("Claude 有打開這一頁，但你目前的身分只能看。先看右上角頭像：登入的必須是<b>被邀請的那個 Email</b>。");
    steps.push("打開 Claude 寄來的英文邀請信 → 按「<b>View invitation</b>」→ 用受邀 Email 登入 → 按「<b>Accept and open</b>」。沒按接受之前都只能看；邀請 30 天內有效。");
    steps.push("張爸確認：這一頁右上角「分享」→「一般存取」選「<b>Only people invited</b>（僅限受邀者）」、你的身分是「<b>Editor</b>」。只要開成「Anyone with the link」，受邀的人一律只能看（Claude 官方說明）。");
    steps.push("做完把這一頁完全關掉再重開。");
  }
  const diag = "診斷：" + (fi ? "Claude 檢視器・可用功能 [" + fi.usable.join(",") + "]" : "不在 Claude 檢視器") + "・發布 " + (a?"✓":"✗") + "・身分 " + (u?"✓":"✗") + "・可編輯 " + (can===null?"?":can) + "・" + (me && me.id ? "有帳號 id" : "無帳號 id") + "・" + uaTag();
  $("roDiag").innerHTML = "<ol>" + steps.map(s=>"<li>"+s+"</li>").join("") + "</ol>" + '<div class="mono" style="font-size:11.5px;margin-top:6px;word-break:break-all">' + esc(diag) + "</div>";
  setLinkUI(LINKS.family, "重新開啟家人編輯版");
}
function renderMirror(){
  const syn = MIRROR.synced ? String(MIRROR.synced) : "";
  const upd = DATA.updated ? new Date(DATA.updated) : null;
  const updTxt = upd && !isNaN(upd) ? `${pad(upd.getMonth()+1)}/${pad(upd.getDate())} ${pad(upd.getHours())}:${pad(upd.getMinutes())}` : "";
  $("roText").textContent = "家人公開版：不用登入就能看";
  $("roDiag").innerHTML = `資料由照顧者在「家人編輯版」記錄，每天自動同步到這裡 5 次（04:50、08:50、12:50、17:50、21:50）。` + (syn?`<br>公開版更新於：<b class="mono">${esc(syn)}</b>`:"") + (updTxt?`・資料最後更新：<b class="mono">${esc(updTxt)}</b>`:"") + `<br>照顧者要記錄餵奶、尿布，請開家人編輯版（需用受邀的 Email 登入 Claude）。`;
  setLinkUI(LINKS.family, "照顧者：開啟家人編輯版");
  $("roUrl").hidden = true;
}
function renderLinks(){
  const p = $("linksPanel"); if(!p) return;
  p.hidden = !!MIRROR || !LINKS.family;
  $("famUrl").textContent = LINKS.family;
  $("copyPub").onclick = async ()=>{
    let ok = false;
    try{ await navigator.clipboard.writeText(LINKS.family); ok = true; }catch(e){ ok = false; }
    if(!ok){ try{ const r=document.createRange(); r.selectNodeContents($("famUrl")); const s=getSelection(); s.removeAllRanges(); s.addRange(r); ok = document.execCommand("copy"); }catch(e){ ok=false; } }
    showSave(ok ? "已複製連結（對方要先被邀請才能開）" : "請長按上面的連結自己複製", 3000);
  };
}
